# One-off research: level 1 skill, setup and early lane results for one matchup (Riot match + timeline only).
name: Skill starts (matchup)

on:
  workflow_dispatch:
    inputs:
      a: { description: "Champion A", default: "Garen" }
      b: { description: "Champion B", default: "Darius" }
      role: { description: "Role", default: "TOP" }
      days: { description: "Days back", default: "30" }
      minutes: { description: "Minutes to search", default: "90" }
      regions: { description: "Regions", default: "na1,euw1,kr" }

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check the key's shape (never prints it)
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python3 -c "import os,re;k=os.environ.get('RIOT_API_KEY','');print('length',len(k),'| starts RGAPI-',k.startswith('RGAPI-'),'| spaces/newlines',bool(re.search(r'\s',k)),'| quotes',('\x22' in k) or (\"'\" in k))"
          curl -s -o /dev/null -w "Riot status check: HTTP %{http_code}\n" -H "X-Riot-Token: $(echo -n "$RIOT_API_KEY" | tr -d '[:space:]')" https://na1.api.riotgames.com/lol/status/v4/platform-data
      - name: Pull
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python3 scripts/research/skill_starts.py --a "${{ inputs.a }}" --b "${{ inputs.b }}" --role "${{ inputs.role }}" \
            --days "${{ inputs.days }}" --minutes "${{ inputs.minutes }}" --regions "${{ inputs.regions }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-starts
          path: research/
          retention-days: 7
