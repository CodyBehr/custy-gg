# One-off research pulls (rank comparisons). Run by hand; games come back as an artifact.
name: Research pull (ranked games by rank group)

on:
  workflow_dispatch:
    inputs:
      groups:
        description: "Rank groups, comma separated (BRONZE,SILVER,GOLD,EMERALD,DIAMOND,MASTER+)"
        default: "EMERALD,DIAMOND,MASTER+"
      per_group:
        description: "Games per group"
        default: "350"
      minutes:
        description: "Time budget in minutes"
        default: "320"

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Pull
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          python3 scripts/research/pull_ranks.py --out research --groups "${{ inputs.groups }}" \
            --per-group "${{ inputs.per_group }}" --minutes "${{ inputs.minutes }}" --skip scripts/research/seen_rank_study.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-games
          path: research/
          retention-days: 7
