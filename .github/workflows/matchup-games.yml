# Finds NA high-elo games of one lane matchup on the current patch (public/experts/<A>-<B>-<ROLE>.json), for custy
# coach to download as expert replays. Run by hand from the Actions tab. Needs the repository secret RIOT_API_KEY.
name: Matchup games (find)

on:
  workflow_dispatch:
    inputs:
      a: { description: "Champion A", default: "Garen" }
      b: { description: "Champion B", default: "Darius" }
      role: { description: "Role", default: "TOP" }
      minutes: { description: "Minutes to search", default: "100" }
      want: { description: "Games wanted", default: "25" }

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Find games
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          V=$(curl -s https://ddragon.leagueoflegends.com/api/versions.json | python3 -c "import json,sys;print('.'.join(json.load(sys.stdin)[0].split('.')[:2]))")
          echo "Patch $V"
          python3 scripts/research/matchup_games.py --a "${{ inputs.a }}" --b "${{ inputs.b }}" --role "${{ inputs.role }}" \
            --patch "$V" --minutes "${{ inputs.minutes }}" --want "${{ inputs.want }}"
      - name: Commit
        run: |
          git config user.name "custy-bot"; git config user.email "actions@users.noreply.github.com"
          git add public/experts
          git diff --cached --quiet && exit 0
          git commit -m "Expert games: ${{ inputs.a }} vs ${{ inputs.b }} ${{ inputs.role }}"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
