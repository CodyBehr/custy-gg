# Builds collector/custy_collector.py into a one-click Windows app and commits
# it to collector-dist/, where the website picks it up for downloads.
name: Build Windows collector

on:
  push:
    branches: [main]
    paths:
      - "collector/custy_collector.py"
      - "collector/windows_app.py"
      - "collector/review.py"
      - "collector/review.html"
      - "collector/icon.ico"
      - "collector/replay_trades.py"
      - "collector/replay_deaths.py"
      - "collector/champselect.py"
      - "collector/overlay.py"
      - "collector/edition.py"
      - "collector/assets/**"
      - "collector/version_info.txt"
      - ".github/workflows/build-collector.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-collector
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller and tray libraries
        run: pip install pyinstaller==6.11.1 pystray==0.19.5 pillow==11.0.0 zstandard==0.23.0

      - name: Stamp the version from custy_collector.py into the file details
        shell: bash
        run: |
          V=$(sed -n 's/^VERSION = "\([0-9.]*\)".*/\1/p' collector/custy_collector.py)
          IFS=. read -r A B C <<< "$V"
          sed -i -E "s/filevers=\([0-9, ]+\)/filevers=($A, $B, ${C:-0}, 0)/; s/prodvers=\([0-9, ]+\)/prodvers=($A, $B, ${C:-0}, 0)/; s/'(FileVersion|ProductVersion)', '[0-9.]+'/'\1', '$V'/g" collector/version_info.txt
          grep -E "ProductVersion|filevers" collector/version_info.txt

      - name: Build custy-collector.exe
        run: >
          pyinstaller --onefile --noconsole --name custy-collector
          --icon collector/icon.ico --add-data "collector/icon.ico;." --add-data "collector/review.html;."
          --version-file collector/version_info.txt
          --paths collector --hidden-import windows_app --hidden-import edition --hidden-import tkinter --hidden-import pystray._win32
          collector/custy_collector.py

      # custy coach: the game review app (same code, built as its own app; see collector/edition.py)
      - name: Build custy-coach.exe
        shell: bash
        run: |
          printf 'EDITION = "coach"\n' > collector/edition.py
          sed -e "s/'FileDescription', 'custy.gg collector'/'FileDescription', 'custy coach'/" \
              -e "s/'ProductName', 'custy.gg collector'/'ProductName', 'custy coach'/" \
              -e "s/custy-collector/custy-coach/g" \
              -e "s/Uploads League of Legends custom games to custy.gg./Reviews your League of Legends games./" \
              collector/version_info.txt > collector/version_info_coach.txt
          pyinstaller --onefile --noconsole --name custy-coach \
            --icon collector/icon.ico --add-data "collector/icon.ico;." --add-data "collector/review.html;." --add-data "collector/assets;assets" \
            --version-file collector/version_info_coach.txt \
            --paths collector --hidden-import windows_app --hidden-import edition --hidden-import review --hidden-import overlay \
            --hidden-import champselect --hidden-import replay_trades --hidden-import replay_deaths --hidden-import zstandard --hidden-import tkinter --hidden-import pystray._win32 \
            collector/custy_collector.py

      - name: Check the app starts and reads attached settings
        shell: bash
        run: |
          cp dist/custy-collector.exe selftest.exe
          printf '\n#CUSTY-CONFIG#{"site_url":"https://example.test","ingest_key":"abc"}#END-CUSTY-CONFIG#' >> selftest.exe
          ./selftest.exe --selftest selftest.json
          for i in $(seq 1 30); do [ -s selftest.json ] && break; sleep 1; done
          cat selftest.json
          grep -q '"frozen": true' selftest.json
          grep -q '"site_url": "https://example.test"' selftest.json
          V=$(sed -n 's/^VERSION = "\([0-9.]*\)".*/\1/p' collector/custy_collector.py)
          grep -q "\"version\": \"$V\"" selftest.json
          cp dist/custy-coach.exe selftest-coach.exe
          printf '\n#CUSTY-CONFIG#{"site_url":"https://example.test","ingest_key":"abc"}#END-CUSTY-CONFIG#' >> selftest-coach.exe
          ./selftest-coach.exe --selftest selftest-coach.json
          for i in $(seq 1 30); do [ -s selftest-coach.json ] && break; sleep 1; done
          cat selftest-coach.json
          grep -q '"edition": "coach"' selftest-coach.json
          grep -q '"zstandard": true' selftest-coach.json

      - name: Commit the app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Put the new build on top of whatever main is now (an earlier build may have landed meanwhile).
          git fetch origin main
          git reset --hard origin/main
          mkdir -p collector-dist
          cp dist/custy-collector.exe collector-dist/custy-collector.exe
          cp dist/custy-coach.exe collector-dist/custy-coach.exe
          git add collector-dist/custy-collector.exe collector-dist/custy-coach.exe
          git commit -m "Build custy-collector.exe and custy-coach.exe from ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:main
