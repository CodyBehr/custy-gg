# Lists a few NA Challenger games on the current patch (for testing expert replay downloads). Run by hand.
name: Expert games (list)

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "Patch prefix"
        default: "16.22"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: List
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python3 scripts/research/expert_games.py "${{ inputs.patch }}"
