# Health per minute and death times for the laners in an expert game list (public/experts/<set>.timelines.json).
name: Expert timelines

on:
  workflow_dispatch:
    inputs:
      set: { description: "Expert set", default: "Garen-Darius-TOP" }

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch timelines
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python3 scripts/research/expert_timelines.py "${{ inputs.set }}"
      - name: Commit
        run: |
          git config user.name "custy-bot"; git config user.email "actions@users.noreply.github.com"
          git add public/experts
          git diff --cached --quiet && exit 0
          git commit -m "Expert timelines: ${{ inputs.set }}"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
