<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>custy.gg game review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --night:#0d1424; --deck:#141d31; --deck-2:#1a2540; --line:#253150; --line-soft:#1d2843;
  --ink:#e6ebf5; --mute:#8f9ab4; --faint:#5d6987;
  --blue:#4f9dff; --blue-ink:#9cc8ff; --blue-wash:rgba(79,157,255,.11);
  --red:#f2596b; --red-ink:#ff9aa6; --red-wash:rgba(242,89,107,.1);
  --gold:#e3b866; --gold-wash:rgba(227,184,102,.12);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--night); color:var(--ink); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
header { display:flex; align-items:baseline; gap:12px; padding:14px 22px; border-bottom:1px solid var(--line-soft); }
header b { font-size:18px; letter-spacing:.3px; } header b span { color:var(--gold); }
header .tag { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--night); background:var(--gold); padding:1px 7px; border-radius:4px; }
header button { margin-left:4px; }
header .who { margin-left:auto; color:var(--mute); font-size:13px; }
main { display:grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 54px); }
aside { border-right:1px solid var(--line-soft); overflow-y:auto; max-height: calc(100vh - 54px); }
.filter { display:flex; gap:6px; padding:10px 14px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap; }
.filter button { padding:3px 10px; border-radius:20px; font-size:12px; }
.filter button.on { background:var(--blue); border-color:var(--blue); color:#06101f; font-weight:600; }
aside .note { padding:10px 14px; color:var(--mute); font-size:13px; border-bottom:1px solid var(--line-soft); }
.game { display:flex; gap:10px; align-items:center; padding:9px 14px; border-left:3px solid transparent; cursor:pointer; border-bottom:1px solid var(--line-soft); }
.game:hover { background:var(--deck); }
.game.on { background:var(--deck-2); }
.game.w { border-left-color:var(--blue); } .game.l { border-left-color:var(--red); }
.game img { width:38px; height:38px; border-radius:6px; }
.game .t { font-size:13px; line-height:1.35; } .game .t small { color:var(--mute); display:block; }
.game .kda { margin-left:auto; text-align:right; font-size:13px; } .game .kda small { color:var(--faint); display:block; }
section { padding:22px 28px; max-width:1400px; }
section.wide { max-width:none; }
h1 { font-size:22px; margin:0 0 2px; } h2 { font-size:15px; margin:26px 0 10px; color:var(--mute); text-transform:uppercase; letter-spacing:.8px; font-weight:600; }
.sub { color:var(--mute); font-size:13px; }
.vs { display:flex; align-items:center; gap:12px; }
.vs { margin-bottom:12px; } .yt { display:inline-block; }
.vs img { width:52px; height:52px; border-radius:8px; }
.win { color:var(--blue-ink); } .loss { color:var(--red-ink); }
.card { background:var(--deck); border:1px solid var(--line-soft); border-radius:12px; padding:14px 16px; }
.banner { background:var(--gold-wash); border:1px solid rgba(227,184,102,.35); border-radius:10px; padding:10px 14px; margin-top:14px; font-size:14px; display:flex; gap:12px; align-items:center; }
.banner button { margin-left:auto; }
button, .btn { font:inherit; font-size:13px; background:var(--deck-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; text-decoration:none; white-space:nowrap; }
button:hover, .btn:hover { border-color:var(--blue); }
button.primary { background:var(--blue); border-color:var(--blue); color:#06101f; font-weight:600; }
button:disabled { opacity:.5; cursor:default; }
svg text { fill:var(--mute); font-size:11px; }
.moment { display:grid; grid-template-columns: 120px 1fr auto; gap:16px; align-items:start; padding:14px 0; border-top:1px solid var(--line-soft); }
.moment:first-child { border-top:0; }
.moment .when { font-weight:600; font-size:16px; } .moment .when small { display:block; color:var(--red-ink); font-weight:400; font-size:12px; }
.moment .part { margin-bottom:6px; } .moment .part > b { display:block; }
.moment ul { margin:8px 0 0; padding-left:18px; color:var(--mute); font-size:13px; }
.moment .cmp { font-size:13px; color:var(--mute); } .moment .cmp b { color:var(--ink); font-weight:600; }
.moment .acts { display:flex; flex-direction:column; gap:6px; }
.timings { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:10px; }
.timings .card { padding:10px 12px; } .timings .k { color:var(--mute); font-size:12px; } .timings .v { font-size:18px; font-weight:600; }
.timings .d { font-size:12px; color:var(--faint); }
.bad { color:var(--red-ink) !important; } .good { color:var(--blue-ink) !important; }
.toast { position:fixed; right:18px; bottom:18px; background:var(--deck-2); border:1px solid var(--line); border-radius:10px; padding:10px 14px; max-width:420px; font-size:14px; box-shadow:0 8px 30px rgba(0,0,0,.4); display:none; }
.empty { color:var(--mute); padding:40px 0; }
.tabs { display:flex; gap:6px; margin-top:18px; border-bottom:1px solid var(--line-soft); }
.tabs button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; padding:8px 14px; font-size:14px; color:var(--mute); }
.tabs button.on { color:var(--ink); border-bottom-color:var(--gold); }
table.grid { width:100%; border-collapse:collapse; font-size:13px; }
table.grid th { text-align:left; color:var(--mute); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
table.grid td { padding:8px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
table.grid td .y { font-size:15px; font-weight:600; } table.grid td .e { color:var(--faint); font-size:12px; display:block; }
.finding { padding:10px 0; border-top:1px solid var(--line-soft); } .finding:first-child { border-top:0; }
.finding b { display:block; } .finding span { color:var(--mute); font-size:13px; }
.seg { display:inline-flex; gap:4px; margin-bottom:8px; } .seg button { padding:3px 10px; font-size:12px; border-radius:20px; }
.seg button.on { background:var(--blue); border-color:var(--blue); color:#06101f; font-weight:600; }
.homerow { padding:12px 14px; cursor:pointer; border-bottom:1px solid var(--line-soft); border-left:3px solid transparent; }
.homerow:hover { background:var(--deck); } .homerow.on { background:var(--deck-2); border-left-color:var(--gold); }
.homerow b { display:block; color:var(--gold); letter-spacing:.3px; } .homerow small { color:var(--mute); font-size:12px; }
.hero { display:grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); gap:14px; margin-top:16px; align-items:stretch; }
.hero .card { padding:22px 24px; position:relative; overflow:hidden; }
.hero .gap { background:radial-gradient(120% 140% at 0% 0%, rgba(242,89,107,.22), transparent 60%), var(--deck); border-color:rgba(242,89,107,.45); }
.hero .edge { background:radial-gradient(120% 140% at 0% 0%, rgba(79,157,255,.2), transparent 60%), var(--deck); border-color:rgba(79,157,255,.4); }
.hero .eyebrow { font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--mute); font-weight:700; }
.hero .big { font-size:68px; line-height:1; font-weight:800; letter-spacing:-2px; margin:10px 0 8px; }
.hero .edge .big { font-size:44px; letter-spacing:-1px; }
.hero h3 { margin:0; font-size:21px; line-height:1.25; } .hero .edge h3 { font-size:16px; }
.hero p { margin:8px 0 0; color:var(--mute); font-size:13px; }
.trend-up { color:var(--blue-ink); } .trend-down { color:var(--red-ink); }
.reel { margin-top:14px; border-top:1px solid var(--line-soft); padding-top:10px; display:none; } .reel.open { display:block; }
.reel div { display:flex; gap:10px; align-items:center; padding:5px 0; font-size:13px; } .reel div span { flex:1; color:var(--mute); } .reel div span b { color:var(--ink); }
.reel button { padding:2px 9px; }
.score { display:grid; grid-template-columns: 210px 78px 78px 1fr 60px; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line-soft); font-size:13px; }
.score:first-of-type { border-top:0; } .score.h { color:var(--mute); font-weight:600; padding-top:0; }
.score .y { font-weight:700; font-size:15px; } .score .n { color:var(--faint); font-size:12px; text-align:right; }
.track { position:relative; height:12px; border-radius:6px; background:linear-gradient(90deg, rgba(242,89,107,.16), rgba(255,255,255,.03) 38%, rgba(255,255,255,.03) 62%, rgba(79,157,255,.16)); }
.track .zone { position:absolute; left:37.5%; width:25%; top:0; bottom:0; background:rgba(255,255,255,.09); border-left:1px solid var(--line); border-right:1px solid var(--line); }
.track i { position:absolute; top:-4px; width:20px; height:20px; margin-left:-10px; border-radius:50%; background:var(--gold); border:3px solid var(--night); }
.track i.bad { background:var(--red); } .track i.good { background:var(--blue); }
.dgrid { display:grid; gap:14px; margin-top:14px; align-items:start; grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-template-areas: "radar radar curve curve curve" "deaths deaths deaths map map" "games games games games games" "pool pool pool pool pool"; }
.a-radar { grid-area:radar; } .a-curve { grid-area:curve; } .a-deaths { grid-area:deaths; } .a-map { grid-area:map; } .a-games { grid-area:games; } .a-pool { grid-area:pool; }
@media (min-width: 1650px) { .dgrid { grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-areas: "radar radar curve curve deaths deaths" "map map games games games games" "map map pool pool pool pool"; } }
.a-pool h2 { margin-top:4px; }
.dgrid > .card, .dgrid > .a-map > .card { height:100%; } .dgrid { align-items:stretch; }
.a-map .card svg { max-width:460px !important; }
.formstats { display:grid; grid-template-columns: repeat(3, auto); gap:6px 18px; margin-top:12px; font-size:13px; color:var(--mute); }
.formstats b { display:block; color:var(--ink); font-size:17px; }
.grid2 { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap:14px; margin-top:14px; align-items:start; }
.grid2 + .grid2 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.ctitle { font-size:15px; font-weight:600; margin-bottom:2px; }
details.allnums { margin-top:22px; } details.allnums summary { cursor:pointer; color:var(--mute); font-size:13px; margin-bottom:10px; }
.sparks { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
.sparks .card b { font-size:13px; } .sparks .card .sub { display:block; }
.duo { display:grid; grid-template-columns: 330px 1fr; gap:14px; }
.pool { display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap:10px; align-content:start; }
.pool .card { display:flex; gap:10px; align-items:center; padding:10px 12px; cursor:pointer; } .pool .card:hover { border-color:var(--blue); }
.pool img { width:40px; height:40px; border-radius:8px; } .pool small { display:block; color:var(--mute); font-size:12px; }
.formstrip { display:flex; gap:4px; align-items:center; margin-top:10px; } .formstrip i { width:16px; height:22px; border-radius:3px; background:var(--red); opacity:.85; } .formstrip i.w { background:var(--blue); }
@media (max-width: 900px) { .grid2, .grid2 + .grid2, .hero, .duo { grid-template-columns: 1fr; } .dgrid { grid-template-columns: 1fr; grid-template-areas: "radar" "curve" "deaths" "map" "games" "pool"; } .score { grid-template-columns: 1fr 60px 60px; } .score .track, .score .n { display:none; } }
.legend { display:flex; gap:16px; font-size:12px; color:var(--mute); margin-top:6px; }
.legend i { display:inline-block; width:12px; height:8px; border-radius:2px; margin-right:5px; vertical-align:middle; }
</style>
</head>
<body>
<header><b>custy<span>.gg</span> game review</b><span class="tag">test</span><span class="who" id="who"></span><button id="refresh" title="Look for new games">↻ Refresh</button></header>
<main>
  <aside id="list"><div class="note">Reading your games from League...</div></aside>
  <section id="view"><div class="empty">Pick a game on the left.</div></section>
</main>
<div class="toast" id="toast"></div>
<script>
const KEY = new URLSearchParams(location.search).get("k") || "";
const api = (path, opt = {}) => fetch(path, { ...opt, headers: { "X-Custy-Key": KEY } }).then(async r => {
  const body = await r.json().catch(() => ({}));
  if (r.status === 403) throw new Error("This window is from before the custy.gg app restarted. Close it and open Review my games again.");
  if (!r.ok) throw new Error(body.error || ("HTTP " + r.status));
  return body;
});
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clock = (t) => { t = Math.max(0, Math.round(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString();
const ROLE_NAME = { TOP: "Top", JUNGLE: "Jungle", MID: "Mid", BOT: "Bot", SUPPORT: "Support" };

// ---------------------------------------------------------------- Data Dragon (names, icons, item costs)
const DD = { v: null, champ: {}, items: {} };
async function loadDD() {
  try {
    DD.v = (await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json())[0];
    const ch = await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${DD.v}/data/en_US/champion.json`)).json();
    for (const c of Object.values(ch.data)) DD.champ[c.key] = { name: c.name, id: c.id };
    const it = await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${DD.v}/data/en_US/item.json`)).json();
    DD.items = it.data;
  } catch (e) { console.warn("Data Dragon unavailable", e); }
}
const champName = (id) => DD.champ[id]?.name || ("Champion " + id);
const champIcon = (id) => DD.champ[id] ? `https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/champion/${DD.champ[id].id}.png` : "";
const itemName = (id) => DD.items[id]?.name || ("item " + id);
const itemCost = (id) => DD.items[id]?.gold?.total || 0;
const isBoots = (id) => { const it = DD.items[id]; return !!it && (it.tags || []).includes("Boots") && it.gold.total >= 700 && id != 1001; };
const isCompleted = (id) => { const it = DD.items[id]; return !!it && it.gold.total >= 2200 && !(it.into || []).length && !(it.tags || []).includes("Consumable") && !isBoots(id); };

// ---------------------------------------------------------------- Map areas
function area(x, y) {
  if (x == null) return "";
  if (x < 3600 && y < 3600) return "blue base";
  if (x > 11300 && y > 11300) return "red base";
  if (x < 2300 || y > 12600) return "top lane";
  if (y < 2300 || x > 12600) return "bot lane";
  if (Math.abs(x - y) < 1300) return "mid lane";
  if (Math.abs(x + y - 14800) < 1500) return y > x ? "top river" : "bot river";
  return y > x ? "top-side jungle" : "bot-side jungle";
}
const dist = (a, b) => (a && b) ? Math.hypot(a.x - b.x, a.y - b.y) : Infinity;

// ---------------------------------------------------------------- Turning one game into series and events
function analyse(data) {
  const g = data.game, frames = data.timeline?.frames || [];
  const ids = {}; for (const i of g.participantIdentities || []) ids[i.participantId] = i.player || {};
  const parts = g.participants || [];
  const me = parts.find(p => ids[p.participantId]?.puuid === data.me);
  if (!me || frames.length < 3) return null;
  const role = data.roles[me.participantId] || "";
  const opp = parts.find(p => p.teamId !== me.teamId && data.roles[p.participantId] === role) || null;
  const enemyJg = parts.find(p => p.teamId !== me.teamId && data.roles[p.participantId] === "JUNGLE") || null;
  const pf = (f, pid) => f.participantFrames?.[String(pid)] || {};
  const series = (pid, fn) => frames.map(f => fn(pf(f, pid)));
  const gold = (pid) => series(pid, x => x.totalGold || 0);
  const cs = (pid) => series(pid, x => (x.minionsKilled || 0) + (x.jungleMinionsKilled || 0));
  const myGold = gold(me.participantId), oppGold = opp ? gold(opp.participantId) : null;
  const diff = oppGold ? myGold.map((v, i) => v - oppGold[i]) : null;
  const events = frames.flatMap(f => f.events || []).sort((a, b) => a.timestamp - b.timestamp);
  const champOf = (pid) => champName(parts.find(p => p.participantId === pid)?.championId);

  // Purchases (undos removed), grouped into backs.
  const buys = {};
  for (const e of events) {
    if (e.type === "ITEM_PURCHASED") (buys[e.participantId] ??= []).push({ t: e.timestamp / 1000, id: e.itemId });
    if (e.type === "ITEM_UNDO") { const l = buys[e.participantId] || []; const u = e.beforeId || e.itemId;
      for (let i = l.length - 1; i >= 0; i--) if (l[i].id === u) { l.splice(i, 1); break; } }
  }
  const backsOf = (pid) => {
    const out = [];
    for (const b of (buys[pid] || []).filter(b => b.t > 120)) {
      const last = out[out.length - 1];
      if (last && b.t - last.end < 40) { last.items.push(b.id); last.end = b.t; }
      else out.push({ t: b.t, end: b.t, items: [b.id] });
    }
    for (const b of out) b.spent = b.items.reduce((a, id) => a + itemCost(id), 0);
    return out;
  };
  const firstOf = (pid, test) => (buys[pid] || []).find(b => test(b.id))?.t ?? null;
  const lvl6 = (pid) => {
    const e = events.find(e => e.type === "SKILL_LEVEL_UP" && e.participantId === pid && e.skillSlot === 4);
    if (e) return e.timestamp / 1000;
    const m = frames.findIndex(f => (pf(f, pid).level || 0) >= 6);
    return m >= 0 ? m * 60 : null;
  };
  const kills = events.filter(e => e.type === "CHAMPION_KILL");
  const myCs = cs(me.participantId);
  const xp = (pid) => series(pid, x => x.xp || 0), lvl = (pid) => series(pid, x => x.level || 0);
  const myXp = xp(me.participantId), oppXp = opp ? xp(opp.participantId) : null;
  const completed = (buys[me.participantId] || []).filter(b => isCompleted(b.id));
  const STAT = (i, k) => DD.items[i]?.stats?.[k] || 0;
  const defense = (k) => parts.filter(p => p.teamId !== me.teamId).filter(p =>
    [0, 1, 2, 3, 4, 5].reduce((a, n) => a + STAT(p.stats?.["item" + n], k), 0) >= 80).length;
  return {
    g, me, opp, enemyJg, role, frames, events, kills, champOf, pf,
    minutes: frames.length - 1,
    myGold, oppGold, diff, myCs,
    oppCs: opp ? cs(opp.participantId) : null,
    xp: myXp, level: lvl(me.participantId), xpdiff: oppXp ? myXp.map((v, i) => v - oppXp[i]) : null,
    csdiff: opp ? myCs.map((v, i) => v - cs(opp.participantId)[i]) : null,
    items: completed, armorN: defense("FlatArmorMod"), mrN: defense("FlatSpellBlockMod"),
    backs: backsOf(me.participantId), oppBacks: opp ? backsOf(opp.participantId) : [],
    firstItem: firstOf(me.participantId, isCompleted),
    lvl6: lvl6(me.participantId), oppLvl6: opp ? lvl6(opp.participantId) : null,
    deaths: kills.filter(e => e.victimId === me.participantId).map(e => ({ t: e.timestamp / 1000, e })),
    platesLost: events.filter(e => e.type === "TURRET_PLATE_DESTROYED" && e.teamId === me.teamId && e.timestamp < 14 * 60000 &&
      laneMatches(e.laneType, role)).map(e => e.timestamp / 1000),
  };
}
function laneMatches(lane, role) {
  lane = String(lane || "");
  return (role === "TOP" && lane.startsWith("TOP")) || (role === "MID" && lane.startsWith("MID")) ||
         ((role === "BOT" || role === "SUPPORT") && lane.startsWith("BOT"));
}

// ---------------------------------------------------------------- "Your usual": your other games on this champion (or role)
function pct(values, q) {
  const v = values.filter(x => x != null && Number.isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return null;
  const i = (v.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
  return v[lo] + (v[hi] - v[lo]) * (i - lo);
}
// Expert numbers (public/benchmarks) in the same shape as baseline() below.
function fromExperts(b) {
  const band = arr => (arr || []).map(x => x ? { p25: x[0], p50: x[1], p75: x[2] } : null);
  const med = k => b.timings?.[k]?.[1] ?? null;
  return { expert: true, n: b.games, diff: band(b.minutes.gdiff), gold: band(b.minutes.gold), cs: band(b.minutes.cs),
    firstBack: med("first_back"), firstBackGold: med("first_back_gold"), firstItem: med("legendary1"),
    lvl6Gap: med("lvl6_gap"), deaths14: med("deaths_14") };
}
const WHO = (B) => B?.expert ? "Experts" : "Your usual";

function baseline(list) {
  if (list.length < 3) return null;
  const maxM = Math.max(...list.map(a => a.minutes));
  const band = (pick) => Array.from({ length: maxM + 1 }, (_, m) => {
    const vals = list.map(a => pick(a)?.[m]).filter(v => v != null);
    return vals.length >= 3 ? { p25: pct(vals, .25), p50: pct(vals, .5), p75: pct(vals, .75) } : null;
  });
  const med = (fn) => pct(list.map(fn), .5);
  return {
    n: list.length,
    diff: band(a => a.diff), gold: band(a => a.myGold), cs: band(a => a.myCs),
    firstBack: med(a => a.backs[0]?.t), firstBackGold: med(a => a.backs[0]?.spent),
    firstItem: med(a => a.firstItem),
    lvl6Gap: med(a => a.lvl6 != null && a.oppLvl6 != null ? a.lvl6 - a.oppLvl6 : null),
    deaths14: med(a => a.deaths.filter(d => d.t < 840).length),
  };
}

// ---------------------------------------------------------------- Finding the moments
function findMoments(A, B) {
  const out = [];
  const curve = A.diff || A.myGold, useDiff = !!A.diff;
  const band = B ? (useDiff ? B.diff : B.gold) : null;
  const last = Math.min(A.minutes, 25);

  // 1. Lane gold: dropped 400+ within 3 minutes and ended below the comparison's middle half.
  if (useDiff) {
    let cur = null;
    for (let m = 2; m <= last; m++) {
      const lo = Math.max(0, m - 3);
      let peak = lo; for (let k = lo; k < m; k++) if (curve[k] > curve[peak]) peak = k;
      const drop = curve[peak] - curve[m];
      const below = band?.[m] ? curve[m] < band[m].p25 : true;
      if (drop >= 400 && below) {
        if (cur && peak <= cur.endM) { cur.endM = m; }
        else { cur = { kind: "gold", peakM: peak, endM: m }; out.push(cur); }
      }
    }
    for (const w of out) {
      // Keep the window going while the gap keeps opening.
      while (w.endM < A.minutes && curve[w.endM + 1] < curve[w.endM]) w.endM++;
      const low = Math.min(...curve.slice(w.peakM, w.endM + 1));
      w.cost = curve[w.peakM] - low;
      w.start = Math.max(0, w.peakM * 60 - 45); w.end = w.endM * 60;
      w.title = `Lane gold went from ${signed(curve[w.peakM])} to ${signed(low)}`;
      const b = band?.[w.endM];
      w.compare = b ? `${WHO(B)} at ${w.endM}:00: <b>${signed(b.p50)}</b> (middle half ${signed(b.p25)} to ${signed(b.p75)}).`
                    : `Lost ${Math.round(w.cost).toLocaleString()} gold to your lane opponent in ${w.endM - w.peakM} min.`;
    }
  }

  // 2. Deaths: any before 14:00, and any after which your lane gold fell 300+.
  for (const d of A.deaths) {
    const m0 = Math.floor(d.t / 60), m2 = Math.min(A.minutes, m0 + 2);
    const swing = useDiff ? curve[m0] - curve[m2] : 0;
    if (d.t >= 840 && swing < 300) continue;
    const inside = out.find(w => w.kind === "gold" && d.t >= w.start && d.t <= w.end + 30);
    if (inside) continue; // already covered by a gold moment (it'll be listed there)
    const killers = [d.e.killerId, ...(d.e.assistingParticipantIds || [])].filter(p => p > 0).map(A.champOf);
    out.push({
      kind: "death", start: Math.max(0, d.t - 45), end: d.t + 10, cost: Math.max(300, swing),
      title: `You died at ${clock(d.t)}${killers.length ? " to " + killers.join(" + ") : ""}`,
      compare: d.t >= 840 ? `Your lane gold went from ${signed(curve[m0])} to ${signed(curve[m2])} over the next 2 minutes.`
        : B ? `${B.expert ? "Experts die" : "In your usual game you die"} <b>${Math.round(B.deaths14 ?? 0)}</b> time${Math.round(B.deaths14 ?? 0) === 1 ? "" : "s"} before 14:00.` : "Deaths before 14:00 usually decide the lane.",
    });
  }

  // 3. CS at 10 and 14 minutes.
  if (A.role !== "SUPPORT") {
    const target = (m) => B?.cs?.[m]?.p50 ?? ({ JUNGLE: 5.5, TOP: 7, MID: 7, BOT: 7.5 }[A.role] || 7) * m;
    for (const m of [10, 14]) {
      if (A.minutes < m) continue;
      const gap = target(m) - A.myCs[m];
      if (gap < 10) continue;
      if (out.some(w => w.kind === "cs")) { const w = out.find(w => w.kind === "cs"); w.cost = Math.max(w.cost, gap * 20); w.end = m * 60; w.title = `${A.myCs[m]} CS at ${m}:00, ${Math.round(gap)} under`; continue; }
      out.push({ kind: "cs", start: (m - 4) * 60, end: m * 60, cost: gap * 20,
        title: `${A.myCs[m]} CS at ${m}:00, ${Math.round(gap)} under`,
        compare: B?.cs?.[m] ? `${WHO(B)}: <b>${Math.round(B.cs[m].p50)}</b> at ${m}:00.` : `Rough target for ${ROLE_NAME[A.role] || "your role"}: <b>${Math.round(target(m))}</b>.` });
    }
  }

  // 4. First back.
  const fb = A.backs[0];
  if (B?.firstBack && fb && fb.t - B.firstBack >= 60) {
    out.push({ kind: "back", start: Math.max(0, B.firstBack - 45), end: fb.t + 5, cost: (fb.t - B.firstBack) * 4,
      title: `First back at ${clock(fb.t)} with ${fb.spent.toLocaleString()} gold spent`,
      compare: `${WHO(B)}: back by <b>${clock(B.firstBack)}</b>, spending ~${Math.round(B.firstBackGold || 0).toLocaleString()}.` });
  }

  // 5. First completed item.
  for (const [k, label] of [["firstItem", "First item"]]) {
    if (B?.[k] && A[k] && A[k] - B[k] >= 90) {
      out.push({ kind: k, start: Math.max(0, B[k] - 45), end: A[k] + 5, cost: (A[k] - B[k]) * 3,
        title: `${label} finished at ${clock(A[k])}`, compare: `${WHO(B)}: <b>${clock(B[k])}</b>.` });
    }
  }

  // 6. Level 6 behind your lane opponent.
  if (A.lvl6 != null && A.oppLvl6 != null && A.lvl6 - A.oppLvl6 > 20 && A.role !== "JUNGLE") {
    const gap = A.lvl6 - A.oppLvl6;
    out.push({ kind: "lvl6", start: Math.max(0, A.oppLvl6 - 30), end: A.lvl6 + 15, cost: 150 + gap * 3,
      title: `${A.opp ? champName(A.opp.championId) : "Your opponent"} hit 6 ${Math.round(gap)}s before you`,
      compare: B?.lvl6Gap != null ? `${WHO(B)}: <b>${B.lvl6Gap <= 0 ? Math.round(-B.lvl6Gap) + "s ahead" : Math.round(B.lvl6Gap) + "s behind"}</b>.` : "Being second to 6 is a window to play safe." });
  }

  // 7. Plates lost before 14:00.
  if (A.platesLost.length >= 2) {
    out.push({ kind: "plates", start: Math.max(0, A.platesLost[0] - 45), end: A.platesLost[A.platesLost.length - 1] + 5,
      cost: A.platesLost.length * 160, title: `${A.platesLost.length} plates lost before 14:00`, compare: "" });
  }

  // Overlapping findings become one moment to watch.
  const merged = [];
  for (const w of out.filter(w => w.cost > 0).sort((a, b) => a.start - b.start)) {
    const cur = merged[merged.length - 1];
    if (cur && w.start <= cur.end) { cur.end = Math.max(cur.end, w.end); cur.cost += w.cost; cur.parts.push(w); }
    else merged.push({ start: w.start, end: w.end, cost: w.cost, parts: [w] });
  }
  for (const m of merged) { m.parts.sort((a, b) => a.start - b.start); m.context = context(A, m); }
  // Keep the ones that cost the most, then list them in the order they happened.
  return merged.sort((a, b) => b.cost - a.cost).slice(0, 6).sort((a, b) => a.start - b.start);
}

function context(A, w) {
  const lines = [], inWin = (t) => t >= w.start - 5 && t <= w.end + 30;
  const add = (t, html) => lines.push({ t, html });
  for (const k of A.kills) {
    const t = k.timestamp / 1000; if (!inWin(t)) continue;
    const killer = k.killerId > 0 ? A.champOf(k.killerId) : "an execution";
    const helpers = (k.assistingParticipantIds || []).map(A.champOf);
    const where = area(k.position?.x, k.position?.y);
    if (k.victimId === A.me.participantId) add(t, `${clock(t)} you died to ${killer}${helpers.length ? " + " + helpers.join(" + ") : ""}${where ? " (" + where + ")" : ""}`);
    else if (k.killerId === A.me.participantId) add(t, `${clock(t)} you killed ${A.champOf(k.victimId)}${where ? " (" + where + ")" : ""}`);
    else if (A.opp && k.victimId === A.opp.participantId) add(t, `${clock(t)} ${A.champOf(k.victimId)} died to ${killer}`);
    else if (A.opp && k.killerId === A.opp.participantId) add(t, `${clock(t)} ${A.champOf(k.killerId)} killed ${A.champOf(k.victimId)}`);
  }
  if (A.enemyJg) {
    for (let m = Math.ceil(w.start / 60); m <= Math.floor(w.end / 60) && m <= A.minutes; m++) {
      const jp = A.pf(A.frames[m], A.enemyJg.participantId).position, mp = A.pf(A.frames[m], A.me.participantId).position;
      if (!jp) continue;
      if (dist(jp, mp) < 2600) add(m * 60, `${m}:00 enemy jungler (${champName(A.enemyJg.championId)}) <b>near you</b> in ${area(jp.x, jp.y)}`);
    }
  }
  for (const b of A.backs) if (inWin(b.t)) add(b.t, `${clock(b.t)} you bought ${describeBuy(b)}`);
  for (const b of A.oppBacks) if (inWin(b.t)) add(b.t, `${clock(b.t)} ${champName(A.opp.championId)} bought ${describeBuy(b)}`);
  for (const e of A.events) {
    const t = e.timestamp / 1000; if (!inWin(t)) continue;
    if (e.type === "ELITE_MONSTER_KILL") add(t, `${clock(t)} ${String(e.monsterType || "").replace(/_/g, " ").toLowerCase()} taken by ${teamOf(A, e.killerId)}`);
  }
  return lines.sort((a, b) => a.t - b.t).map(l => l.html).slice(0, 10);
}
const teamOf = (A, pid) => (A.g.participants.find(p => p.participantId === pid)?.teamId === A.me.teamId ? "your team" : "the enemy");
function describeBuy(b) {
  const main = b.items.slice().sort((x, y) => itemCost(y) - itemCost(x)).slice(0, 2).map(itemName);
  return `${main.join(", ")}${b.items.length > 2 ? " +" + (b.items.length - 2) : ""} (${b.spent.toLocaleString()}g)`;
}

// ---------------------------------------------------------------- Chart
function chart(A, B, moments) {
  const W = 1000, H = 260, L = 50, R = 12, T = 14, Bm = 26;
  const curve = A.diff || A.myGold, band = B ? (A.diff ? B.diff : B.gold) : null;
  const n = A.minutes;
  let lo = Math.min(0, ...curve), hi = Math.max(0, ...curve);
  if (band) for (const b of band.slice(0, n + 1)) if (b) { lo = Math.min(lo, b.p25); hi = Math.max(hi, b.p75); }
  const pad = (hi - lo) * .08 || 500; lo -= pad; hi += pad;
  const x = (m) => L + (m / n) * (W - L - R), y = (v) => T + (hi - v) / (hi - lo) * (H - T - Bm);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Lane gold difference by minute">`;
  for (const w of moments) s += `<rect x="${x(w.start / 60)}" y="${T}" width="${Math.max(3, x(w.end / 60) - x(w.start / 60))}" height="${H - T - Bm}" fill="var(--red-wash)"/>`;
  const step = (hi - lo) > 6000 ? 2000 : (hi - lo) > 2500 ? 1000 : 500;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "var(--line)" : "var(--line-soft)"}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${signed(v)}</text>`;
  for (let m = 0; m <= n; m += 5) s += `<text x="${x(m)}" y="${H - 8}" text-anchor="middle">${m}:00</text>`;
  if (band) {
    const pts = band.slice(0, n + 1).map((b, m) => b && [m, b]).filter(Boolean);
    if (pts.length > 1) {
      s += `<path d="M${pts.map(([m, b]) => x(m) + "," + y(b.p75)).join("L")}L${pts.slice().reverse().map(([m, b]) => x(m) + "," + y(b.p25)).join("L")}Z" fill="var(--blue-wash)" stroke="none"/>`;
      s += `<path d="M${pts.map(([m, b]) => x(m) + "," + y(b.p50)).join("L")}" fill="none" stroke="var(--blue)" stroke-opacity=".45" stroke-dasharray="4 4"/>`;
    }
  }
  s += `<path d="M${curve.map((v, m) => x(m) + "," + y(v)).join("L")}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`;
  curve.forEach((v, m) => s += `<circle cx="${x(m)}" cy="${y(v)}" r="6" fill="transparent"><title>${m}:00  ${signed(v)}</title></circle>`);
  for (const d of A.deaths) { const m = d.t / 60, i = Math.min(n, Math.round(m));
    s += `<text x="${x(m)}" y="${y(curve[i]) - 9}" text-anchor="middle" style="fill:var(--red-ink);font-size:13px">✕</text>`; }
  return s + "</svg>";
}

// ---------------------------------------------------------------- Page
let STATE = { games: [], me: null, replayApi: null, current: "home", queue: "all" };
const QUEUE_FILTERS = [["all", "All"], ["solo", "Solo/Duo"], ["flex", "Flex"], ["other", "Normals & other"]];
const queueGroup = (q) => q === "Ranked Solo/Duo" ? "solo" : q === "Ranked Flex" ? "flex" : "other";
const cacheGame = {};
const getGame = async (id) => cacheGame[id] ??= api("/api/game/" + id);

async function loadList() {
  const btn = $("refresh"); btn.disabled = true; btn.textContent = "Refreshing...";
  let r;
  try { r = await api("/api/games"); } finally { btn.disabled = false; btn.textContent = "↻ Refresh"; }
  const before = new Set(STATE.games.map(g => g.id));
  const fresh = STATE.games.length ? r.games.filter(g => !before.has(g.id)) : [];
  STATE = { ...STATE, games: r.games, me: r.me, replayApi: r.replayApi };
  try { STATE.queue = localStorage.getItem("custy-review-queue") || "all"; } catch (e) {}
  $("who").textContent = r.me?.gameName ? `${r.me.gameName}#${r.me.tagLine}` : "";
  const note = r.note ? `<div class="note">${esc(r.note)}</div>` : "";
  if (!r.games.length) {
    $("list").innerHTML = note + `<div class="note">No ranked or normal Summoner's Rift games found yet. Play one with the app running, then reopen this.</div>`;
    return;
  }
  STATE.note = note;
  if (fresh.length) STATE.current = null;   // a new game came in: open it
  renderList(true);
  if (!fresh.length && STATE.games.length && lastRefreshClicked) toast("No new games yet. League can take a minute or two after a game to add it to your history.");
  lastRefreshClicked = false;
}
let lastRefreshClicked = false, lastLoad = Date.now();
$("refresh").onclick = () => { lastRefreshClicked = true; lastLoad = Date.now(); loadList().catch(e => toast(e.message)); };
// Also look for new games when you come back to this window, and every 2 minutes while it's open.
const autoRefresh = () => { if (Date.now() - lastLoad > 30000) { lastLoad = Date.now(); loadList().catch(() => {}); } };
window.addEventListener("focus", autoRefresh);
setInterval(() => { if (!document.hidden) autoRefresh(); }, 120000);

function renderList(openFirst) {
  const shown = STATE.games.filter(g => STATE.queue === "all" || queueGroup(g.queue) === STATE.queue);
  const filter = `<div class="filter">${QUEUE_FILTERS.map(([k, label]) =>
    `<button data-q="${k}" class="${STATE.queue === k ? "on" : ""}">${label}</button>`).join("")}</div>`;
  const home = `<div class="homerow${STATE.current === "home" ? " on" : ""}" id="homerow"><b>Overview</b><small>How you play across your recent games</small></div>`;
  $("list").innerHTML = filter + STATE.note + home + (shown.length ? shown.map(g => `
    <div class="game ${g.win ? "w" : "l"}${g.id == STATE.current ? " on" : ""}" data-id="${g.id}">
      <img src="${champIcon(g.champion)}" alt="">
      <div class="t">${esc(champName(g.champion))}${g.opponent ? ` <span class="sub">vs ${esc(champName(g.opponent))}</span>` : ""}
        <small>${esc(g.queue)} · ${esc(ROLE_NAME[g.role] || "?")} · ${new Date(g.created).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</small></div>
      <div class="kda">${g.kills}/${g.deaths}/${g.assists}<small>${Math.round(g.duration / 60)}m</small></div>
    </div>`).join("") : `<div class="note">No games in this queue yet.</div>`);
  document.querySelectorAll(".game").forEach(el => el.onclick = () => openGame(el.dataset.id));
  document.querySelectorAll(".filter button").forEach(b => b.onclick = () => {
    STATE.queue = b.dataset.q;
    try { localStorage.setItem("custy-review-queue", STATE.queue); } catch (e) {}
    renderList(true);
  });
  $("homerow").onclick = () => openHome(true);
  if (STATE.current === "home") openHome();
  else if (openFirst && shown.length && !shown.some(g => g.id == STATE.current)) openGame(shown[0].id);
}

async function openGame(id) {
  document.querySelectorAll(".game").forEach(el => el.classList.toggle("on", el.dataset.id == id));
  $("homerow")?.classList.remove("on");
  $("view").classList.remove("wide");
  STATE.current = id;
  $("view").innerHTML = `<div class="empty">Reading the game...</div>`;
  const s = STATE.games.find(g => g.id == id);
  let A;
  try { A = analyse(await getGame(id)); } catch (e) { $("view").innerHTML = `<div class="empty">Couldn't read this game: ${esc(e.message)}</div>`; return; }
  if (!A) { $("view").innerHTML = `<div class="empty">League didn't give a timeline for this game, so there's nothing to review.</div>`; return; }

  // Compared with high-elo games on this champion and role. Only when there aren't any yet,
  // fall back to your own other games on this champion (or role).
  const champ = DD.champ[A.me.championId]?.id;
  const ex = champ && A.role ? await getBench(champ + "-" + A.role) : { missing: true };
  let B, label;
  if (!ex.missing) {
    B = fromExperts(ex);
    label = `${ex.games} high-elo ${champName(A.me.championId)} ${ROLE_NAME[A.role] || ""} games`;
  } else {
    const others = STATE.games.filter(g => g.id != id && g.hasTimeline && g.role === s.role);
    const sameChamp = others.filter(g => g.champion === s.champion).slice(0, 20);
    const pool = sameChamp.length >= 3 ? sameChamp : others.slice(0, 20);
    label = sameChamp.length >= 3 ? `your last ${pool.length} ${champName(s.champion)} games` : `your last ${pool.length} ${ROLE_NAME[s.role] || ""} games (any champion)`;
    B = baseline((await Promise.all(pool.map(g => getGame(g.id).then(analyse).catch(() => null)))).filter(Boolean));
  }
  if (STATE.current !== id) return;
  const moments = findMoments(A, B);
  render(A, B, moments, s, B ? label : null);
}

function timingCard(k, mine, usual, fmt, lowerIsBetter = true) {
  const has = mine != null;
  let cls = "", d = "";
  if (has && usual != null) {
    const delta = mine - usual;
    cls = Math.abs(delta) < 1e-9 ? "" : (lowerIsBetter ? delta > 0 : delta < 0) ? "bad" : "good";
    d = `${STATE.cmpWord || "usual"} ${fmt(usual)}`;
  }
  return `<div class="card"><div class="k">${k}</div><div class="v ${cls}">${has ? fmt(mine) : "—"}</div><div class="d">${d || "&nbsp;"}</div></div>`;
}

function render(A, B, moments, s, label) {

    : STATE.replayApi == null ? `<div class="banner">Couldn't find League's game.cfg, so replays may not jump to the moment. Set league_path if League is installed somewhere unusual.</div>` : "";
  const cs10 = A.minutes >= 10 ? A.myCs[10] : null;
  STATE.cmpWord = B?.expert ? "experts" : "usual";
  $("view").innerHTML = `
    <div class="vs"><img src="${champIcon(A.me.championId)}" alt="">
      <div><h1>${esc(champName(A.me.championId))}${opp ? ` <span class="sub" style="font-size:18px">vs ${esc(opp)}</span>` : ""}</h1>
      <div class="sub">${res} · ${esc(s.queue)} · ${esc(ROLE_NAME[A.role] || "role unknown")} · ${A.me.stats.kills}/${A.me.stats.deaths}/${A.me.stats.assists} · ${clock(A.g.gameDuration)} · ${new Date(A.g.gameCreation).toLocaleString()}</div></div></div>
    <a class="btn yt" target="_blank" href="https://www.youtube.com/results?search_query=${encodeURIComponent("Domisumreplay " + champName(A.me.championId) + (opp ? " vs " + opp : ""))}">▶ High-elo ${esc(champName(A.me.championId))}${opp ? " vs " + esc(opp) : ""} games on YouTube</a>
    ${banner}
    <div class="tabs"><button data-tab="moments" class="on">Moments</button><button data-tab="experts">Breakdown</button></div>
    <div id="v-experts" hidden><div class="empty">Loading expert data...</div></div>
    <div id="v-moments">
    <h2>${A.diff ? "Lane gold difference" : "Your gold"} by minute</h2>
    <div class="card">${chart(A, B, moments)}
      <div class="legend"><span><i style="background:var(--gold)"></i>This game</span>${B ? `<span><i style="background:var(--blue-wash);border:1px solid var(--blue)"></i>Middle half of ${esc(label)}</span>` : ""}<span><i style="background:var(--red-wash)"></i>Moments to watch</span><span style="color:var(--red-ink)">✕ your deaths</span></div>
      ${B?.expert ? "" : `<div class="sub" style="margin-top:6px">No high-elo data for ${esc(champName(A.me.championId))} ${esc(ROLE_NAME[A.role] || "")} yet, so ${B ? "this uses your own recent games instead" : "there's nothing to compare with"}.</div>`}
    </div>
    <h2>Moments to watch, in order</h2>
    <div class="card">${moments.length ? moments.map((w, i) => `
      <div class="moment">
        <div class="when">${clock(w.start)} – ${clock(w.end)}${w.parts.some(p => p.kind === "gold") ? `<small>${Math.round(Math.max(...w.parts.filter(p => p.kind === "gold").map(p => p.cost))).toLocaleString()} gold lost</small>` : ""}</div>
        <div class="what">${w.parts.map(p => `<div class="part"><b>${esc(p.title)}</b>${p.compare ? `<div class="cmp">${p.compare}</div>` : ""}</div>`).join("")}
          ${w.context.length ? `<ul>${w.context.map(l => `<li>${l}</li>`).join("")}</ul>` : ""}</div>
        <div class="acts"><button class="primary" data-watch="${w.start}">Watch in my replay</button></div>
      </div>`).join("") : `<div class="empty" style="padding:10px 0">Nothing stood out: your lane gold never slipped 400+ below ${B?.expert ? "the experts' range" : B ? "your usual" : "your opponent"}, no early deaths, and your timings were on pace.</div>`}
    </div>
    <h2>All deaths (${A.deaths.length})</h2>
    <div class="card">${A.deaths.length ? A.deaths.map(d => deathRow(A, d)).join("") : `<div class="empty" style="padding:10px 0">No deaths this game.</div>`}</div>
    <h2>Timings</h2>
    <div class="timings">
      ${timingCard("First back", A.backs[0]?.t ?? null, B?.firstBack, clock)}
      ${timingCard("First item", A.firstItem, B?.firstItem, clock)}
      ${timingCard("Level 6 vs " + (opp || "opponent"), A.lvl6 != null && A.oppLvl6 != null ? A.lvl6 - A.oppLvl6 : null, B?.lvl6Gap, v => (v <= 0 ? Math.round(-v) + "s ahead" : Math.round(v) + "s behind"))}
      ${timingCard("CS at 10:00", cs10, B?.cs?.[10]?.p50, v => Math.round(v), false)}
      ${timingCard("Deaths before 14:00", A.deaths.filter(d => d.t < 840).length, B?.deaths14, v => Math.round(v))}
    </div>
    </div>
    <p class="sub" style="margin-top:22px">Compared with ${B ? esc(label) : "nothing yet"}. It only says where to look; watching the replay is how you see why.</p>`;
  document.querySelectorAll("[data-watch]").forEach(b => b.onclick = () => watch(A.g.gameId, +b.dataset.watch, b));
  const en = $("enableApi"); if (en) en.onclick = enableApi;
  const tabs = document.querySelectorAll(".tabs button");
  const show = (t) => {
    STATE.tab = t;
    tabs.forEach(b => b.classList.toggle("on", b.dataset.tab === t));
    $("v-moments").hidden = t !== "moments"; $("v-experts").hidden = t !== "experts";
  };
  tabs.forEach(b => b.onclick = () => show(b.dataset.tab));
  show(STATE.tab || "moments");
  loadExperts(A);
}

function deathRow(A, d) {
  const e = d.e, m = Math.min(A.minutes, Math.floor(d.t / 60));
  const killers = [e.killerId, ...(e.assistingParticipantIds || [])].filter(p => p > 0).map(A.champOf);
  const where = area(e.position?.x, e.position?.y);
  const notes = [];
  if (A.enemyJg && e.killerId !== A.enemyJg.participantId && !(e.assistingParticipantIds || []).includes(A.enemyJg.participantId)) {
    const jp = A.pf(A.frames[m], A.enemyJg.participantId).position;
    if (jp) notes.push(`enemy jungler was in ${area(jp.x, jp.y)} at ${m}:00`);
  }
  const unspent = A.pf(A.frames[m], A.me.participantId).currentGold;
  if (unspent >= 900) notes.push(`about <b>${Math.round(unspent).toLocaleString()} gold</b> unspent at ${m}:00`);
  if (A.diff) { const m2 = Math.min(A.minutes, m + 2); notes.push(`lane gold ${signed(A.diff[m])} → ${signed(A.diff[m2])} two minutes later`); }
  const lead = A.deaths.filter(x => x.t < d.t).length;
  return `<div class="moment">
    <div class="when">${clock(d.t)}<small style="color:var(--mute)">death ${lead + 1}</small></div>
    <div class="what"><div class="part"><b>${killers.length ? esc(killers.join(" + ")) : "Executed"}${where ? ` <span class="sub">· ${esc(where)}</span>` : ""}</b>
      ${notes.length ? `<div class="cmp">${notes.join(" · ")}</div>` : ""}</div></div>
    <div class="acts"><button class="primary" data-watch="${Math.max(0, d.t - 30)}">Watch in my replay</button></div>
  </div>`;
}

const benchCache = {};
// Expert numbers for "Jhin-BOT". A champion with none yet is asked about again next time.
function getBench(name) {
  return benchCache[name] ??= api("/api/benchmark/" + name).catch(() => ({ missing: true }))
    .then(b => { if (b.missing) delete benchCache[name]; return b; });
}
async function loadExperts(A) {
  const champ = DD.champ[A.me.championId]?.id, role = A.role;
  const el = $("v-experts");
  if (!champ || !role) { el.innerHTML = `<div class="empty">Couldn't tell this game's champion or role.</div>`; return; }
  const name = champ + "-" + role;

const BP = [5, 10, 15, 20];
const METRICS = [
  ["gold", "Gold", v => Math.round(v).toLocaleString()],
  ["cs", "CS", v => Math.round(v)],
  ["level", "Level", v => (Math.round(v * 10) / 10)],
  ["xpdiff", "XP vs lane opponent", v => signed(v)],
  ["gdiff", "Gold vs lane opponent", v => signed(v), "diff"],
  ["csdiff", "CS vs lane opponent", v => signed(v)],
];
const mine = (A, k) => ({ gdiff: A.diff, gold: A.myGold, cs: A.myCs })[k] ?? A[k];

function findings(A, B) {
  const out = [];
  // Break points that fall below the experts' middle half
  for (const [k, label, fmt] of METRICS) {
    const s = mine(A, k); if (!s) continue;
    for (const m of [10, 15, 20]) {
      const b = B.minutes[k]?.[m]; if (!b || s.length <= m) continue;
      const [p25, p50, p75] = b, spread = Math.max(1, p75 - p25);
      if (s[m] < p25) out.push({ sev: (p25 - s[m]) / spread, t: m * 60,
        title: `${label} at ${m}:00: ${fmt(s[m])}`, text: `Experts: ${fmt(p50)} (middle half ${fmt(p25)} to ${fmt(p75)}).` });
    }
  }
  // Keep the worst minute per metric
  const seen = new Set(); const dedup = out.sort((a, b) => b.sev - a.sev).filter(f => { const k = f.title.split(" at ")[0]; if (seen.has(k)) return false; seen.add(k); return true; });
  // Items
  const items = B.items, byId = Object.fromEntries(items.map(i => [i.id, i]));
  A.items.slice(0, 5).forEach((b, n) => {
    const e = byId[b.id], slot = n + 1;
    if (!e) { dedup.push({ sev: 0.8, t: b.t, title: `${itemName(b.id)} (item ${slot})`, text: `Experts on ${champName(A.me.championId)} almost never build it.` }); return; }
    const key = isArmorPen(b.id) ? "armor" + Math.min(A.armorN, 2) : isMagicPen(b.id) ? "mr" + Math.min(A.mrN, 2) : null;
    const r = key && e.by[key] ? e.by[key][0] / Math.max(1, e.by[key][1]) : e.rate;
    if (e.rate < 0.2) dedup.push({ sev: 0.7, t: b.t, title: `${itemName(b.id)} as item ${slot}`, text: `Only ${Math.round(e.rate * 100)}% of expert games build it at all.` });
    else if (slot >= e.slot + 2 && key && r < 0.4) dedup.push({ sev: 0.5, t: b.t, title: `${itemName(b.id)} came ${ord(slot)}, at ${clock(b.t)}`,
      text: `Experts who build it usually get it ${ord(Math.round(e.slot))} (~${clock(e.time)}), but only ${Math.round(r * 100)}% of their games ${defenseText(key)} include it. Against this team it wasn't urgent.` });
    else if (slot >= e.slot + 2) dedup.push({ sev: 1 + (slot - e.slot) * 0.3, t: b.t, title: `${itemName(b.id)} came ${ord(slot)}, at ${clock(b.t)}`,
      text: `Experts buy it ${ord(Math.round(e.slot))}, around ${clock(e.time)}${key ? `, and ${Math.round(r * 100)}% of their games ${defenseText(key)} include it` : ""}.` });
  });
  // Items experts usually get in games like this that you didn't
  const mineIds = new Set(A.items.slice(0, 4).map(b => b.id));
  for (const e of items) {
    if (mineIds.has(e.id)) continue;
    const key = isArmorPen(e.id) ? "armor" + Math.min(A.armorN, 2) : isMagicPen(e.id) ? "mr" + Math.min(A.mrN, 2) : null;
    if (!key || !e.by[key] || e.by[key][1] < 8) continue;
    const r = e.by[key][0] / e.by[key][1];
    if (r >= 0.6 && A.minutes >= 22) dedup.push({ sev: 1.2, t: e.time, title: `No ${e.name} in your first 4 items`, text: `Experts build it in ${Math.round(r * 100)}% of games ${defenseText(key)}, usually ${ord(Math.round(e.slot))}.` });
  }
  // Timings
  const T = B.timings, cmp = (mineV, b, title, fmt, worse) => {
    if (mineV == null || !b) return; const [p25, p50, p75] = b;
    if (worse(mineV, p25, p75)) dedup.push({ sev: 0.9, t: null, title: `${title}: ${fmt(mineV)}`, text: `Experts: ${fmt(p50)} (middle half ${fmt(p25)} to ${fmt(p75)}).` });
  };
  cmp(A.backs[0]?.t, T.first_back, "First back", clock, (v, lo, hi) => v > hi + 30);
  cmp(A.firstItem, T.legendary1, "First item", clock, (v, lo, hi) => v > hi);
  cmp(A.deaths.filter(d => d.t < 840).length, T.deaths_14, "Deaths before 14:00", v => Math.round(v), (v, lo, hi) => v > hi);
  cmp(A.deaths.length, T.deaths, "Deaths", v => Math.round(v), (v, lo, hi) => v > hi);
  if (A.lvl6 != null && A.oppLvl6 != null) cmp(A.lvl6 - A.oppLvl6, T.lvl6_gap, "Level 6 vs your opponent", v => (v <= 0 ? Math.round(-v) + "s ahead" : Math.round(v) + "s behind"), (v, lo, hi) => v > hi + 15);
  return dedup.sort((a, b) => b.sev - a.sev).slice(0, 6);
}
const ord = (n) => n + (["th", "st", "nd", "rd"][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || "th");
const isArmorPen = (id) => /armor penetration|lethality/i.test(DD.items[id]?.description || "") || (DD.items[id]?.stats?.FlatArmorPenetrationMod || 0) > 0 || /Dominik|Mortal Reminder|Serylda|Black Cleaver/i.test(itemName(id));
const isMagicPen = (id) => /magic penetration/i.test(DD.items[id]?.description || "") || /Void Staff|Cryptbloom|Shadowflame/i.test(itemName(id));
const defenseText = (key) => ({ armor0: "where no enemy built armor", armor1: "where one enemy built armor", armor2: "where two or more enemies built armor",
  mr0: "where no enemy built magic resist", mr1: "where one enemy built magic resist", mr2: "where two or more enemies built magic resist" })[key];

function expertsView(A, B) {

  <h2>What stands out</h2>
  <div class="card">${F.length ? F.map(f => `<div class="finding"><b>${esc(f.title)}</b><span>${f.text}</span>
      ${f.t != null ? ` <button style="margin-left:8px;padding:2px 8px" data-watch="${Math.max(0, f.t - 30)}">Watch ${clock(Math.max(0, f.t - 30))}</button>` : ""}</div>`).join("")
    : `<div class="empty" style="padding:10px 0">You were within the experts' usual range on everything checked.</div>`}</div>

  <h2>Break points</h2>
  <div class="card"><table class="grid"><tr><th></th>${BP.map(m => `<th>${m}:00</th>`).join("")}</tr>
    ${METRICS.map(([k, label, fmt]) => `<tr><td>${label}</td>${BP.map(m => cell(k, m, fmt)).join("")}</tr>`).join("")}</table></div>

  <h2>Over the game</h2>
  <div class="card"><div class="seg">${METRICS.filter(([k]) => mine(A, k)).map(([k, label], i) => `<button data-k="${k}" class="${i ? "" : "on"}">${label}</button>`).join("")}</div>
    <div id="xchart">${benchChart(A, B, "gold")}</div>
    <div class="legend"><span><i style="background:var(--gold)"></i>You</span><span><i style="background:var(--blue-wash);border:1px solid var(--blue)"></i>Middle half of expert games</span><span style="color:var(--red-ink)">✕ your deaths</span></div></div>

  <h2>Build</h2>
  <div class="card"><table class="grid"><tr><th>Your items</th><th>Bought</th><th>Experts</th><th>How often experts build it</th></tr>
    ${A.items.slice(0, 6).map((b, n) => { const e = byId[b.id]; return `<tr><td>${n + 1}. ${esc(itemName(b.id))}</td><td>${clock(b.t)}</td>
      <td>${e ? `usually ${ord(Math.round(e.slot))}, ~${clock(e.time)}` : "—"}</td><td>${e ? Math.round(e.rate * 100) + "%" : "rarely"}</td></tr>`; }).join("") || `<tr><td colspan="4" class="sub">No completed items.</td></tr>`}
  </table>
  <div class="sub" style="margin-top:10px">Enemies who built armor: <b>${A.armorN}</b> · magic resist: <b>${A.mrN}</b>. Most common expert starts:
    ${B.orders.slice(0, 3).map(([ids, c]) => `<div>${ids.map(itemName).map(esc).join(" › ")} <span style="color:var(--faint)">(${c} games)</span></div>`).join("")}</div></div>

    ${tRow("Backs before 14:00", A.backs.filter(b => b.t < 840).length, T.backs_before_14, v => Math.round(v), false)}
    ${tRow("First item", A.firstItem, T.legendary1, clock)}

    ${tRow("Deaths before 14:00", A.deaths.filter(d => d.t < 840).length, T.deaths_14, v => Math.round(v))}
    ${tRow("Deaths", A.deaths.length, T.deaths, v => Math.round(v))}

}

function benchChart(A, B, k) {
  const curve = mine(A, k), band = B.minutes[k] || [];
  if (!curve) return `<div class="sub">Not available for this game.</div>`;
  const W = 1000, H = 240, L = 56, R = 12, T = 12, Bm = 26, n = A.minutes;
  let lo = Math.min(...curve), hi = Math.max(...curve);
  band.slice(0, n + 1).forEach(b => { if (b) { lo = Math.min(lo, b[0]); hi = Math.max(hi, b[2]); } });
  if (k.endsWith("diff")) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * .08 || 1; lo -= pad; hi += pad;
  const x = m => L + (m / n) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - Bm);
  const fmt = METRICS.find(mm => mm[0] === k)[2];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  if (k.endsWith("diff")) s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  for (let m = 0; m <= n; m += 5) s += `<text x="${x(m)}" y="${H - 8}" text-anchor="middle">${m}:00</text>`;
  const pts = band.slice(0, n + 1).map((b, m) => b && [m, b]).filter(Boolean);
  if (pts.length > 1) {
    s += `<path d="M${pts.map(([m, b]) => x(m) + "," + y(b[2])).join("L")}L${pts.slice().reverse().map(([m, b]) => x(m) + "," + y(b[0])).join("L")}Z" fill="var(--blue-wash)"/>`;
    s += `<path d="M${pts.map(([m, b]) => x(m) + "," + y(b[1])).join("L")}" fill="none" stroke="var(--blue)" stroke-opacity=".5" stroke-dasharray="4 4"/>`;
  }
  s += `<path d="M${curve.map((v, m) => x(m) + "," + y(v)).join("L")}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`;
  curve.forEach((v, m) => { const b = band[m]; s += `<circle cx="${x(m)}" cy="${y(v)}" r="6" fill="transparent"><title>${m}:00  you ${fmt(v)}${b ? "  ·  experts " + fmt(b[1]) : ""}</title></circle>`; });
  for (const d of A.deaths) { const m = Math.min(n, Math.round(d.t / 60)); s += `<text x="${x(d.t / 60)}" y="${y(curve[m]) - 8}" text-anchor="middle" style="fill:var(--red-ink);font-size:13px">✕</text>`; }
  return s + "</svg>";
}

const sec = (v) => { const a = Math.abs(Math.round(v)); return a >= 90 ? clock(a) : a + "s"; };
const num0 = (v) => Math.round(v).toLocaleString();

    big: (y, e) => (y > e ? "+" : "−") + sec(y - e), head: (y, e) => `Your first back comes ${sec(y - e)} later than experts'`,

  const deaths = rows.flatMap(r => r.A.deaths.filter(d => d.e.position).map(d => ({ r, d })));
  const S = 300, px = v => v / 14870 * S, py = v => S - v / 14980 * S;
  const zones = {}; for (const { d } of deaths) { const a = area(d.e.position.x, d.e.position.y); zones[a] = (zones[a] || 0) + 1; }
  const topZones = Object.entries(zones).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([z, c]) => `<b>${Math.round(100 * c / deaths.length)}%</b> ${z}`).join(" · ");
  const map = `<div class="card"><div class="ctitle">Where you die</div><svg viewBox="0 0 ${S} ${S}" width="100%" style="border-radius:8px;background:#0a1020;max-width:520px;display:block;margin:8px auto 0">
      <image href="https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/map/map11.png" width="${S}" height="${S}" opacity=".5"/>
      ${deaths.map(({ r, d }) => `<circle cx="${px(d.e.position.x)}" cy="${py(d.e.position.y)}" r="${d.t < 840 ? 5 : 4}" fill="${d.t < 840 ? "var(--red)" : "var(--gold)"}" fill-opacity="${d.t < 840 ? .85 : .45}" stroke="#0a1020"><title>${esc(gameLabel(r.g))} · ${clock(d.t)}</title></circle>`).join("")}</svg>
      <div class="legend"><span><i style="background:var(--red);border-radius:50%;width:9px;height:9px"></i>before 14:00</span><span><i style="background:var(--gold);border-radius:50%;width:9px;height:9px;opacity:.6"></i>later</span></div>
      <div class="sub" style="margin-top:6px">${deaths.length} deaths${topZones ? ": " + topZones : ""}</div></div>`;

  // Champion pool
  const groups = {};
  for (const r of rows) (groups[r.g.champion + ":" + r.A.role] ??= []).push(r);
  const pool = Object.values(groups).sort((a, b) => b.length - a.length).map(rs => {
    const st = dashStats(rs).sort((a, b) => a.z - b.z)[0], w = rs.filter(r => r.g.win).length, g = rs[rs.length - 1].g;
    const note = !rs.some(r => r.B) ? "no expert data yet" : st && st.z < -0.4 ? `gap: ${st.m.label.toLowerCase()}` : st ? "on pace with experts" : "needs 3+ games to compare";
    return `<div class="card" data-og="${g.id}"><img src="${champIcon(g.champion)}" alt=""><div><b>${esc(champName(g.champion))}</b> <span class="sub">${ROLE_NAME[rs[0].A.role] || ""}</span>
      <small>${rs.length} game${rs.length === 1 ? "" : "s"} · ${w}–${rs.length - w}</small><small class="${st && st.z < -0.4 ? "bad" : ""}">${note}</small></div></div>`;
  }).join("");

  const curveKey = STATE.curve || "gold";
  const db = deathBlocks(rows);
  $("view").classList.add("wide");
  $("view").innerHTML = `<div id="dash">
    <h1>Your last ${rows.length} games</h1>
    <div class="sub">${wins}–${rows.length - wins} · each game is compared with high-elo games on the same champion and role${withB < rows.length ? ` · expert data for ${withB} of ${rows.length} games` : ""}</div>
    <div class="formstrip" title="Newest on the left">${rows.slice().reverse().map(r => `<i class="${r.g.win ? "w" : ""}" title="${esc(gameLabel(r.g))}"></i>`).join("")}</div>
    <div class="hero">${hero}${strength}${form}</div>
    <div class="dgrid">
      <div class="card a-radar"><div class="ctitle">Your shape vs experts</div><div class="sub">Each spoke is a skill. The dashed ring is the expert median; further out is better.</div>${radarSvg(stats)}
        <div class="legend"><span><i style="background:var(--gold)"></i>You</span><span><i style="background:transparent;border:1px dashed var(--blue)"></i>Experts</span></div></div>
      <div class="card a-curve"><div class="ctitle">Your average game, minute by minute</div>
        <div class="seg" id="curveSeg">${Object.entries(CURVES).map(([k, c]) => `<button data-ck="${k}" class="${k === curveKey ? "on" : ""}">${c[0]}</button>`).join("")}</div>
        <div id="curve">${curveSvg(rows, curveKey)}</div>
        <div class="legend"><span><i style="background:var(--gold)"></i>You, compared with experts on the same champion</span><span><i style="background:var(--blue-wash);border:1px solid var(--blue)"></i>Experts' usual range</span></div></div>
      <div class="card a-deaths"><div class="ctitle">When you die</div><div class="sub">${esc(db.note)}</div>${deathBarsSvg(db)}
        <div class="legend"><span><i style="background:var(--red)"></i>You</span>${db.exp ? `<span><i style="background:repeating-linear-gradient(135deg,#5d6987 0 2px,#253150 2px 4px)"></i>Experts</span>` : ""}<span>deaths per game, by game minute</span></div></div>
      <div class="a-map">${map}</div>
      <div class="card a-games"><div class="ctitle">Your lane, game by game</div><div class="sub">${esc(laneNote(rows))}</div>${gamesSvg(rows)}
        <div class="legend"><span><i style="background:var(--blue)"></i>ahead of your lane opponent</span><span><i style="background:var(--red)"></i>behind</span><span>gold at 15:00 · click a bar to open the game · oldest on the left</span></div></div>
      <div class="a-pool"><h2>Champions</h2><div class="pool">${pool}</div></div>
    </div>
    ${stats.length ? `<details class="allnums"><summary>Show all numbers</summary>
    <div class="card"><div class="score h"><span></span><span>You</span><span>Experts</span><span style="display:flex;justify-content:space-between"><span>behind</span><span>their usual range</span><span>ahead</span></span><span></span></div>
      ${stats.map(scoreRow).join("")}</div></details>` : ""}
    <p class="sub" style="margin-top:22px">Averages of your games against the expert median for each game's champion and role. Fixed rules on the numbers, no AI.</p></div>`;
  document.querySelectorAll("#curveSeg button").forEach(b => b.onclick = () => {
    STATE.curve = b.dataset.ck;
    document.querySelectorAll("#curveSeg button").forEach(x => x.classList.toggle("on", x === b));
    $("curve").innerHTML = curveSvg(rows, b.dataset.ck);
  });
  const rb = $("reelBtn"); if (rb) rb.onclick = () => $("reel").classList.toggle("open");
  document.querySelectorAll("[data-rw]").forEach(b => b.onclick = () => { const [id, t] = b.dataset.rw.split(":"); watch(id, +t, b); });
  document.querySelectorAll("[data-og]").forEach(b => b.onclick = () => { STATE.tab = "moments"; openGame(b.dataset.og); });
}

let toastTimer;
function toast(msg, sticky) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); if (!sticky) toastTimer = setTimeout(() => t.style.display = "none", 7000);
}
async function watch(gameId, t, btn) {
  document.querySelectorAll("[data-watch]").forEach(b => b.disabled = true);
  try { await api(`/api/replay/${gameId}?t=${t}`, { method: "POST" }); }
  catch (e) { toast(e.message); document.querySelectorAll("[data-watch]").forEach(b => b.disabled = false); return; }
  toast("Opening the replay...", true);
  const poll = async () => {
    const r = await api("/api/replay").catch(() => ({ state: "error", message: "Lost touch with the app." }));
    toast(r.message, r.state === "working");
    if (r.state === "working") setTimeout(poll, 1200);
    else document.querySelectorAll("[data-watch]").forEach(b => b.disabled = false);
  };
  poll();
}
async function enableApi() {
  try {
    const r = await api("/api/replay-setup", { method: "POST" });
    STATE.replayApi = r.replayApi;
    toast("Replay jumping is on. It applies to the next replay you open.");
    if (STATE.current) openGame(STATE.current);
  } catch (e) { toast("Couldn't change League's settings: " + e.message); }
}

loadDD().then(loadList).catch(e => { $("list").innerHTML = `<div class="note">Couldn't load: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
