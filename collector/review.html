      const b = r.B?.minutes?.[k]?.[m], sr = pick(r.A);
      if (!b || !sr || sr.length <= m) continue;
      ds.push(sr[m] - b[1]); lo.push(b[0] - b[1]); hi.push(b[2] - b[1]);
    }
    if (ds.length < 3) break;
    pts.push({ m, d: avg(ds), lo: avg(lo), hi: avg(hi), n: ds.length });
  }
  if (pts.length < 5) return `<div class="sub" style="padding:40px 0">Needs at least 3 games with expert data.</div>`;
  const W = 620, H = 250, L = 54, R = 14, T = 30, Bm = 26, n = pts[pts.length - 1].m;
  let lo = Math.min(0, ...pts.map(p => Math.min(p.d, p.lo))), hi = Math.max(0, ...pts.map(p => Math.max(p.d, p.hi)));
  const pad = (hi - lo) * .1 || 1; lo -= pad; hi += pad;
  const x = m => L + (m - 1) / (n - 1) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - Bm);
  const label = CURVES[k][0], unit = k === "cs" ? " CS" : k === "xp" ? " XP" : "";
  let o = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label} against experts by minute">`;
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(v => v >= raw);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) o += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${signed(v)}</text>`;
  for (let m = 5; m <= n; m += 5) o += `<text x="${x(m)}" y="${H - 7}" text-anchor="middle">${m}:00</text>`;
  o += `<path d="M${pts.map(p => x(p.m) + "," + y(p.hi)).join("L")}L${pts.slice().reverse().map(p => x(p.m) + "," + y(p.lo)).join("L")}Z" fill="var(--blue-wash)"/>`;
  o += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--blue)" stroke-dasharray="5 4" stroke-opacity=".7"/>`;
  o += `<path d="M${x(pts[0].m)},${y(0)}L${pts.map(p => x(p.m) + "," + y(p.d)).join("L")}L${x(n)},${y(0)}Z" fill="rgba(227,184,102,.12)"/>`;
  o += `<path d="M${pts.map(p => x(p.m) + "," + y(p.d)).join("L")}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>`;

  const mark = drop || lead;
  if (mark) o += `<line x1="${x(mark.m)}" x2="${x(mark.m)}" y1="${T - 6}" y2="${H - Bm}" stroke="${drop ? "var(--red)" : "var(--blue)"}" stroke-dasharray="3 3"/>
    <text x="${x(mark.m) + (x(mark.m) > W - 220 ? -6 : 6)}" y="${T - 12}" text-anchor="${x(mark.m) > W - 220 ? "end" : "start"}" style="font-size:12px;fill:${drop ? "var(--red-ink)" : "var(--blue-ink)"}">${drop ? "Below" : "Above"} the experts' range from ${mark.m}:00</text>`;
  pts.forEach(p => { o += `<circle cx="${x(p.m)}" cy="${y(p.d)}" r="${p.m % 5 ? 0 : 4}" fill="${p.d < p.lo ? "var(--red)" : p.d > p.hi ? "var(--blue)" : "var(--gold)"}"/>
    <rect x="${x(p.m) - (W - L - R) / n / 2}" y="${T}" width="${(W - L - R) / n}" height="${H - T - Bm}" fill="transparent"><title>${p.m}:00  ${signed(p.d)}${unit} vs the expert median (usual range ${signed(p.lo)} to ${signed(p.hi)}), ${p.n} games</title></rect>`; });
  return o + "</svg>";
}

// Deaths per game in each 5-minute block of the game, yours and (when the expert file has it) theirs.
const BLOCKS = ["0–5", "5–10", "10–15", "15–20", "20–25", "25–30", "30+"];
function deathBlocks(rows) {
  const you = BLOCKS.map((_, i) => {
    const start = i * 300, end = i === 6 ? 1e9 : start + 300, games = rows.filter(r => r.A.g.gameDuration > start);
    return games.length >= 2 ? games.reduce((a, r) => a + r.A.deaths.filter(d => d.t >= start && d.t < end).length, 0) / games.length : null;
  });
  const er = rows.filter(r => r.B?.deaths_by5);
  const exp = er.length >= 3 ? BLOCKS.map((_, i) => { const v = er.map(r => r.B.deaths_by5[i]).filter(x => x != null); return v.length ? avg(v) : null; }) : null;
  let note = "Expert timings by minute arrive with the next expert data run.";
  if (exp) {
    const gaps = you.map((v, i) => v != null && exp[i] != null ? v - exp[i] : -1e9);
    const i = gaps.indexOf(Math.max(...gaps));
    note = gaps[i] > 0.15 ? `Your biggest excess is ${BLOCKS[i]} minutes: ${you[i].toFixed(1)} deaths a game vs ${exp[i].toFixed(1)} for experts.` : "You die about as often as experts at every stage.";
  } else {
    const i = you.indexOf(Math.max(...you.map(v => v ?? -1)));
    if (you[i] != null) note = `You die most in the ${BLOCKS[i]} minute block (${you[i].toFixed(1)} a game). ` + note;
  }
  return { you, exp, note };
}
function deathBarsSvg(db) {
  const W = 620, H = 230, L = 34, R = 10, T = 22, Bm = 26, nB = BLOCKS.length;
  const top = Math.max(0.5, ...db.you.map(v => v || 0), ...(db.exp || []).map(v => v || 0)) * 1.15;
  const gw = (W - L - R) / nB, bw = Math.min(26, gw / (db.exp ? 2.8 : 1.8));
  const y = v => T + (top - v) / top * (H - T - Bm);
  let o = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Deaths per game by game minute">
    <defs><pattern id="stripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#253150"/><rect width="2.5" height="6" fill="#5d6987"/></pattern></defs>`;
  for (let i = 0; i <= 3; i++) { const v = top * i / 3; o += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(1)}</text>`; }
  BLOCKS.forEach((b, i) => {
    const cx = L + gw * i + gw / 2;
    o += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${b}</text>`;
    const bar = (v, xx, fill, who) => v == null ? "" : `<rect x="${xx}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(0) - y(v))}" rx="3" fill="${fill}"><title>${who}: ${v.toFixed(2)} deaths a game, minutes ${b}</title></rect>`;
    if (db.exp) {
      o += bar(db.you[i], cx - bw - 1, "var(--red)", "You") + bar(db.exp[i], cx + 1, "url(#stripes)", "Experts");
      if (db.you[i] != null) o += `<text x="${cx - bw / 2 - 1}" y="${y(db.you[i]) - 5}" text-anchor="middle" style="fill:var(--red-ink)">${db.you[i].toFixed(1)}</text>`;
    } else {
      o += bar(db.you[i], cx - bw / 2, "var(--red)", "You");
      if (db.you[i] != null) o += `<text x="${cx}" y="${y(db.you[i]) - 5}" text-anchor="middle" style="fill:var(--red-ink)">${db.you[i].toFixed(1)}</text>`;
    }
  });
  return o + "</svg>";
}

// Gold vs lane opponent at 15:00 (or the last minute of a shorter game), one bar per game.
const laneAt = (A) => A.diff ? A.diff[Math.min(15, A.minutes)] : null;
function laneNote(rows) {
  const v = rows.map(r => laneAt(r.A)).filter(x => x != null);
  if (!v.length) return "No lane opponent found in these games.";
  const ahead = v.filter(x => x > 0).length, wonAhead = rows.filter(r => (laneAt(r.A) ?? 0) > 0 && r.g.win).length;
  return `Ahead of your lane opponent at 15:00 in ${ahead} of ${v.length} games, average ${signed(avg(v))} gold. You won ${wonAhead} of the ${ahead} games you were ahead in.`;
}
function gamesSvg(rows) {
  const items = rows.map(r => ({ r, v: laneAt(r.A) })).filter(x => x.v != null);
  if (!items.length) return "";
  const W = 1000, H = 250, L = 56, R = 10, T = 16, Bm = 44, n = items.length;
  const top = Math.max(500, ...items.map(x => Math.abs(x.v))) * 1.1;
  const gw = (W - L - R) / n, bw = Math.min(30, gw * .62), y = v => T + (top - v) / (2 * top) * (H - T - Bm);
  let o = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gold against lane opponent at 15 minutes, by game">`;
  const raw = top / 2, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(v => v >= raw);
  for (let v = -Math.floor(top / step) * step; v <= top; v += step) o += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "var(--line)" : "var(--line-soft)"}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${signed(v)}</text>`;
  items.forEach(({ r, v }, i) => {
    const cx = L + gw * i + gw / 2, y0 = y(0), y1 = y(v);
    o += `<g data-og="${r.g.id}" style="cursor:pointer"><rect x="${cx - gw / 2}" y="${T}" width="${gw}" height="${H - T}" fill="transparent"/>
      <rect x="${cx - bw / 2}" y="${Math.min(y0, y1)}" width="${bw}" height="${Math.max(2, Math.abs(y1 - y0))}" rx="3" fill="${v >= 0 ? "var(--blue)" : "var(--red)"}" fill-opacity=".85"/>
      <image href="${champIcon(r.g.champion)}" x="${cx - 11}" y="${H - Bm + 6}" width="22" height="22" style="clip-path:inset(0 round 5px)"/>
      <circle cx="${cx}" cy="${H - 8}" r="3.5" fill="${r.g.win ? "var(--blue)" : "var(--red)"}"/>
      <title>${esc(gameLabel(r.g))}: ${signed(v)} gold vs ${r.A.opp ? esc(champName(r.A.opp.championId)) : "lane opponent"} at ${Math.min(15, r.A.minutes)}:00 · ${r.g.win ? "win" : "loss"}</title></g>`;
  });
  return o + "</svg>";
}

function renderHome(rows) {
  const stats = dashStats(rows), withB = rows.filter(r => r.B).length;
  const wins = rows.filter(r => r.g.win).length;
  const worst = stats.slice().sort((a, b) => a.z - b.z)[0], best = stats.slice().sort((a, b) => b.z - a.z)[0];
  const isBad = worst && worst.z < -0.25, isGood = best && best.z > 0.25 && best !== worst;

  // What to watch for the headline: the deaths themselves, or the games where the gap was biggest.
  let reel = "";
  if (isBad) {
    if (worst.m.k === "deaths14" || worst.m.k === "deaths") {
      // Newest games first, the first four deaths of each.
      const ds = rows.slice().reverse().flatMap(r => r.A.deaths.filter(d => worst.m.k === "deaths" || d.t < 840).slice(0, 4).map(d => ({ r, d }))).slice(0, 12);
      reel = ds.map(({ r, d }) => {
        const who = [d.e.killerId, ...(d.e.assistingParticipantIds || [])].filter(p => p > 0).map(r.A.champOf).join(" + ");
        return `<div><span><b>${clock(d.t)}</b> · ${esc(gameLabel(r.g))}${who ? " · to " + esc(who) : ""}${d.e.position ? " · " + area(d.e.position.x, d.e.position.y) : ""}</span>
          <button data-rw="${r.g.id}:${Math.max(0, d.t - 30)}">Watch</button></div>`;
      }).join("");
    } else {
      reel = worst.pts.slice().sort((a, b) => a.z - b.z).slice(0, 4).map(p =>
        `<div><span><b>${worst.m.fmt(p.y)}</b> (experts ${worst.m.fmt(p.p50)}) · ${esc(gameLabel(p.r.g))}</span><button data-og="${p.r.g.id}">Open game</button></div>`).join("");
    }
  }
  const hero = isBad ? `
    <div class="card gap"><div class="eyebrow">Biggest gap vs experts</div>
      <div class="big bad">${worst.m.big(worst.you, worst.exp)}</div>
      <h3>${esc(worst.m.head(worst.you, worst.exp))}.</h3>
      <p>${worst.m.fmt(worst.you)} vs ${worst.m.fmt(worst.exp)} ${worst.m.unit} · last ${worst.n} games · ${trendText(worst.trend)}</p>
      <p><button class="primary" id="reelBtn">${worst.m.k.startsWith("deaths") ? "Watch them" : "Show the worst games"}</button></p>
      <div class="reel" id="reel">${reel}</div></div>`
    : `<div class="card edge"><div class="eyebrow">vs experts</div><div class="big good">${stats.length ? "On pace" : "—"}</div>
      <h3>${stats.length ? "You're inside the experts' usual range on everything measured." : "No expert data for these champions yet."}</h3>
      <p>${stats.length ? `Across your last ${rows.length} games.` : "It appears here as soon as the site has high-elo games for the champions you played."}</p></div>`;
  const strength = isGood ? `
    <div class="card edge"><div class="eyebrow">Your edge</div>
      <div class="big good">${best.m.big(best.you, best.exp)}</div>
      <h3>${esc(best.m.good(best.you, best.exp))}.</h3>
      <p>${best.m.fmt(best.you)} vs ${best.m.fmt(best.exp)} ${best.m.unit} · last ${best.n} games</p></div>`
    : `<div class="card"><div class="eyebrow">Your edge</div><div class="big" style="font-size:44px">—</div>
      <h3>Nothing clearly ahead of experts yet.</h3><p>It shows up once a stat sits above their usual range.</p></div>`;
  const newest = rows.slice().reverse();
  let streak = 0; for (const r of newest) { if (r.g.win === newest[0].g.win) streak++; else break; }
  const per = (f) => avg(rows.map(f));
  const form = `<div class="card"><div class="eyebrow">Recent form</div>
      <div class="big" style="font-size:44px">${wins}–${rows.length - wins}</div>
      <h3>${Math.round(100 * wins / rows.length)}% win rate</h3>
      <div class="formstats"><span><b>${per(r => r.A.me.stats.kills).toFixed(1)} / ${per(r => r.A.me.stats.deaths).toFixed(1)} / ${per(r => r.A.me.stats.assists).toFixed(1)}</b>avg KDA</span>
        <span><b class="${newest[0].g.win ? "good" : "bad"}">${streak}${newest[0].g.win ? "W" : "L"}</b>streak</span>
        <span><b>${Math.round(per(r => r.A.g.gameDuration) / 60)}m</b>avg game</span></div></div>`;

  // Progress against yourself: your newer half of these games against the older half.
  const up = stats.filter(s => s.n >= 6 && s.trend > 0.2 && s.m.fmt(s.older) !== s.m.fmt(s.newer)).sort((a, b) => b.trend - a.trend).slice(0, 3);
  const enough = stats.some(s => s.n >= 6);
  const progress = !stats.length ? "" : `<div class="card progress"><div><div class="ctitle">Getting better</div><div class="sub">Your newer games against your older ones</div></div>
    ${up.length ? up.map(s => `<div class="pg"><span>${s.m.label}</span><b>${s.m.fmt(s.older)} → <em>${s.m.fmt(s.newer)}</em></b><small>experts ${s.m.fmt(s.exp)} · ${s.n} games</small></div>`).join("")
      : `<div class="pg" style="grid-column:2 / -1"><span>${enough ? "Holding steady: no stat moved much between your older and newer games." : "Trends show up here once you have 6 or more games with expert data."}</span></div>`}</div>`;

  const scoreRow = (s) => {
    const pos = Math.max(3, Math.min(97, 50 + s.z * 25)), cls = s.z < -0.5 ? "bad" : s.z > 0.5 ? "good" : "";
    return `<div class="score"><span>${s.m.label}</span><span class="y ${cls}">${s.m.fmt(s.you)}</span><span class="sub">${s.m.fmt(s.exp)}</span>
      <div class="track" title="${s.pts.filter(p => p.z < -0.5).length} of ${s.n} games behind the experts' range, ${s.pts.filter(p => p.z > 0.5).length} ahead"><div class="zone"></div><i class="${cls}" style="left:${pos}%"></i></div>
      <span class="n">${s.n} games</span></div>`;
  };

  // Where you die, on the map (y runs upward on Summoner's Rift).
  const deaths = rows.flatMap(r => r.A.deaths.filter(d => d.e.position).map(d => ({ r, d })));
  const S = 300, px = v => v / 14870 * S, py = v => S - v / 14980 * S;
  const zones = {}; for (const { d } of deaths) { const a = area(d.e.position.x, d.e.position.y); zones[a] = (zones[a] || 0) + 1; }
  const topZones = Object.entries(zones).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([z, c]) => `<b>${Math.round(100 * c / deaths.length)}%</b> ${z}`).join(" · ");
  const map = `<div class="card"><div class="ctitle">Where you die</div><svg viewBox="0 0 ${S} ${S}" width="100%" style="border-radius:8px;background:#0a1020;max-width:520px;display:block;margin:8px auto 0">
      <image href="https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/map/map11.png" width="${S}" height="${S}" opacity=".5"/>
      ${deaths.map(({ r, d }) => `<circle cx="${px(d.e.position.x)}" cy="${py(d.e.position.y)}" r="${d.t < 840 ? 5 : 4}" fill="${d.t < 840 ? "var(--red)" : "var(--gold)"}" fill-opacity="${d.t < 840 ? .85 : .45}" stroke="#0a1020"><title>${esc(gameLabel(r.g))} · ${clock(d.t)}</title></circle>`).join("")}</svg>
      <div class="legend"><span><i style="background:var(--red);border-radius:50%;width:9px;height:9px"></i>before 14:00</span><span><i style="background:var(--gold);border-radius:50%;width:9px;height:9px;opacity:.6"></i>later</span></div>
      <div class="sub" style="margin-top:6px">${deaths.length} deaths${topZones ? ": " + topZones : ""}</div></div>`;

  // Champion pool
  const groups = {};
  for (const r of rows) (groups[r.g.champion + ":" + r.A.role] ??= []).push(r);
  const pool = Object.values(groups).sort((a, b) => b.length - a.length).map(rs => {
    const st = dashStats(rs).sort((a, b) => a.z - b.z)[0], w = rs.filter(r => r.g.win).length, g = rs[rs.length - 1].g;
    const note = !rs.some(r => r.B) ? "no expert data yet" : st && st.z < -0.4 ? `gap: ${st.m.label.toLowerCase()}` : st ? "on pace with experts" : "needs 3+ games to compare";
    return `<div class="card" data-og="${g.id}"><img src="${champIcon(g.champion)}" alt=""><div><b>${esc(champName(g.champion))}</b> <span class="sub">${ROLE_NAME[rs[0].A.role] || ""}</span>
      <small>${rs.length} game${rs.length === 1 ? "" : "s"} · ${w}–${rs.length - w}</small><small class="${st && st.z < -0.4 ? "bad" : ""}">${note}</small></div></div>`;
  }).join("");

  const curveKey = STATE.curve || "gold";
  const db = deathBlocks(rows);
  $("view").classList.add("wide");
  $("view").innerHTML = `<div id="dash">
    <h1>Your last ${rows.length} games</h1>
    <div class="sub">${wins}–${rows.length - wins} · each game is compared with high-elo games on the same champion and role${withB < rows.length ? ` · expert data for ${withB} of ${rows.length} games` : ""}</div>
    <div class="formstrip" title="Newest on the left">${rows.slice().reverse().map(r => `<i class="${r.g.win ? "w" : ""}" title="${esc(gameLabel(r.g))}"></i>`).join("")}</div>
    <div class="hero">${hero}${strength}${form}</div>
    ${progress}
    <div class="dgrid">
      <div class="card a-radar"><div class="ctitle">Your shape vs experts</div><div class="sub">Each spoke is a skill. The dashed ring is the expert median; further out is better.</div>${radarSvg(stats)}
        <div class="legend"><span><i style="background:var(--gold)"></i>You</span><span><i style="background:transparent;border:1px dashed var(--blue)"></i>Experts</span></div></div>
      <div class="card a-curve"><div class="ctitle">Your average game, minute by minute</div>
        <div class="seg" id="curveSeg">${Object.entries(CURVES).map(([k, c]) => `<button data-ck="${k}" class="${k === curveKey ? "on" : ""}">${c[0]}</button>`).join("")}</div>
        <div id="curve">${curveSvg(rows, curveKey)}</div>
        <div class="legend"><span><i style="background:var(--gold)"></i>You, compared with experts on the same champion</span><span><i style="background:var(--blue-wash);border:1px solid var(--blue)"></i>Experts' usual range</span></div></div>
      <div class="card a-deaths"><div class="ctitle">When you die</div><div class="sub">${esc(db.note)}</div>${deathBarsSvg(db)}
        <div class="legend"><span><i style="background:var(--red)"></i>You</span>${db.exp ? `<span><i style="background:repeating-linear-gradient(135deg,#5d6987 0 2px,#253150 2px 4px)"></i>Experts</span>` : ""}<span>deaths per game, by game minute</span></div></div>
      <div class="a-map">${map}</div>
      <div class="card a-games"><div class="ctitle">Your lane, game by game</div><div class="sub">${esc(laneNote(rows))}</div>${gamesSvg(rows)}
        <div class="legend"><span><i style="background:var(--blue)"></i>ahead of your lane opponent</span><span><i style="background:var(--red)"></i>behind</span><span>gold at 15:00 · click a bar to open the game · oldest on the left</span></div></div>
      <div class="a-pool"><h2>Champions</h2><div class="pool">${pool}</div></div>
    </div>
    ${stats.length ? `<details class="allnums"><summary>Show all numbers</summary>
    <div class="card"><div class="score h"><span></span><span>You</span><span>Experts</span><span style="display:flex;justify-content:space-between"><span>behind</span><span>their usual range</span><span>ahead</span></span><span></span></div>
      ${stats.map(scoreRow).join("")}</div></details>` : ""}
    <p class="sub" style="margin-top:22px">Averages of your games against the expert median for each game's champion and role. Fixed rules on the numbers, no AI.</p></div>`;
  document.querySelectorAll("#curveSeg button").forEach(b => b.onclick = () => {
    STATE.curve = b.dataset.ck;
    document.querySelectorAll("#curveSeg button").forEach(x => x.classList.toggle("on", x === b));
    $("curve").innerHTML = curveSvg(rows, b.dataset.ck);
  });
  const rb = $("reelBtn"); if (rb) rb.onclick = () => $("reel").classList.toggle("open");
  document.querySelectorAll("[data-rw]").forEach(b => b.onclick = () => { const [id, t] = b.dataset.rw.split(":"); watch(id, +t, b); });
  document.querySelectorAll("[data-og]").forEach(b => b.onclick = () => { STATE.tab = "moments"; openGame(b.dataset.og); });
}

let toastTimer;
function toast(msg, sticky) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); if (!sticky) toastTimer = setTimeout(() => t.style.display = "none", 7000);
}
// External links open in the default browser (this window is an Edge app window).
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[target=_blank]"); if (!a) return;
  e.preventDefault();
  api("/api/open?url=" + encodeURIComponent(a.href), { method: "POST" }).catch(() => window.open(a.href));
});
// Replay buttons for games from an older patch are switched off.
function markExpired(root, gameId) {
  if (!replayExpired(gameId)) return;
  root.querySelectorAll("[data-watch]").forEach(b => { b.disabled = true; b.dataset.expired = "1"; b.textContent = "Replay expired"; });
}
async function watch(gameId, t, btn) {
  if (replayExpired(gameId)) { toast("This game is from an older patch, so League can't play its replay anymore."); return; }
  document.querySelectorAll("[data-watch]").forEach(b => b.disabled = true);
  try {
    await api(`/api/replay/${gameId}?t=${t}`, { method: "POST" });
    // A slim caption bar comes up over the replay with this game's moments.
    if (STATE.overlay?.game == gameId) api(`/api/overlay/${gameId}`, { method: "POST", body: JSON.stringify(STATE.overlay) }).catch(() => {});
  }
  catch (e) { toast(e.message); document.querySelectorAll("[data-watch]").forEach(b => b.disabled = !!b.dataset.expired); return; }
  toast("Opening the replay...", true);
  const poll = async () => {
    const r = await api("/api/replay").catch(() => ({ state: "error", message: "Lost touch with the app." }));
    toast(r.message, r.state === "working");
    if (r.state === "working") setTimeout(poll, 1200);
    else document.querySelectorAll("[data-watch]").forEach(b => b.disabled = !!b.dataset.expired);
  };
  poll();
}
async function enableApi() {
  try {
    const r = await api("/api/replay-setup", { method: "POST" });
    STATE.replayApi = r.replayApi;
    toast("Replay jumping is on. It applies to the next replay you open.");
    if (STATE.current) openGame(STATE.current);
  } catch (e) { toast("Couldn't change League's settings: " + e.message); }
}

loadDD().then(loadList).catch(e => { $("list").innerHTML = `<div class="note">Couldn't load: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
