  });
}

const BP = [5, 10, 15, 20];
const METRICS = [
  ["gold", "Gold", v => Math.round(v).toLocaleString()],
  ["cs", "CS", v => Math.round(v)],
  ["level", "Level", v => (Math.round(v * 10) / 10)],
  ["xpdiff", "XP vs lane opponent", v => signed(v)],
  ["gdiff", "Gold vs lane opponent", v => signed(v), "diff"],
  ["csdiff", "CS vs lane opponent", v => signed(v)],
];
const mine = (A, k) => ({ gdiff: A.diff, gold: A.myGold, cs: A.myCs })[k] ?? A[k];

function findings(A, B) {
  const out = [];
  // Break points that fall below the experts' middle half
  for (const [k, label, fmt] of METRICS) {
    const s = mine(A, k); if (!s) continue;
    for (const m of [10, 15, 20]) {
      const b = B.minutes[k]?.[m]; if (!b || s.length <= m) continue;
      const [p25, p50, p75] = b, spread = Math.max(1, p75 - p25);
      if (s[m] < p25) out.push({ sev: (p25 - s[m]) / spread, t: m * 60,
        title: `${label} at ${m}:00: ${fmt(s[m])}`, text: `Experts: ${fmt(p50)} (middle half ${fmt(p25)} to ${fmt(p75)}).` });
    }
  }
  // Keep the worst minute per metric
  const seen = new Set(); const dedup = out.sort((a, b) => b.sev - a.sev).filter(f => { const k = f.title.split(" at ")[0]; if (seen.has(k)) return false; seen.add(k); return true; });
  // Items
  const items = B.items, byId = Object.fromEntries(items.map(i => [i.id, i]));
  A.items.slice(0, 5).forEach((b, n) => {
    const e = byId[b.id], slot = n + 1;
    if (!e) { dedup.push({ sev: 0.8, t: b.t, title: `${itemName(b.id)} (item ${slot})`, text: `Experts on ${champName(A.me.championId)} almost never build it.` }); return; }
    const key = isArmorPen(b.id) ? "armor" + Math.min(A.armorN, 2) : isMagicPen(b.id) ? "mr" + Math.min(A.mrN, 2) : null;
    const r = key && e.by[key] ? e.by[key][0] / Math.max(1, e.by[key][1]) : e.rate;
    if (e.rate < 0.2) dedup.push({ sev: 0.7, t: b.t, title: `${itemName(b.id)} as item ${slot}`, text: `Only ${Math.round(e.rate * 100)}% of expert games build it at all.` });
    // Armor pen: champions get ~50+ armor from levels alone by 20-25 min, so it's worth it 3rd even into a squishy team.
    else if (isPctPen(b.id) && slot >= Math.max(4, Math.round(e.slot) + 1)) {
      const arm = enemyArmorAt(A, Math.round(e.time / 60));
      dedup.push({ sev: 1 + (slot - e.slot) * 0.3, t: b.t, title: `${itemName(b.id)} came ${ord(slot)}, at ${clock(b.t)}`,
        text: `Experts who build it get it ${ord(Math.round(e.slot))} (~${clock(e.time)}).${arm ? ` At ${Math.round(e.time / 60)}:00 the enemy team already averaged <b>${arm}</b> armor` : " By 20–25 minutes most champions have 50+ armor from levels alone"}${A.armorN ? "" : ", even without armor items"}, so it pays off as a 3rd item. It matters most once real team fights start.` });
    }
    else if (slot >= e.slot + 2 && key && r < 0.4) dedup.push({ sev: 0.5, t: b.t, title: `${itemName(b.id)} came ${ord(slot)}, at ${clock(b.t)}`,
      text: `Experts who build it usually get it ${ord(Math.round(e.slot))} (~${clock(e.time)}), but only ${Math.round(r * 100)}% of their games ${defenseText(key)} include it. Against this team it wasn't urgent.` });
    else if (slot >= e.slot + 2) dedup.push({ sev: 1 + (slot - e.slot) * 0.3, t: b.t, title: `${itemName(b.id)} came ${ord(slot)}, at ${clock(b.t)}`,
      text: `Experts buy it ${ord(Math.round(e.slot))}, around ${clock(e.time)}${key ? `, and ${Math.round(r * 100)}% of their games ${defenseText(key)} include it` : ""}.` });
  });
  // Items experts usually get in games like this that you didn't
  const mineIds = new Set(A.items.slice(0, 4).map(b => b.id));
  for (const e of items) {
    if (mineIds.has(e.id)) continue;
    const key = isArmorPen(e.id) ? "armor" + Math.min(A.armorN, 2) : isMagicPen(e.id) ? "mr" + Math.min(A.mrN, 2) : null;
    if (!key || !e.by[key] || e.by[key][1] < 8) continue;
    const r = e.by[key][0] / e.by[key][1];
    if (r >= 0.6 && A.minutes >= 22) dedup.push({ sev: 1.2, t: e.time, title: `No ${e.name} in your first 4 items`, text: `Experts build it in ${Math.round(r * 100)}% of games ${defenseText(key)}, usually ${ord(Math.round(e.slot))}.` });
  }
  // Timings
  const T = B.timings, cmp = (mineV, b, title, fmt, worse) => {
    if (mineV == null || !b) return; const [p25, p50, p75] = b;
    if (worse(mineV, p25, p75)) dedup.push({ sev: 0.9, t: null, title: `${title}: ${fmt(mineV)}`, text: `Experts: ${fmt(p50)} (middle half ${fmt(p25)} to ${fmt(p75)}).` });
  };
  cmp(A.backs[0]?.t, T.first_back, "First back", clock, (v, lo, hi) => v > hi + 30);
  cmp(A.firstItem, T.legendary1, "First item", clock, (v, lo, hi) => v > hi);
  cmp(A.deaths.filter(d => d.t < 840).length, T.deaths_14, "Deaths before 14:00", v => Math.round(v), (v, lo, hi) => v > hi);
  cmp(A.deaths.length, T.deaths, "Deaths", v => Math.round(v), (v, lo, hi) => v > hi);
  return dedup.sort((a, b) => b.sev - a.sev).slice(0, 6);
}
const ord = (n) => n + (["th", "st", "nd", "rd"][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || "th");
const isArmorPen = (id) => /armor penetration|lethality/i.test(DD.items[id]?.description || "") || (DD.items[id]?.stats?.FlatArmorPenetrationMod || 0) > 0 || /Dominik|Mortal Reminder|Serylda|Black Cleaver/i.test(itemName(id));
const isPctPen = (id) => /Dominik|Mortal Reminder|Serylda|Black Cleaver|Terminus/i.test(itemName(id));
const isMagicPen = (id) => /magic penetration/i.test(DD.items[id]?.description || "") || /Void Staff|Cryptbloom|Shadowflame/i.test(itemName(id));
const defenseText = (key) => ({ armor0: "where no enemy built armor", armor1: "where one enemy built armor", armor2: "where two or more enemies built armor",
  mr0: "where no enemy built magic resist", mr1: "where one enemy built magic resist", mr2: "where two or more enemies built magic resist" })[key];

function expertsView(A, B) {
  const champ = champName(A.me.championId), F = findings(A, B);
  const cell = (k, m, fmt) => {
    const s = mine(A, k), b = B.minutes[k]?.[m];
    if (!s || s.length <= m) return `<td class="sub">—</td>`;
    const cls = b ? (s[m] < b[0] ? "bad" : s[m] > b[2] ? "good" : "") : "";
    return `<td><span class="y ${cls}">${fmt(s[m])}</span>${b ? `<span class="e">experts ${fmt(b[1])} (${fmt(b[0])} to ${fmt(b[2])})</span>` : ""}</td>`;
  };
  const byId = Object.fromEntries(B.items.map(i => [i.id, i]));
  const tRow = (label, mineV, b, fmt, lowerBetter = true) => {
    const cls = mineV == null || !b ? "" : lowerBetter ? (mineV > b[2] ? "bad" : mineV < b[0] ? "good" : "") : (mineV < b[0] ? "bad" : mineV > b[2] ? "good" : "");
    return `<tr><td>${label}</td><td><span class="y ${cls}">${mineV == null ? "—" : fmt(mineV)}</span></td><td>${b ? fmt(b[1]) : "—"}</td><td class="sub">${b ? fmt(b[0]) + " to " + fmt(b[2]) : ""}</td></tr>`;
  };
  const T = B.timings;
  return `
  <p class="sub" style="margin:14px 0 0">Compared with <b>${B.games}</b> ranked games from <b>${B.players}</b> ${/onetricks/.test(B.source || "") ? `top ${esc(champ)} one-tricks on onetricks.gg` : `Master+ players on ${esc(champ)}`} (${esc(B.regions.join(", "))}), built ${esc(B.built)}. Expert numbers are the middle game (median) and the middle half of their games.</p>

  <h2>What stands out</h2>
  <div class="card">${F.length ? F.map(f => `<div class="finding"><b>${esc(f.title)}</b><span>${f.text}</span>
      ${f.t != null ? ` <button style="margin-left:8px;padding:2px 8px" data-watch="${Math.max(0, f.t - 30)}">Watch ${clock(Math.max(0, f.t - 30))}</button>` : ""}</div>`).join("")
    : `<div class="empty" style="padding:10px 0">You were within the experts' usual range on everything checked.</div>`}</div>

  <h2>Break points</h2>
  <div class="card"><table class="grid"><tr><th></th>${BP.map(m => `<th>${m}:00</th>`).join("")}</tr>
    ${METRICS.map(([k, label, fmt]) => `<tr><td>${label}</td>${BP.map(m => cell(k, m, fmt)).join("")}</tr>`).join("")}</table></div>

  <h2>Over the game</h2>
  <div class="card"><div class="seg">${METRICS.filter(([k]) => mine(A, k)).map(([k, label], i) => `<button data-k="${k}" class="${i ? "" : "on"}">${label}</button>`).join("")}</div>
    <div id="xchart">${benchChart(A, B, "gold")}</div>
    <div class="legend"><span><i style="background:var(--gold)"></i>You</span><span><i style="background:var(--blue-wash);border:1px solid var(--blue)"></i>Middle half of expert games</span><span style="color:var(--red-ink)">✕ your deaths</span></div></div>

  ${setupCard(A, B)}
  <h2>Build</h2>
  ${buildStrip(A)}
  ${buildPaths(A, B)}
  <div class="card"><table class="grid"><tr><th>Your items</th><th>Bought</th><th>Experts</th><th>How often experts build it</th></tr>
    ${A.items.slice(0, 6).map((b, n) => { const e = byId[b.id]; return `<tr><td>${n + 1}. ${esc(itemName(b.id))}</td><td>${clock(b.t)}</td>
      <td>${e ? `usually ${ord(Math.round(e.slot))}, ~${clock(e.time)}` : "—"}</td><td>${e ? Math.round(e.rate * 100) + "%" : "rarely"}</td></tr>`; }).join("") || `<tr><td colspan="4" class="sub">No completed items.</td></tr>`}
  </table>
  <div class="sub" style="margin-top:10px">Enemies who built armor: <b>${A.armorN}</b> · magic resist: <b>${A.mrN}</b>.</div></div>

  <h2>Timings</h2>
  <div class="card"><table class="grid"><tr><th></th><th>You</th><th>Experts</th><th>Middle half</th></tr>
    ${tRow("First back", A.backs[0]?.t ?? null, T.first_back, clock)}
    ${tRow("Gold spent on first back", A.backs[0]?.spent ?? null, T.first_back_gold, v => Math.round(v).toLocaleString(), false)}
    ${tRow("Backs before 14:00", A.backs.filter(b => b.t < 840).length, T.backs_before_14, v => Math.round(v), false)}
    ${tRow("First item", A.firstItem, T.legendary1, clock)}
    ${tRow("Second item", A.items[1]?.t ?? null, T.legendary2, clock)}
    ${tRow("Level 6 vs opponent (s)", A.lvl6 != null && A.oppLvl6 != null ? A.lvl6 - A.oppLvl6 : null, T.lvl6_gap, v => (v <= 0 ? Math.round(-v) + "s ahead" : Math.round(v) + "s behind"))}
    ${tRow("Deaths before 14:00", A.deaths.filter(d => d.t < 840).length, T.deaths_14, v => Math.round(v))}
    ${tRow("Deaths", A.deaths.length, T.deaths, v => Math.round(v))}
  </table></div>`;
}

function benchChart(A, B, k) {
  const curve = mine(A, k), band = B.minutes[k] || [];
  if (!curve) return `<div class="sub">Not available for this game.</div>`;
  const W = 1000, H = 240, L = 56, R = 12, T = 12, Bm = 26, n = A.minutes;
  let lo = Math.min(...curve), hi = Math.max(...curve);
  band.slice(0, n + 1).forEach(b => { if (b) { lo = Math.min(lo, b[0]); hi = Math.max(hi, b[2]); } });
  if (k.endsWith("diff")) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * .08 || 1; lo -= pad; hi += pad;
  const x = m => L + (m / n) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - Bm);
  const fmt = METRICS.find(mm => mm[0] === k)[2];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for (let i = 0; i <= 4; i++) { const v = lo + (hi - lo) * i / 4; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-soft)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; }
  if (k.endsWith("diff")) s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>`;
  for (let m = 0; m <= n; m += 5) s += `<text x="${x(m)}" y="${H - 8}" text-anchor="middle">${m}:00</text>`;
  const pts = band.slice(0, n + 1).map((b, m) => b && [m, b]).filter(Boolean);

  const wins = rows.filter(r => r.g.win).length;
  const worst = stats.slice().sort((a, b) => a.z - b.z)[0], best = stats.slice().sort((a, b) => b.z - a.z)[0];
  const isBad = worst && worst.z < -0.25, isGood = best && best.z > 0.25 && best !== worst;

  // What to watch for the headline: the deaths themselves, or the games where the gap was biggest.
  let reel = "";
  if (isBad) {
    if (worst.m.k === "deaths14" || worst.m.k === "deaths") {
      // Newest games first, the first four deaths of each.
      const ds = rows.slice().reverse().flatMap(r => r.A.deaths.filter(d => worst.m.k === "deaths" || d.t < 840).slice(0, 4).map(d => ({ r, d }))).slice(0, 12);
      reel = ds.map(({ r, d }) => {
        const who = [d.e.killerId, ...(d.e.assistingParticipantIds || [])].filter(p => p > 0).map(r.A.champOf).join(" + ");
        return `<div><span><b>${clock(d.t)}</b> · ${esc(gameLabel(r.g))}${who ? " · to " + esc(who) : ""}${d.e.position ? " · " + area(d.e.position.x, d.e.position.y) : ""}</span>
          <button data-rw="${r.g.id}:${Math.max(0, d.t - 30)}">Watch</button></div>`;
      }).join("");
    } else {
      reel = worst.pts.slice().sort((a, b) => a.z - b.z).slice(0, 4).map(p =>
        `<div><span><b>${worst.m.fmt(p.y)}</b> (experts ${worst.m.fmt(p.p50)}) · ${esc(gameLabel(p.r.g))}</span><button data-og="${p.r.g.id}">Open game</button></div>`).join("");
    }
  }
  const hero = isBad ? `
    <div class="card gap"><div class="eyebrow">Biggest gap vs experts</div>
      <div class="big bad">${worst.m.big(worst.you, worst.exp)}</div>
      <h3>${esc(worst.m.head(worst.you, worst.exp))}.</h3>
      <p>${worst.m.fmt(worst.you)} vs ${worst.m.fmt(worst.exp)} ${worst.m.unit} · last ${worst.n} games · ${trendText(worst.trend)}</p>
      <p><button class="primary" id="reelBtn">${worst.m.k.startsWith("deaths") ? "Watch them" : "Show the worst games"}</button></p>
      <div class="reel" id="reel">${reel}</div></div>`
    : `<div class="card edge"><div class="eyebrow">vs experts</div><div class="big good">${stats.length ? "On pace" : "—"}</div>
      <h3>${stats.length ? "You're inside the experts' usual range on everything measured." : "No expert data for these champions yet."}</h3>
      <p>${stats.length ? `Across your last ${rows.length} games.` : "It appears here as soon as the site has high-elo games for the champions you played."}</p></div>`;
  const strength = isGood ? `
    <div class="card edge"><div class="eyebrow">Your edge</div>
      <div class="big good">${best.m.big(best.you, best.exp)}</div>
      <h3>${esc(best.m.good(best.you, best.exp))}.</h3>
      <p>${best.m.fmt(best.you)} vs ${best.m.fmt(best.exp)} ${best.m.unit} · last ${best.n} games</p></div>`
    : `<div class="card"><div class="eyebrow">Your edge</div><div class="big" style="font-size:44px">—</div>
      <h3>Nothing clearly ahead of experts yet.</h3><p>It shows up once a stat sits above their usual range.</p></div>`;
  const newest = rows.slice().reverse();
  let streak = 0; for (const r of newest) { if (r.g.win === newest[0].g.win) streak++; else break; }
  const per = (f) => avg(rows.map(f));
  const form = `<div class="card"><div class="eyebrow">Recent form</div>
      <div class="big" style="font-size:44px">${wins}–${rows.length - wins}</div>
      <h3>${Math.round(100 * wins / rows.length)}% win rate</h3>
      <div class="formstats"><span><b>${per(r => r.A.me.stats.kills).toFixed(1)} / ${per(r => r.A.me.stats.deaths).toFixed(1)} / ${per(r => r.A.me.stats.assists).toFixed(1)}</b>avg KDA</span>
        <span><b class="${newest[0].g.win ? "good" : "bad"}">${streak}${newest[0].g.win ? "W" : "L"}</b>streak</span>
        <span><b>${Math.round(per(r => r.A.g.gameDuration) / 60)}m</b>avg game</span></div></div>`;

  // Progress against yourself: your newer half of these games against the older half.
  const up = stats.filter(s => s.n >= 6 && s.trend > 0.2 && s.m.fmt(s.older) !== s.m.fmt(s.newer)).sort((a, b) => b.trend - a.trend).slice(0, 3);
  const enough = stats.some(s => s.n >= 6);
  const progress = !stats.length ? "" : `<div class="card progress"><div><div class="ctitle">Getting better</div><div class="sub">Your newer games against your older ones</div></div>
    ${up.length ? up.map(s => `<div class="pg"><span>${s.m.label}</span><b>${s.m.fmt(s.older)} → <em>${s.m.fmt(s.newer)}</em></b><small>experts ${s.m.fmt(s.exp)} · ${s.n} games</small></div>`).join("")
      : `<div class="pg" style="grid-column:2 / -1"><span>${enough ? "Holding steady: no stat moved much between your older and newer games." : "Trends show up here once you have 6 or more games with expert data."}</span></div>`}</div>`;

  const scoreRow = (s) => {
    const pos = Math.max(3, Math.min(97, 50 + s.z * 25)), cls = s.z < -0.5 ? "bad" : s.z > 0.5 ? "good" : "";
    return `<div class="score"><span>${s.m.label}</span><span class="y ${cls}">${s.m.fmt(s.you)}</span><span class="sub">${s.m.fmt(s.exp)}</span>
      <div class="track" title="${s.pts.filter(p => p.z < -0.5).length} of ${s.n} games behind the experts' range, ${s.pts.filter(p => p.z > 0.5).length} ahead"><div class="zone"></div><i class="${cls}" style="left:${pos}%"></i></div>
      <span class="n">${s.n} games</span></div>`;
  };

  // Where you die, on the map (y runs upward on Summoner's Rift).
  const deaths = rows.flatMap(r => r.A.deaths.filter(d => d.e.position).map(d => ({ r, d })));
  const S = 300, px = v => v / 14870 * S, py = v => S - v / 14980 * S;
  const zones = {}; for (const { d } of deaths) { const a = area(d.e.position.x, d.e.position.y); zones[a] = (zones[a] || 0) + 1; }
  const topZones = Object.entries(zones).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([z, c]) => `<b>${Math.round(100 * c / deaths.length)}%</b> ${z}`).join(" · ");
  const map = `<div class="card"><div class="ctitle">Where you die</div><svg viewBox="0 0 ${S} ${S}" width="100%" style="border-radius:8px;background:#0a1020;max-width:520px;display:block;margin:8px auto 0">
      <image href="https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/map/map11.png" width="${S}" height="${S}" opacity=".5"/>
      ${deaths.map(({ r, d }) => `<circle cx="${px(d.e.position.x)}" cy="${py(d.e.position.y)}" r="${d.t < 840 ? 5 : 4}" fill="${d.t < 840 ? "var(--red)" : "var(--gold)"}" fill-opacity="${d.t < 840 ? .85 : .45}" stroke="#0a1020"><title>${esc(gameLabel(r.g))} · ${clock(d.t)}</title></circle>`).join("")}</svg>
      <div class="legend"><span><i style="background:var(--red);border-radius:50%;width:9px;height:9px"></i>before 14:00</span><span><i style="background:var(--gold);border-radius:50%;width:9px;height:9px;opacity:.6"></i>later</span></div>
      <div class="sub" style="margin-top:6px">${deaths.length} deaths${topZones ? ": " + topZones : ""}</div></div>`;

  // Champion pool
  const groups = {};
  for (const r of rows) (groups[r.g.champion + ":" + r.A.role] ??= []).push(r);
  const pool = Object.values(groups).sort((a, b) => b.length - a.length).map(rs => {
    const st = dashStats(rs).sort((a, b) => a.z - b.z)[0], w = rs.filter(r => r.g.win).length, g = rs[rs.length - 1].g;
    const note = !rs.some(r => r.B) ? "no expert data yet" : st && st.z < -0.4 ? `gap: ${st.m.label.toLowerCase()}` : st ? "on pace with experts" : "needs 3+ games to compare";
    return `<div class="card" data-og="${g.id}"><img src="${champIcon(g.champion)}" alt=""><div><b>${esc(champName(g.champion))}</b> <span class="sub">${ROLE_NAME[rs[0].A.role] || ""}</span>
      <small>${rs.length} game${rs.length === 1 ? "" : "s"} · ${w}–${rs.length - w}</small><small class="${st && st.z < -0.4 ? "bad" : ""}">${note}</small></div></div>`;
  }).join("");

  const curveKey = STATE.curve || "gold";
  const db = deathBlocks(rows);
  $("view").classList.add("wide");
  $("view").innerHTML = `<div id="dash">
    <h1>Your last ${rows.length} games</h1>
    <div class="sub">${wins}–${rows.length - wins} · each game is compared with high-elo games on the same champion and role${withB < rows.length ? ` · expert data for ${withB} of ${rows.length} games` : ""}</div>
    <div class="formstrip" title="Newest on the left">${rows.slice().reverse().map(r => `<i class="${r.g.win ? "w" : ""}" title="${esc(gameLabel(r.g))}"></i>`).join("")}</div>
    <div class="hero">${hero}${strength}${form}</div>
    ${progress}
    <div class="dgrid">
      <div class="card a-radar"><div class="ctitle">Your shape vs experts</div><div class="sub">Each spoke is a skill. The dashed ring is the expert median; further out is better.</div>${radarSvg(stats)}
        <div class="legend"><span><i style="background:var(--gold)"></i>You</span><span><i style="background:transparent;border:1px dashed var(--blue)"></i>Experts</span></div></div>
      <div class="card a-curve"><div class="ctitle">Your average game, minute by minute</div>
        <div class="seg" id="curveSeg">${Object.entries(CURVES).map(([k, c]) => `<button data-ck="${k}" class="${k === curveKey ? "on" : ""}">${c[0]}</button>`).join("")}</div>
        <div id="curve">${curveSvg(rows, curveKey)}</div>
        <div class="legend"><span><i style="background:var(--gold)"></i>You, compared with experts on the same champion</span><span><i style="background:var(--blue-wash);border:1px solid var(--blue)"></i>Experts' usual range</span></div></div>
      <div class="card a-deaths"><div class="ctitle">When you die</div><div class="sub">${esc(db.note)}</div>${deathBarsSvg(db)}
        <div class="legend"><span><i style="background:var(--red)"></i>You</span>${db.exp ? `<span><i style="background:repeating-linear-gradient(135deg,#5d6987 0 2px,#253150 2px 4px)"></i>Experts</span>` : ""}<span>deaths per game, by game minute</span></div></div>
      <div class="a-map">${map}</div>
      <div class="card a-games"><div class="ctitle">Your lane, game by game</div><div class="sub">${esc(laneNote(rows))}</div>${gamesSvg(rows)}
        <div class="legend"><span><i style="background:var(--blue)"></i>ahead of your lane opponent</span><span><i style="background:var(--red)"></i>behind</span><span>gold at 15:00 · click a bar to open the game · oldest on the left</span></div></div>
      <div class="a-pool"><h2>Champions</h2><div class="pool">${pool}</div></div>
    </div>
    ${stats.length ? `<details class="allnums"><summary>Show all numbers</summary>
    <div class="card"><div class="score h"><span></span><span>You</span><span>Experts</span><span style="display:flex;justify-content:space-between"><span>behind</span><span>their usual range</span><span>ahead</span></span><span></span></div>
      ${stats.map(scoreRow).join("")}</div></details>` : ""}
    <p class="sub" style="margin-top:22px">Averages of your games against the expert median for each game's champion and role. Fixed rules on the numbers, no AI.</p></div>`;
  document.querySelectorAll("#curveSeg button").forEach(b => b.onclick = () => {
    STATE.curve = b.dataset.ck;
    document.querySelectorAll("#curveSeg button").forEach(x => x.classList.toggle("on", x === b));
    $("curve").innerHTML = curveSvg(rows, b.dataset.ck);
  });
  const rb = $("reelBtn"); if (rb) rb.onclick = () => $("reel").classList.toggle("open");
  document.querySelectorAll("[data-rw]").forEach(b => b.onclick = () => { const [id, t] = b.dataset.rw.split(":"); watch(id, +t, b); });
  document.querySelectorAll("[data-og]").forEach(b => b.onclick = () => { STATE.tab = "moments"; openGame(b.dataset.og); });
}

let toastTimer;
function toast(msg, sticky) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); if (!sticky) toastTimer = setTimeout(() => t.style.display = "none", 7000);
}
// External links open in the default browser (this window is an Edge app window).
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[target=_blank]"); if (!a) return;
  e.preventDefault();
  api("/api/open?url=" + encodeURIComponent(a.href), { method: "POST" }).catch(() => window.open(a.href));
});
// Replay buttons for games from an older patch are switched off.
function markExpired(root, gameId) {
  if (!replayExpired(gameId)) return;
  root.querySelectorAll("[data-watch]").forEach(b => { b.disabled = true; b.dataset.expired = "1"; b.textContent = "Replay expired"; });
}
async function watch(gameId, t, btn) {
  if (replayExpired(gameId)) { toast("This game is from an older patch, so League can't play its replay anymore."); return; }
  document.querySelectorAll("[data-watch]").forEach(b => b.disabled = true);
  try {
    await api(`/api/replay/${gameId}?t=${t}`, { method: "POST" });
    // A slim caption bar comes up over the replay with this game's moments.
    if (STATE.overlay?.game == gameId) api(`/api/overlay/${gameId}`, { method: "POST", body: JSON.stringify(STATE.overlay) }).catch(() => {});
  }
  catch (e) { toast(e.message); document.querySelectorAll("[data-watch]").forEach(b => b.disabled = !!b.dataset.expired); return; }
  toast("Opening the replay...", true);
  const poll = async () => {
    const r = await api("/api/replay").catch(() => ({ state: "error", message: "Lost touch with the app." }));
    toast(r.message, r.state === "working");
    if (r.state === "working") setTimeout(poll, 1200);
    else document.querySelectorAll("[data-watch]").forEach(b => b.disabled = !!b.dataset.expired);
  };
  poll();
}
async function enableApi() {
  try {
    const r = await api("/api/replay-setup", { method: "POST" });
    STATE.replayApi = r.replayApi;
    toast("Replay jumping is on. It applies to the next replay you open.");
    if (STATE.current) openGame(STATE.current);
  } catch (e) { toast("Couldn't change League's settings: " + e.message); }
}

  5011: "Health", 5013: "Tenacity and Slow Resist", 5002: "Armor", 5003: "Magic Resist" };
const CS = { st: null, champ: null, role: null, B: null, opp: null, picked: null, key: "" };

const runeIcon = (id, big) => DD.runes?.[id] ? `<img class="${big ? "ks" : ""}" src="https://ddragon.leagueoflegends.com/cdn/img/${DD.runes[id].icon}" title="${esc(DD.runes[id].name)}" alt="">` : "";
const styleIcon = (id) => DD.styles?.[id] ? `<img class="st" src="https://ddragon.leagueoflegends.com/cdn/img/${DD.styles[id].icon}" title="${esc(DD.styles[id].name)}" alt="">` : "";
const spellIcon = (id) => DD.spells?.[id] ? `<img src="https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/spell/${DD.spells[id].id}.png" title="${esc(DD.spells[id].name)}" alt="">` : "";
const champImg = (alias) => `<img src="https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/champion/${alias}.png" alt="">`;

async function startChampSelect() {
  document.title = "custy.gg · champ select";
  document.body.className = "cs";
  document.body.innerHTML = `<div id="csHead"></div><div id="csBody"><div class="empty">Reading champ select…</div></div><div id="toast" class="toast"></div>`;
  await loadDD(); await loadCsData();
  const tick = async () => {
    let st; try { st = await api("/api/champselect"); } catch (e) { $("csBody").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    if (st.phase !== "ChampSelect") {
      // After champ select the last pick stays up, so you can tab out mid-game to check the build and skills.
      if (CS.st?.champion) {
        if (CS.live !== false) { CS.live = false; CS.key = ""; }
        CS.phase = st.phase;
        const key = "off" + st.phase;
        if (CS.offKey !== key) { CS.offKey = key; drawChampSelect(); }
        return;
      }
      $("csHead").innerHTML = "";
      $("csBody").innerHTML = `<div class="empty">${st.error ? esc(st.error) : "Not in champ select right now. This window updates by itself when you're in one."}</div>`;
      return;
    }
    if (CS.live === false) { CS.champ = null; CS.key = ""; CS.offKey = ""; }   // a new champ select
    CS.live = true;
    CS.st = st;
    if (st.champion && (st.champion !== CS.champ || st.role !== CS.role)) {
      CS.champ = st.champion; CS.role = st.role; CS.picked = null;
      CS.B = st.role ? await api(`/api/benchmark/${st.champion}-${st.role}`).catch(() => null) : null;
    }
    CS.opp = CS.picked || st.opponent;
    const key = JSON.stringify([st.champion, st.role, CS.opp, st.enemies, !!CS.B, st.spells]);
    if (key !== CS.key) { CS.key = key; drawChampSelect(); }
  };
  await tick(); setInterval(tick, 2000);
}

// Levels where experts win or lose their lane fights (kills vs deaths with the lane opponent before 14:00).
// Uses the matchup when a level has 10+ fights there, else the champion overall. Returns {strong, weak, rows, vs}.
function levelStrength(B, opp) {
  const all = B?.by_level, mu = opp ? B?.matchups?.[opp]?.by_level : null;
  if (!all) return null;
  const rows = [];
  for (let lv = 1; lv <= 11; lv++) {
    const m = mu?.[lv], a = all[lv], src = m && m.kills + m.deaths >= 10 ? m : a;
    if (!src || src.kills + src.deaths < 10) continue;
    rows.push({ lv, k: src.kills, d: src.deaths, share: src.kills / (src.kills + src.deaths), dmg: src.dmg, odmg: src.opp_dmg, vs: src === m });
  }
  const span = (list) => {   // "3" or "5–7"
    const out = []; let a = null, b = null;
    for (const r of list) { if (b !== null && r.lv === b + 1) b = r.lv; else { if (a !== null) out.push(a === b ? `${a}` : `${a}–${b}`); a = b = r.lv; } }
    if (a !== null) out.push(a === b ? `${a}` : `${a}–${b}`);
    return out.length > 1 ? out.slice(0, -1).join(", ") + " and " + out[out.length - 1] : out.join("");
  };
  // Strong or weak compared with how this champion does overall, so a champion that wins most lanes
  // doesn't get "strong at every level".
  const tk = rows.reduce((a, r) => a + r.k, 0), td = rows.reduce((a, r) => a + r.d, 0), avg = tk / Math.max(1, tk + td);
  const hi = Math.max(.55, avg + .07), lo = Math.min(.45, avg - .07);
  for (const r of rows) r.tag = r.share >= hi ? "strong" : r.share <= lo ? "weak" : "";
  return { rows, avg, strong: span(rows.filter(r => r.tag === "strong")), weak: span(rows.filter(r => r.tag === "weak")), vs: rows.some(r => r.vs) };
}

function levelBars(ls, mark = {}) {
  const max = Math.max(...ls.rows.map(r => r.k + r.d));
  return `<div class="lvb">${ls.rows.map(r => `<div class="lr${mark[r.lv] ? " mk" : ""}"><span>Lv ${r.lv}</span>
    <div class="bar"><i class="w" style="width:${r.k / max * 100}%"></i><i class="l" style="width:${r.d / max * 100}%"></i></div>
    <small class="${r.tag === "strong" ? "good" : r.tag === "weak" ? "warn" : ""}">${Math.round(r.share * 100)}% won</small>${mark[r.lv] ? `<em>${mark[r.lv]}</em>` : ""}</div>`).join("")}</div>`;
}

// A short game plan from the expert numbers: the lane against this opponent, or the jungle's first minutes.
// Expert notes: matchup sheets written by one-tricks (scripts/matchups), credited and linked back.
const NOTES = { index: null, champ: {} };
function loadNotes(champ, redraw) {
  if (!NOTES.index) { NOTES.index = {}; api("/api/notes/index").then(d => { NOTES.index = d && !d.missing ? d : {}; redraw(); }).catch(() => {}); return; }
  const m = NOTES.index[champ];
  if ((m?.quality === "sheet" || m?.quality === "summary") && NOTES.champ[champ] === undefined) {
    NOTES.champ[champ] = null;
    api(`/api/notes/${champ}`).then(d => { NOTES.champ[champ] = d && !d.missing ? d : false; redraw(); }).catch(() => { NOTES.champ[champ] = false; });
  }
}
function expertNotes(champ, opp, redraw) {
  loadNotes(champ, redraw);
  const m = NOTES.index?.[champ];
  if (!m || !m.url) return "";
  const site = (m.url.match(/\/\/(?:www\.)?([^/]+)/) || [])[1] || "";
  const who = m.author ? esc(m.author) + (m.rank && m.rank !== "?" ? ` (${esc(m.rank)})` : "") : esc(site);
  const upd = String(m.updated || "").replace(/\?/g, "").trim(), yr = +(upd.match(/20\d\d/) || [0])[0];
  const old = yr && yr < 2025 ? `<span class="old" title="Written for an older patch. Items and runes may have changed; the lane advice usually still holds.">Lane tips only</span>` : "";
  const src = (label) => `<div class="src">${summ ? "Summarized from the guide by " : "From "}${who}${upd ? ` · updated ${esc(upd)}` : ""}${old} · <a href="${esc(m.url)}" target="_blank">${label}</a></div>`;
  const summ = m.quality === "summary";
  if (!summ && m.quality !== "sheet") {
    return `<div class="card xn"><div class="ctitle">Expert guide</div><div class="sub">A written ${esc(csName(champ))} guide${m.quality === "guide" ? "" : " with notes for each matchup"} on ${esc(site.includes("docs.google") ? "Google Sheets" : site)}. Open it for the author's full notes.</div>${src("Open the guide")}</div>`;
  }
  const d = NOTES.champ[champ];
  if (!d) return d === null ? `<div class="card xn"><div class="ctitle">Expert notes</div><div class="sub">Loading…</div></div>` : "";
  const gp = d.general ? `<div class="card xn"><div class="ctitle">Expert game plan</div><dl><dd>${esc(d.general)}</dd></dl>${src(summ ? "Open the full guide" : "Open the full sheet")}</div>` : "";
  if (!opp) return gp || `<div class="card xn"><div class="ctitle">Expert notes</div><div class="sub">${who} wrote notes for ${Object.keys(d.rows).length} opponents. Pick an opponent to see them.</div>${src(summ ? "Open the full guide" : "Open the full sheet")}</div>`;
  const rows = d.rows[opp];
  if (!rows && gp) return gp;
  if (!rows) return `<div class="card xn"><div class="ctitle">Expert notes</div><div class="sub">${who}'s ${summ ? "guide" : "sheet"} has nothing on ${esc(csName(opp))}.</div>${src(summ ? "Open the full guide" : "Open the full sheet")}</div>`;
  const body = rows.map(e => `${e.as ? `<div class="as">${esc(e.as)}</div>` : ""}<dl>${e.fields.map(([k, v]) => `${k ? `<dt>${esc(k)}</dt>` : ""}<dd>${esc(v)}</dd>`).join("")}</dl>`).join("");
  // no real advice for this opponent (only runes/build)? add the author's general game plan underneath
  const advice = rows.some(e => e.fields.some(([k, v]) => /tip|note|how|advice|summar/i.test(k) || (!k && v.length > 60)));
  const tail = !advice && d.general ? `<div class="as">How ${esc(m.author || "the author")} plays the lane in general</div><dl><dd>${esc(d.general)}</dd></dl>` : "";
  return `<div class="card xn"><div class="ctitle">Expert notes vs ${esc(csName(opp))}</div>${body}${tail}${src(summ ? "Open the full guide" : "Open the full sheet")}</div>`;
}

function gamePlan(B, champ, role, opp) {
  if (!B) return "";
  const S = B.setup || {}, M = opp ? B.matchups?.[opp] : null, L = [], name = csName(opp || ""), me = csName(champ);
  const pct = (x) => Math.round(x * 100) + "%", g = (v) => (v > 0 ? "+" : "") + Math.round(v);
  if (M) L.push(`<b>Experts on ${esc(me)} vs ${esc(name)}</b>: ${pct(M.win)} win rate over ${M.n} games.`);
  if (role === "JUNGLE") {
    const J = B.jungle;
    if (J) {
      L.push(J.start_top >= .6 ? `Most start <b>top side</b> (${pct(J.start_top)}).` : J.start_top <= .4 ? `Most start <b>bot side</b> (${pct(1 - J.start_top)}).` : `They start either side (${pct(J.start_top)} top).`);
      const c24 = expertClear(J);
      if (c24) L.push(`<b>First clear:</b> experts hit <b>level 4 at ${clock((J.lv4 || [172, 181, 217])[1])}</b> (most between ${clock((J.lv4 || [172, 181, 217])[0])} and ${clock((J.lv4 || [172, 181, 217])[2])}). Every few seconds counts: if you're past that, your route is losing time.${J.lane_before_clear != null ? ` ${J.lane_before_clear >= .5 ? `Over half the time (${pct(J.lane_before_clear)}) they show up in a lane <b>before</b> finishing it, so ganking early is normal on this champion.` : `Most (${pct(1 - J.lane_before_clear)}) <b>finish the clear first</b>, then look for a lane.`}` : ""}`);
      if (J.first_lane?.length) L.push(`First lane visit is usually <b>${J.first_lane[0][0]}</b> (${pct(J.first_lane[0][1] / J.n)}) around ${clock((J.first_lane_min || 3) * 60)}; first kill or assist around <b>${clock(J.first_takedown || 0)}</b>.`);
      const gl = Object.entries(J.ganks || {}).sort((a, b) => b[1][0] - a[1][0])[0];
      if (gl) L.push(`Most early takedowns come in <b>${gl[0]}</b> lane (${gl[1][0]} a game before 14:00).`);
      if (J.enemy_camps != null) L.push(J.enemy_camps >= 8 ? `They invade a lot: about <b>${J.enemy_camps}</b> enemy camps a game.` : `About ${J.enemy_camps} enemy camps a game.`);
      if (J.objs14) L.push(`Before 14:00 their team averages ${J.objs14.HORDE ?? 0} void grubs and ${J.objs14.DRAGON ?? 0} dragons.`);
    } else L.push("Expert jungle pathing for this champion is still being collected.");
    if (M) L.push(`Against ${esc(name)}'s jungle: ${M.gd10 >= 250 ? `experts are usually <b>${g(M.gd10)} gold</b> ahead at 10:00` : M.gd10 <= -250 ? `experts are usually <b>${g(M.gd10)} gold</b> behind at 10:00, so play around your lanes` : "usually even at 10:00"}.`);
  } else {
    const lv = M?.lvl2_first ?? (B.levels?.["2"]?.by?.[opp]?.[0] ?? B.levels?.["2"]?.first);
    if (lv != null) L.push(lv >= .55 ? `<b>First waves:</b> experts reach level 2 first in ${pct(lv)}${M ? " of these games" : ""}. Push the first two waves and look to trade when you hit 2.`
      : lv <= .35 ? `<b>First waves:</b> experts usually let ${esc(name || "them")} hit level 2 first (only ${pct(lv)} get there first). Don't fight their level 2; last-hit safely and trade back at 3.`
      : `<b>First waves:</b> level 2 is a race here (experts first in ${pct(lv)}).`);
    if (S.skills?.typical?.length >= 3) L.push(`Skills: start <b>${S.skills.typical.slice(0, 3).map(x => "QWER"[x - 1]).join(" › ")}</b>, max ${S.skills.order.slice(0, 3).split("").join(" › ")}.`);
    if (M) {
      L.push(M.gd10 >= 150 ? `<b>A lane experts win:</b> ${g(M.gd10)} gold and ${g(M.csd10)} CS at 10:00 on average. Play forward.`
        : M.gd10 <= -150 ? `<b>A lane experts lose a little:</b> ${g(M.gd10)} gold and ${g(M.csd10)} CS at 10:00. Give up some CS if you have to and play for later.`
        : `<b>Usually even at 10:00</b> (${g(M.gd10)} gold, ${g(M.csd10)} CS).`);
      L.push(M.kills14 >= 1.5 && M.deaths14 >= 1.5 ? `A bloody lane: experts average ${M.kills14} kills and ${M.deaths14} deaths before 14:00.`
        : M.kills14 < .8 && M.deaths14 < .8 ? `A quiet lane: under one kill or death before 14:00 on average. Win it on CS.`
        : `Before 14:00 experts average ${M.kills14} kills and ${M.deaths14} deaths here.`);
    }
    // Before the first item: does this matchup reward early aggression? Experts' gold lead at the minute
    // they usually finish their first item, against this opponent (20+ games).
    const firstItemT = B.timings?.legendary1?.[1];
    if (M?.n >= 20 && M.gd?.length && firstItemT) {
      const mi = Math.min(M.gd.length - 1, Math.floor(firstItemT / 60)), lead = M.gd[mi];
      const item = (B.paths || [])[0]?.items?.[0];
      const it = item ? ` (${esc(itemName(item))}, ~${clock(firstItemT)})` : ` (~${clock(firstItemT)})`;
      L.push(lead >= 150 ? `<b>Before your first item${it}:</b> experts are already <b>${Math.round(lead)} gold</b> up on ${esc(name)} by then. This is a lane to play aggressive early.`
        : lead <= -150 ? `<b>Before your first item${it}:</b> experts are usually <b>${Math.round(-lead)} gold</b> behind ${esc(name)} by then. The early lane is theirs; farm safely and play for your item.`
        : `<b>Before your first item${it}:</b> usually even (${g(lead)} gold). Neither side tends to win the early lane outright.`);
    }
    // When the lead moves most: the 3-minute stretch where experts' median gold lead grows (or shrinks) fastest,
    // against this opponent when there are 20+ games, else against everyone. Lined up with their item spikes.
    const curve = M?.n >= 20 && M.gd?.length >= 12 ? M.gd : (B.minutes?.gdiff || []).map(q => q?.[1]);
    const general = !(M?.n >= 20);
    if (curve.length >= 12) {
      let up = null, down = null;
      for (let m = 3; m + 3 < Math.min(curve.length, 16); m++) {
        const d = curve[m + 3] - curve[m];
        if (!up || d > up.d) up = { m, d };
        if (!down || d < down.d) down = { m, d };
      }
      const path = (B.paths || [])[0]?.items || [];
      const spikes = [[B.timings?.legendary1?.[1], path[0]], [B.timings?.legendary2?.[1], path[1]]].filter(([t, id]) => t && id);
      const spikeNear = (m) => spikes.filter(([t]) => t <= (m + 1.5) * 60 && t >= (m - 3) * 60).pop();
      const vsWho = general ? "" : ` on ${esc(name)}`;
      // players think in levels: the experts' typical level at each minute (median)
      const lvAt = (m) => B.minutes?.level?.[Math.min(m, (B.minutes.level.length || 1) - 1)]?.[1];
      const lvls = (a, b) => { const x = lvAt(a), y = lvAt(b); return x && y ? (x === y ? `level ${x}` : `levels ${x}–${y}`) : `${a}:00–${b}:00`; };
      if (up && up.d >= 150) {
        const sp = spikeNear(up.m);
        L.push(`<b>Power window: ${lvls(up.m, up.m + 3)}</b>${sp ? `, right after ${esc(itemName(sp[1]))}` : ""} (about ${up.m}:00–${up.m + 3}:00). Experts${vsWho} pull ahead most here (${g(up.d)} gold). Look for trades then.${general ? ` <span class="sub">(From all of their games.)</span>` : ""}`);
      }
      if (down && down.d <= -150) {
        // name the item that ends the weak stretch, if they finish one during or just after it
        const fix = spikes.find(([t]) => t >= down.m * 60 && t <= (down.m + 5) * 60);
        L.push(`<b>Careful: ${lvls(down.m, down.m + 3)}</b>${fix ? `, before ${esc(itemName(fix[1]))}` : ""} (about ${down.m}:00–${down.m + 3}:00). Experts usually lose ${Math.round(-down.d)} gold of lead${vsWho} here. Play safe and farm${fix ? ` until ${esc(itemName(fix[1]))} is done` : ""}.${general ? ` <span class="sub">(From all of their games.)</span>` : ""}`);
      }
    }
    const ls = levelStrength(B, opp);
    if (ls && (ls.strong || ls.weak)) {
      L.push(`<b>By level</b>${ls.vs ? ` vs ${esc(name)}` : ""}: ${ls.strong ? `experts win most of their lane fights at level${/[–and]/.test(ls.strong) ? "s" : ""} <b>${ls.strong}</b>` : ""}${ls.strong && ls.weak ? "; " : ""}${ls.weak ? `they lose most at level${/[–and]/.test(ls.weak) ? "s" : ""} <b>${ls.weak}</b>, so avoid fights there` : ""}.`);
    }
    const fb = M?.first_back ?? B.timings?.first_back?.[1], back = S.backs?.[0];
    const fbLv = B.minutes?.level?.[Math.floor((fb || 0) / 60)]?.[1];
    if (fb) L.push(`First back around <b>${clock(fb)}</b>${fbLv ? ` (level ${fbLv})` : ""}${back?.items?.length ? `, usually for ${back.items.slice(0, 2).map(([id]) => esc(itemName(id))).join(" and ")}` : ""}.`);
    if (!M && opp) L.push(`<span class="sub">Not enough expert games against ${esc(name)} for matchup numbers; these are for ${esc(me)} in general.</span>`);
  }
  return L.length ? `<div class="card plan"><div class="ctitle">Game plan${opp ? ` vs ${esc(name)}` : ""}</div>${L.map(l => `<div>${l}</div>`).join("")}</div>` : "";
}

// ---------------------------------------------------------------- Matchup guide: any champion, any opponent
const MU = { page: true, live: false, role: "TOP", champ: null, opp: null, B: null, index: null, q: "", oq: "" };
async function openMatchups() {
  STATE.current = "matchups";
  document.querySelectorAll(".game, .homerow").forEach(el => el.classList.remove("on"));
  $("murow")?.classList.add("on");
  if (!DD.runes) await loadCsData();
  if (!MU.index) MU.index = await api("/api/benchmark-index").catch(() => ({}));
  if (!MU.champ) {   // start from the champion and role you've played most lately
    const g = STATE.games[0]; if (g) { MU.champ = DD.champ[g.champion]?.id; MU.role = g.role || "TOP"; }
  }
  drawMatchups();
}
const MU_ROLES = ["TOP", "JUNGLE", "MID", "BOT", "SUPPORT"];
async function drawMatchups(reload = true) {
  if (STATE.current !== "matchups") return;
  const idx = MU.index || {}, games = (c) => idx[c]?.[MU.role] || 0;
  const all = Object.values(DD.champ).map(c => c.id).sort((a, b) => csName(a).localeCompare(csName(b)));
  if (reload && MU.champ && games(MU.champ)) MU.B = await api(`/api/benchmark/${MU.champ}-${MU.role}`).catch(() => null); else if (reload) MU.B = null;
  const B = MU.B && !MU.B.missing ? MU.B : null;
  const mine = all.filter(c => games(c) && csName(c).toLowerCase().includes(MU.q.toLowerCase()));
  // Opponents: the ones with enough expert games for matchup numbers first, then everyone else in this role.
  const mu = B?.matchups || {}, setupVs = B?.setup?.vs || {};
  const lane = MU.role === "SUPPORT" ? "SUPPORT" : MU.role;
  const opps = all.filter(c => c !== MU.champ && (idx[c]?.[lane] || mu[c]) && csName(c).toLowerCase().includes(MU.oq.toLowerCase()))
    .sort((a, b) => (mu[b]?.n || 0) - (mu[a]?.n || 0) || (idx[b]?.[lane] || 0) - (idx[a]?.[lane] || 0));
  const tile = (c, on, attr, sub) => `<button class="mt${on ? " on" : ""}" ${attr}="${esc(c)}" title="${esc(csName(c))}">${champImg(c)}<span>${esc(csName(c))}</span>${sub ? `<small>${sub}</small>` : ""}</button>`;
  $("view").innerHTML = `<section class="mu wide">
    <h1>Matchup guide</h1>
    <div class="sub">What experts do with a champion, and against a specific opponent when there are enough expert games.</div>
    <div class="roles">${MU_ROLES.map(r => `<button data-role="${r}" class="${r === MU.role ? "on" : ""}">${ROLE_NAME[r]}</button>`).join("")}</div>
    <div class="pick"><div class="ph"><b>You play</b><input id="muQ" placeholder="Search" value="${esc(MU.q)}"></div>
      <div class="grid">${mine.map(c => tile(c, c === MU.champ, "data-mc", "")).join("") || `<div class="sub">No champions with expert data in this role.</div>`}</div></div>
    ${MU.champ && games(MU.champ) ? `<div class="pick"><div class="ph"><b>Against</b><input id="muO" placeholder="Search" value="${esc(MU.oq)}">${MU.opp ? `<button id="muClear">Any opponent</button>` : ""}</div>
      <div class="grid">${opps.map(c => tile(c, c === MU.opp, "data-mo", mu[c] ? `${mu[c].n} games` : "")).join("")}</div></div>` : ""}
    ${MU.champ && B ? `<div class="muhead">${champImg(MU.champ)}<b>${esc(csName(MU.champ))}</b><span>${esc(ROLE_NAME[MU.role])}</span>${MU.opp ? `<i>vs</i>${champImg(MU.opp)}<b>${esc(csName(MU.opp))}</b>` : `<span class="sub">against everyone · ${B.games} expert games</span>`}</div>
      <div id="muBody" class="mugrid"></div>` : MU.champ ? `<div class="empty">No expert data for ${esc(csName(MU.champ))} ${esc(ROLE_NAME[MU.role])} yet.</div>` : `<div class="empty">Pick a champion.</div>`}
  </section>`;
  if (MU.champ && B) {
    MU.st = { champion: MU.champ, championId: +Object.values(DD.champ).find(c => c.id === MU.champ)?.key || 0, role: MU.role, enemies: [], assigned: true, locked: true, spells: [] };
    drawChampSelect(MU, "muHeadUnused", "muBody");
  }
  document.querySelectorAll("[data-role]").forEach(b => b.onclick = () => { MU.role = b.dataset.role; MU.opp = null; drawMatchups(); });
  document.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => { MU.champ = b.dataset.mc; MU.opp = null; drawMatchups(); window.scrollTo(0, 0); });
  document.querySelectorAll("[data-mo]").forEach(b => b.onclick = () => { MU.opp = b.dataset.mo; drawMatchups(false); });
  if ($("muClear")) $("muClear").onclick = () => { MU.opp = null; drawMatchups(false); };
  const search = (id, key) => { const el = $(id); if (!el) return; el.oninput = () => { MU[key] = el.value; clearTimeout(MU.t); MU.t = setTimeout(() => { drawMatchups(false); const e2 = $(id); e2.focus(); e2.setSelectionRange(e2.value.length, e2.value.length); }, 150); }; };
  search("muQ", "q"); search("muO", "oq");
}

function drawChampSelect(C = CS, head = "csHead", bodyId = "csBody") {
  const st = C.st, B = C.B && !C.B.missing ? C.B : null, S = B?.setup, vs = S?.vs?.[C.opp];
  if (!st.champion) {
    $(head).innerHTML = "";
    $(bodyId).innerHTML = `<div class="empty">Hover or pick a champion and the experts' setup shows up here.${st.enemies.length ? `<br><br>Enemy picks so far: ${st.enemies.map(e => esc(csName(e.champion))).join(", ")}` : ""}</div>`;
    return;
  }
  const enemies = st.enemies.map(e => `<button class="ech${e.champion === C.opp ? " on" : ""}" data-opp="${esc(e.champion)}" title="${esc(csName(e.champion))}${e.role ? " (probably " + esc(ROLE_NAME[e.role] || e.role) + ")" : ""}">${champImg(e.champion)}</button>`).join("");
  if (!C.page) $(head).innerHTML = `<div class="me">${champImg(st.champion)}<div><b>${esc(csName(st.champion))}</b><small>${esc(ROLE_NAME[st.role] || "role unknown")}${st.assigned ? "" : " (guessed)"}${st.locked ? "" : " · hovering"}</small></div></div>
    <div class="vs"><small>Lane opponent${C.picked ? "" : " (best guess, tap to change)"}:</small><div class="echs">${enemies || `<span class="sub">Enemy picks will show here.</span>`}</div></div>`;
  const parts = [];
  const live = C.live !== false && !C.page;
  parts.push(gamePlan(B, st.champion, st.role, C.opp));
  parts.push(expertNotes(st.champion, C.opp, () => C === MU ? drawMatchups(false) : drawChampSelect(C, head, bodyId)));
  if (!live && !C.page) parts.unshift(`<div class="note">${C.phase === "InProgress" ? "In game." : "Champ select is over."} Showing your last pick so you can check the build and skill order. This window switches to your next champ select by itself.</div>`);
  // Runes: one tab per setup experts commonly run (by keystone); the matchup page when it uses the same keystone
  const V = S?.variants || [], P = (x) => Math.round(x * 100) + "%";
  if (C.vFor !== st.champion + "/" + st.role) { C.vFor = st.champion + "/" + st.role; C.rv = null; C.bv = null; }
  if (C.rv == null || C.rv >= V.length) C.rv = Math.max(0, V.findIndex(v => v.keystone === vs?.rec?.page?.[2]?.[0]));
  const cur = V[C.rv];
  const useVs = vs?.rec && (!cur || vs.rec.page[2][0] === cur.keystone);
  const rec = useVs ? vs.rec : (cur?.rec || S?.rec);
  const tabs = (list, sel, attr, label) => list.length > 1 ? `<div class="vtabs">${list.map((x, i) => `<button class="${i === sel ? "on" : ""}" data-${attr}="${i}">${label(x)}</button>`).join("")}</div>` : "";
  if (rec) {
    const [prim, sub, perks, shards] = rec.page, ks = cur ? [cur.keystone, cur.rate] : (vs?.keystones || S.keystones || [])[0];
    parts.push(`<div class="card csr"><div class="ctitle">Runes ${useVs ? `vs ${esc(csName(C.opp))}` : ""}</div>
      ${tabs(V, C.rv, "rv", v => `${esc(DD.runes?.[v.keystone]?.name || "Keystone")} <small>${P(v.rate)} · ${P(v.win)} wins</small>`)}
      <div class="rp"><div class="rcol">${styleIcon(prim)}${runeIcon(perks[0], true)}${perks.slice(1, 4).map(id => runeIcon(id)).join("")}</div>
        <div class="rcol">${styleIcon(sub)}${perks.slice(4, 6).map(id => runeIcon(id)).join("")}</div>
        <div class="rcol shards">${shards.map(id => `<span>${esc(SHARDS[id] || id)}</span>`).join("")}</div></div>
      <div class="sub">${ks ? `${esc(DD.runes?.[ks[0]]?.name || "This keystone")} in ${P(ks[1])} of expert games on ${esc(csName(st.champion))}${useVs ? `; this page is from their games against ${esc(csName(C.opp))} (${vs.n})` : ""}. ` : ""}${V.length > 1 ? "Pick a tab for the other setups experts run. " : ""}Other runes are the most common pick in each slot.</div>
      ${live ? `<button class="primary" id="csRunes">Use this rune page</button>` : ""}</div>`);
  }
  // Spells
  const sp = (useVs && vs?.spells?.[0]) || cur?.spells?.[0] || (vs?.spells?.[0]) || S?.spells?.[0];
  if (sp) parts.push(`<div class="card css"><div class="ctitle">Summoner spells</div><div class="sp">${sp[0].map(spellIcon).join("")}<span>${Math.round(sp[1] * 100)}% of expert games${vs?.spells?.[0] ? ` vs ${esc(csName(C.opp))}` : ""}</span></div>
    ${live ? `<button id="csSpells">Set these spells</button>` : ""}</div>`);
  // Lane fights by level
  const ls = levelStrength(B, C.opp);
  if (ls?.rows.length) parts.push(`<div class="card csl"><div class="ctitle">Lane fights by level${ls.vs ? ` vs ${esc(csName(C.opp))}` : ""}</div>${levelBars(ls)}
    <div class="sub">Kills and deaths against the lane opponent before 14:00, by the expert's level at the time${ls.vs ? " (this matchup where there are 10+ fights at a level, otherwise all matchups)" : ", all matchups"}.</div></div>`);
  // Skills
  if (cur?.skills || S?.skills) {
    const k = cur?.skills || S.skills, L = (s) => "QWER"[s - 1];
    parts.push(`<div class="card csk"><div class="ctitle">Skill order: max ${k.order.slice(0, 3).split("").join(" › ")}</div>
      <div class="lv18">${k.typical.map((s, i) => `<span class="s${s}"><i>${i + 1}</i>${L(s)}</span>`).join("")}</div>
      <div class="sub">${Math.round(k.rate * 100)}% of experts max in this order.</div></div>`);
  }
  // Build: one tab per build experts commonly go (by first item)
  const BL = (B?.builds || []).filter(b => b.path);
  if (C.bv == null || C.bv >= BL.length) C.bv = 0;
  const bcur = BL[C.bv];
  const path = bcur?.path || (B?.paths || [])[0];
  const start = bcur?.start ? [bcur.start] : S?.start?.[0], backs = (S?.backs || []).slice(0, 3);
  if (path || start) {
    const icons = (ids) => ids.map(id => `<img src="${itemIcon(id)}" title="${esc(itemName(id))}" alt="">`).join("");
    parts.push(`<div class="card csb"><div class="ctitle">Build</div>
      ${tabs(BL, C.bv, "bv", b => `${esc(itemName(b.item))} <small>${P(b.rate)} · ${P(b.win)} wins</small>`)}
      ${start ? `<div class="row"><small>Start</small><div class="ics">${icons(start[0])}</div></div>` : ""}
      ${backs.map((b, i) => `<div class="row"><small>Back ${i + 1} · ~${clock(b.t)}</small><div class="ics">${b.items.map(([id, r]) => `<span title="${esc(itemName(id))}: ${Math.round(r * 100)}% buy it">${icons([id])}</span>`).join("")}</div></div>`).join("")}
      ${path ? `<div class="row"><small>Core path</small><div class="ics core">${icons(path.items)}</div></div>` : ""}
      ${live ? `<button id="csItems">Add as an item set</button>
      <div class="sub">The item set shows in the in-game shop under "custy.gg"${BL.length > 1 ? ", with every build above in it" : ""}.</div>` : ""}</div>`);
  }
  if (!S) parts.unshift(`<div class="note">${B ? "Expert runes, spells and skill order for this champion are still being collected; check back after the next update." : `No expert data for ${esc(csName(st.champion))} ${esc(ROLE_NAME[st.role] || "")} yet.`}</div>`);
  $(bodyId).innerHTML = parts.join("");

  document.querySelectorAll("[data-opp]").forEach(b => b.onclick = () => { C.picked = b.dataset.opp; C.key = ""; C.rv = null; drawChampSelect(C, head, bodyId); });
  document.querySelectorAll("[data-rv]").forEach(b => b.onclick = () => { C.rv = +b.dataset.rv; drawChampSelect(C, head, bodyId); });
  document.querySelectorAll("[data-bv]").forEach(b => b.onclick = () => { C.bv = +b.dataset.bv; drawChampSelect(C, head, bodyId); });
  const post = (path, body, done) => api(path, { method: "POST", body: JSON.stringify(body) }).then(() => toast(done)).catch(e => toast(e.message));
  if ($("csRunes")) $("csRunes").onclick = () => { const [p, s, perks, shards] = rec.page;
    post("/api/champselect/runes", { name: `custy.gg ${csName(st.champion)}`, primary: p, sub: s, perks, shards }, "Rune page added and selected."); };
  if ($("csSpells")) $("csSpells").onclick = () => post("/api/champselect/spells", { spells: sp[0], current: st.spells }, "Summoner spells set.");
  if ($("csItems")) $("csItems").onclick = () => {
    const blocks = [];
    if (start) blocks.push({ name: "Start", items: start[0] });
    backs.forEach((b, i) => blocks.push({ name: `Back ${i + 1} (~${clock(b.t)})`, items: b.items.map(x => x[0]) }));
    if (BL.length > 1) BL.forEach(b => blocks.push({ name: `${itemName(b.item)} build (${P(b.rate)} of experts)`, items: b.path.items }));
    else if (path) blocks.push({ name: "Core path", items: path.items });
    post("/api/champselect/itemset", { championId: st.championId, title: `custy.gg ${csName(st.champion)}`, blocks }, "Item set added. Find it in the shop under custy.gg.");
  };
}

if (new URLSearchParams(location.search).get("champselect")) startChampSelect();
else loadDD().then(loadCsData).then(loadList).catch(e => { $("list").innerHTML = `<div class="note">Couldn't load: ${esc(e.message)}</div>`; });

// Notice when the app updated (or restarted) under an open page, and offer a reload.
(() => {
  let loaded = null, misses = 0;
  const bar = (msg, reload) => { if ($("updbar")) return; const d = document.createElement("div"); d.id = "updbar";
    d.innerHTML = `${msg}${reload ? ` <button class="primary">Reload</button>` : ""}`; document.body.appendChild(d);
    if (reload) d.querySelector("button").onclick = () => location.reload(); };
  const check = () => api("/api/app-version").then(v => { misses = 0;
      if (!loaded) loaded = v.version; else if (v.version && v.version !== loaded) bar(`custy.gg updated to ${esc(v.version)}.`, true); })
    .catch(() => { if (++misses >= 2) bar("custy.gg restarted, probably for an update. Open the review again from the tray icon.", false); });
  check(); setInterval(check, 3 * 60 * 1000);
})();
</script>
</body>
</html>
