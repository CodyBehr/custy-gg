<script>

const signed = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(Math.round(n)).toLocaleString();
const ROLE_NAME = { TOP: "Top", JUNGLE: "Jungle", MID: "Mid", BOT: "Bot", SUPPORT: "Support" };

// ---------------------------------------------------------------- Data Dragon (names, icons, item costs)
const DD = { v: null, champ: {}, items: {} };
async function loadDD() {
  try {
    DD.v = (await (await fetch("https://ddragon.leagueoflegends.com/api/versions.json")).json())[0];
    const ch = await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${DD.v}/data/en_US/champion.json`)).json();
    for (const c of Object.values(ch.data)) DD.champ[c.key] = { name: c.name, id: c.id, partype: c.partype };

}
const champName = (id) => DD.champ[id]?.name || ("Champion " + id);

const JG_RANKS = ["Bronze", "Silver", "Gold", "Emerald", "Master+"];
const JG = { jcs10: [60, 64, 64, 67, 70], firstTakedown: [305, 283, 259, 235, 226], laneMins: [3.02, 3.05, 3.37, 3.54, 3.65],
  enemyJg: [.7, .7, .78, .85, .88], ganks: { top: [.52, .58, .70, .79, .82], mid: [.53, .62, .78, .82, .94], bot: [1.13, 1.30, 1.44, 1.51, 1.44] } };
function mapArea(p, midBand = 1600) {
  const x = p?.x ?? 7400, y = p?.y ?? 7400;
  if ((x < 3600 && y < 3600) || (x > 11200 && y > 11200)) return "base";
  if (CAMPS.some(([cx, cy]) => Math.hypot(x - cx, y - cy) < 1000)) return "jungle";   // raptors/gromp aren't lanes
  if (x < 2400 || y > 12400) return "top";
  if (y < 2400 || x > 12400) return "bot";
  if (Math.abs(x - y) < midBand) return "mid";
  if (Math.abs(x + y - 14800) < 1300) return "river";

function jungleOf(A) {
  const pid = A.me.participantId, end = Math.min(A.minutes, 14), team = A.me.teamId;
  const at = (k) => A.pf(A.frames[k], pid);

  for (let k = 2; k <= end; k++) {
    // narrow mid band: the path between wolves and raptors runs right beside mid lane
    let a = mapArea(at(k).position, 800);
    if (a === "jungle") a = own(at(k).position) ? "own jungle" : "enemy jungle";
    where[a] = (where[a] || 0) + 1;
  }
  const firstLane = (() => { for (let k = 2; k <= end; k++) { const a = mapArea(at(k).position, 800); if (["top", "mid", "bot"].includes(a)) return [k, a]; } return null; })();
  const ganks = { top: [0, 0], mid: [0, 0], bot: [0, 0] };
  for (const k of A.kills) {
    if (k.timestamp > 840000) continue;
    const a = mapArea(k.position); if (!ganks[a]) continue;
    if (k.killerId === pid || (k.assistingParticipantIds || []).includes(pid)) ganks[a][0]++; else if (k.victimId === pid) ganks[a][1]++;
  }
  const ft = A.kills.find(k => k.killerId === pid || (k.assistingParticipantIds || []).includes(pid));
  const p2 = at(Math.min(2, end)).position || { x: 0, y: 0 };
  return { jcs: Array.from({ length: end + 1 }, (_, k) => at(k).jungleMinionsKilled || 0), where, firstLane, ganks,
    firstTakedown: ft ? ft.timestamp / 1000 : null, start: p2.y - p2.x > 0 ? "top" : "bot", end };

// Seconds until a per-minute cumulative count first reaches target (linear between the minute snapshots).
function csAt(curve, target) {

function ladderAt(v, ladder, lowerBetter) {
  const n = ladder.filter(x => lowerBetter ? v <= x : v >= x).length;

}
function jungleCard(A, B) {
  if (A.minutes < 10) return "";
  const J = jungleOf(A), E = B?.jungle, who = E ? `Experts on ${esc(champName(A.me.championId))}` : "Master+ junglers";

  const rows = [];
  // First clear, exact: the second you hit level 4 (Riot logs level-ups with timestamps). A full clear lands you on 4,

  const myL4 = (A.events.find(e => e.type === "LEVEL_UP" && e.participantId === A.me.participantId && e.level === 4) || {}).timestamp / 1000 || null;
  const exL4 = E?.lv4 || [172, 181, 217];

      : myL4 <= exL4[0] ? `Faster than most experts${gap}`

    const inv = (invLog[pid] || []).filter(x => x.t <= t).pop() || { built: 0, parts: 0, items: [] };
    const m = Math.min(frames.length - 1, Math.floor(t / 60));
    const since = (buys[pid] || []).filter(b => b.t > m * 60 && b.t <= t).reduce((a, b) => a + itemCost(b.id), 0);
    return { pid, lv, items: inv.items || [], built: inv.built, parts: inv.parts, unspent: Math.max(0, (pf(frames[m], pid).currentGold || 0) - since) };
  };
  // Fights: kills within 15s and 4,500 units of each other. Who was in: anyone who killed, assisted or died,
  // plus anyone within 2,000 units at the minute snapshot.
  const fights = [];
  for (const k of kills) {
    const t = k.timestamp / 1000;
    const f = fights.slice().reverse().find(f => t - f.end <= 15 && f.kills.some(o => dist(o.position, k.position) < 4500));
    if (f) { f.end = t; f.kills.push(k); } else fights.push({ start: t, end: t, kills: [k] });
  }
  for (const f of fights) {
    const who = new Set();
    for (const k of f.kills) [k.killerId, k.victimId, ...(k.assistingParticipantIds || [])].forEach(p => p > 0 && who.add(p));
    const mk = Math.min(frames.length - 1, Math.floor(f.start / 60));
    for (const p of parts) if (!who.has(p.participantId) && dist(pf(frames[mk], p.participantId).position, f.kills[0].position) < 2000) who.add(p.participantId);
    const team = (pid) => parts.find(p => p.participantId === pid)?.teamId;
    f.us = [...who].filter(p => team(p) === me.teamId).map(p => stateAt(p, f.start - 2));
    f.them = [...who].filter(p => team(p) !== me.teamId).map(p => stateAt(p, f.start - 2));
    f.ourDeaths = f.kills.filter(k => team(k.victimId) === me.teamId).length;
    f.theirDeaths = f.kills.length - f.ourDeaths;
  }
  const fightOf = (k) => fights.find(f => f.kills.includes(k));
  const pings = data.pings ? data.pings[String(me.participantId)] || null : null;
  const myCs = cs(me.participantId);
  const xp = (pid) => series(pid, x => x.xp || 0), lvl = (pid) => series(pid, x => x.level || 0);
  const myXp = xp(me.participantId), oppXp = opp ? xp(opp.participantId) : null;
  const completed = (buys[me.participantId] || []).filter(b => isCompleted(b.id));
  const STAT = (i, k) => DD.items[i]?.stats?.[k] || 0;
  const defense = (k) => parts.filter(p => p.teamId !== me.teamId).filter(p =>
    [0, 1, 2, 3, 4, 5].reduce((a, n) => a + STAT(p.stats?.["item" + n], k), 0) >= 80).length;
  return {
    g, me, opp, enemyJg, role, frames, events, kills, champOf, pf, races, fights, fightOf, hasItems, pings, roles: data.roles || {},
    casts: data.casts ? data.casts[String(me.participantId)] || null : null,
    minutes: frames.length - 1,
    myGold, oppGold, diff, myCs,
    oppCs: opp ? cs(opp.participantId) : null,
    xp: myXp, level: lvl(me.participantId), xpdiff: oppXp ? myXp.map((v, i) => v - oppXp[i]) : null,
    csdiff: opp ? myCs.map((v, i) => v - cs(opp.participantId)[i]) : null,
    items: completed, armorN: defense("FlatArmorMod"), mrN: defense("FlatSpellBlockMod"),
    backs: backsOf(me.participantId), oppBacks: opp ? backsOf(opp.participantId) : [],
    buys0: (buys[me.participantId] || []).filter(b => b.t <= 120).map(b => b.id),
    firstItem: firstOf(me.participantId, isCompleted),
    lvl6: lvl6(me.participantId), oppLvl6: opp ? lvl6(opp.participantId) : null,
    deaths: kills.filter(e => e.victimId === me.participantId).map(e => ({ t: e.timestamp / 1000, e })),
    platesLost: events.filter(e => e.type === "TURRET_PLATE_DESTROYED" && e.teamId === me.teamId && e.timestamp < 14 * 60000 &&
      laneMatches(e.laneType, role)).map(e => e.timestamp / 1000),
  };
}
// % armor pen an item gives (Black Cleaver: its full 5-stack shred).
function penOf(id) {
  const d = DD.items[id]?.description || "";
  const m = d.match(/(\d+)%<\/attention> Armor Penetration/); if (m) return +m[1] / 100;
  const c = d.match(/Armor by (\d+)%/); return c ? Math.min(0.3, +c[1] * 5 / 100) : 0;
}
// Extra physical damage that much pen gives against a given armor.
const penGain = (armor, pen) => armor > 0 ? (100 + armor) / (100 + armor * (1 - pen)) - 1 : 0;
function enemyArmorList(A, m) {
  const f = A.frames[Math.min(m, A.minutes)]; if (!f) return [];
  return A.g.participants.filter(p => p.teamId !== A.me.teamId).map(p => ({ p, armor: A.pf(f, p.participantId).armor })).filter(x => x.armor > 0);
}
// Average enemy armor at a minute (only there when the game's timeline came from Riot's API).
function enemyArmorAt(A, m) {
  const f = A.frames[Math.min(m, A.minutes)]; if (!f) return null;
  const v = A.g.participants.filter(p => p.teamId !== A.me.teamId).map(p => A.pf(f, p.participantId).armor).filter(x => x > 0);
  return v.length >= 3 ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
}
function laneMatches(lane, role) {
  lane = String(lane || "");
  return (role === "TOP" && lane.startsWith("TOP")) || (role === "MID" && lane.startsWith("MID")) ||
         ((role === "BOT" || role === "SUPPORT") && lane.startsWith("BOT"));
}

// ---------------------------------------------------------------- "Your usual": your other games on this champion (or role)
function pct(values, q) {
  const v = values.filter(x => x != null && Number.isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return null;
  const i = (v.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
  return v[lo] + (v[hi] - v[lo]) * (i - lo);
}
// Expert numbers (public/benchmarks) in the same shape as baseline() below.
function fromExperts(b) {
  const band = arr => (arr || []).map(x => x ? { p25: x[0], p50: x[1], p75: x[2] } : null);
  const med = k => b.timings?.[k]?.[1] ?? null;
  return { expert: true, n: b.games, diff: band(b.minutes.gdiff), gold: band(b.minutes.gold), cs: band(b.minutes.cs),
    firstBack: med("first_back"), firstBackGold: med("first_back_gold"), firstItem: med("legendary1"),
    lvl6Gap: med("lvl6_gap"), deaths14: med("deaths_14"), items: b.items || [], paths: b.paths || [], orders: b.orders || [], levels: b.levels || {}, by_level: b.by_level, matchups: b.matchups || {}, trade: b.trade || null };
}
const WHO = (B) => B?.expert ? "Experts" : "Your usual";

function baseline(list) {
  if (list.length < 3) return null;
  const maxM = Math.max(...list.map(a => a.minutes));
  const band = (pick) => Array.from({ length: maxM + 1 }, (_, m) => {
    const vals = list.map(a => pick(a)?.[m]).filter(v => v != null);
    return vals.length >= 3 ? { p25: pct(vals, .25), p50: pct(vals, .5), p75: pct(vals, .75) } : null;
  });
  const med = (fn) => pct(list.map(fn), .5);
  return {
    n: list.length,
    diff: band(a => a.diff), gold: band(a => a.myGold), cs: band(a => a.myCs),
    firstBack: med(a => a.backs[0]?.t), firstBackGold: med(a => a.backs[0]?.spent),
    firstItem: med(a => a.firstItem),
    lvl6Gap: med(a => a.lvl6 != null && a.oppLvl6 != null ? a.lvl6 - a.oppLvl6 : null),
    deaths14: med(a => a.deaths.filter(d => d.t < 840).length),
  };
}

// ---------------------------------------------------------------- Finding the moments
function findMoments(A, B) {
  const worthy = [];   // deaths that were worth it
  const out = [];
  const curve = A.diff || A.myGold, useDiff = !!A.diff;
  const band = B ? (useDiff ? B.diff : B.gold) : null;
  const last = Math.min(A.minutes, 25);

  // 1. Lane gold: dropped 400+ within 3 minutes and ended below the comparison's middle half.
  if (useDiff) {
    let cur = null;
    for (let m = 2; m <= last; m++) {
      const lo = Math.max(0, m - 3);
      let peak = lo; for (let k = lo; k < m; k++) if (curve[k] > curve[peak]) peak = k;
      const drop = curve[peak] - curve[m];
      const below = band?.[m] ? curve[m] < band[m].p25 : true;
      if (drop >= 400 && below) {
        if (cur && peak <= cur.endM) { cur.endM = m; }
        else { cur = { kind: "gold", peakM: peak, endM: m }; out.push(cur); }
      }
    }
    for (const w of out) {
      // Keep the window going while the gap keeps opening.
      while (w.endM < A.minutes && curve[w.endM + 1] < curve[w.endM]) w.endM++;
      const low = Math.min(...curve.slice(w.peakM, w.endM + 1));
      w.cost = curve[w.peakM] - low;
      w.start = Math.max(0, w.peakM * 60 - 45); w.end = w.endM * 60;
      w.title = `Lane gold went from ${signed(curve[w.peakM])} to ${signed(low)}`;
      const b = band?.[w.endM];
      w.compare = b ? `${WHO(B)} at ${w.endM}:00: <b>${signed(b.p50)}</b> (middle half ${signed(b.p25)} to ${signed(b.p75)}).`
                    : `Lost ${Math.round(w.cost).toLocaleString()} gold to your lane opponent in ${w.endM - w.peakM} min.`;
    }
  }

  // 2. Deaths: any before 14:00; later ones if your lane gold fell 300+, the enemy took
  //    something while you were dead, or you died around an objective they took.
  for (const d of A.deaths) {
    const worth = worthIt(A, d);
    if (worth) {   // listed as a good moment instead
      worthy.push({ kind: "good", always: true, start: Math.max(0, d.t - 40), end: d.t + 10, cost: 400,
        title: `Worth it: you died at ${clock(d.t)}, but ${worth.why}`, compare: "Not every death is a mistake. Watch what you traded it for." });
      continue;
    }
    const m0 = Math.floor(d.t / 60), m2 = Math.min(A.minutes, m0 + 2);
    const swing = useDiff ? curve[m0] - curve[m2] : 0;
    const lost = d.t >= 840 ? lostWhileDead(A, d.t) : null;
    const fight = d.t >= 840 ? objectiveFight(A, d) : null;
    if (d.t >= 840 && swing < 300 && !fight && lost.value < 500) continue;
    const inside = out.find(w => w.kind === "gold" && d.t >= w.start && d.t <= w.end + 30);
    if (inside && !fight && !(lost?.value >= 500)) continue; // already covered by a gold moment (it'll be listed there)
    const killers = [d.e.killerId, ...(d.e.assistingParticipantIds || [])].filter(p => p > 0).map(A.champOf);
    const notes = [];
    if (fight) notes.push(fight.text);
    const fo = A.fightOf(d.e);
    if (fo && A.hasItems && !fight) {
      const S = (l) => [l.length, l.reduce((a, x) => a + x.lv, 0), l.reduce((a, x) => a + x.built + x.parts, 0)];
      const [un, ul, ui] = S(fo.us), [tn, tl_, ti] = S(fo.them);
      if (un < tn) notes.push(`You went in <b>${un}v${tn}</b>.`);
      else if (un === tn && (tl_ - ul >= 2 || ti - ui >= 1500)) notes.push(`Even numbers, but their side was ${tl_ - ul >= 2 ? `<b>${tl_ - ul} levels</b> up` : ""}${tl_ - ul >= 2 && ti - ui >= 1500 ? " and had " : ti - ui >= 1500 ? "had " : ""}${ti - ui >= 1500 ? `<b>${((ti - ui) / 1000).toFixed(1)}k</b> more in items` : ""}.`);
    }
    if (lost?.items.length) notes.push(`While you were down${lost.allies.length ? ` (with ${lost.allies.join(", ")})` : ""} the enemy took <b>${lost.items.join(", ")}</b>.`);
    if (d.t >= 840 && swing >= 300) notes.push(`Your lane gold went from ${signed(curve[m0])} to ${signed(curve[m2])} over the next 2 minutes.`);
    if (d.t < 840) notes.push(B ? `${B.expert ? "Experts die" : "In your usual game you die"} <b>${Math.round(B.deaths14 ?? 0)}</b> time${Math.round(B.deaths14 ?? 0) === 1 ? "" : "s"} before 14:00.` : "Deaths before 14:00 usually decide the lane.");
    const ended = !A.me.stats?.win && A.g.gameDuration - d.t < 120;
    if (ended && d.t >= 840) notes.push(`The game ended ${Math.round(A.g.gameDuration - d.t)}s later.`);
    const turning = fight?.short ? "Fought a player down at " + fight.label : ended && d.t >= 840 ? "The game ended right after" : lost?.big ? "The enemy took " + lost.items.join(", ") : null;
    out.push({
      kind: "death", turning, start: Math.max(0, d.t - (fight ? 60 : 45)), end: d.t + 10,
      cost: Math.max(300, swing) + (lost?.value || 0) + (fight ? fight.value : 0) + (ended ? 3000 : 0),
      title: fight ? `You died at ${clock(d.t)} in a ${fight.label} fight${fight.short ? `, ${fight.us}v${fight.them}` : ""}`
        : `You died at ${clock(d.t)}${killers.length ? " to " + killers.join(" + ") : ""}`,
      compare: notes.join(" "),
    });
  }

  // 3. CS at 10 and 14 minutes.
  if (A.role !== "SUPPORT") {
    const target = (m) => B?.cs?.[m]?.p50 ?? ({ JUNGLE: 5.5, TOP: 7, MID: 7, BOT: 7.5 }[A.role] || 7) * m;
    for (const m of [10, 14]) {
      if (A.minutes < m) continue;
      const gap = target(m) - A.myCs[m];
      if (gap < 10) continue;
      if (out.some(w => w.kind === "cs")) { const w = out.find(w => w.kind === "cs"); w.cost = Math.max(w.cost, gap * 20); w.end = m * 60; w.title = `${A.myCs[m]} CS at ${m}:00, ${Math.round(gap)} under`; continue; }
      out.push({ kind: "cs", start: (m - 4) * 60, end: m * 60, cost: gap * 20,
        title: `${A.myCs[m]} CS at ${m}:00, ${Math.round(gap)} under`,
        compare: B?.cs?.[m] ? `${WHO(B)}: <b>${Math.round(B.cs[m].p50)}</b> at ${m}:00.` : `Rough target for ${ROLE_NAME[A.role] || "your role"}: <b>${Math.round(target(m))}</b>.` });
    }
  }

  // 4. First back.
  const fb = A.backs[0];
  if (B?.firstBack && fb && fb.t - B.firstBack >= 60) {
    out.push({ kind: "back", start: Math.max(0, B.firstBack - 45), end: fb.t + 5, cost: (fb.t - B.firstBack) * 4,
      title: `First back at ${clock(fb.t)} with ${fb.spent.toLocaleString()} gold spent`,
      compare: `${WHO(B)}: back by <b>${clock(B.firstBack)}</b>, spending ~${Math.round(B.firstBackGold || 0).toLocaleString()}.` });
  }

  // 5. First completed item.
  for (const [k, label] of [["firstItem", "First item"]]) {
    if (B?.[k] && A[k] && A[k] - B[k] >= 90) {
      out.push({ kind: k, start: Math.max(0, B[k] - 45), end: A[k] + 5, cost: (A[k] - B[k]) * 3,
        title: `${label} finished at ${clock(A[k])}`, compare: `${WHO(B)}: <b>${clock(B[k])}</b>.` });
    }
  }

  // 6. Second to level 2 (or 3) in a lane where experts usually get there first: that's the first waves.
  for (const n of [2, 3]) {
    const r = A.races[n], ex = A.opp && expertRace(B, n, DD.champ[A.opp.championId]?.id);
    if (!r || r.gap <= EVEN || !ex || ex.first < 0.55) continue;
    const oppName = champName(A.opp.championId), mine = champName(A.me.championId), r3 = A.races[3];
    out.push({ kind: "level", start: Math.max(0, r.opp - 50), end: (n === 2 && r3?.gap > EVEN ? r3.me : r.me) + 10, cost: 380,
      title: `${oppName} hit level ${n} first${n === 2 && r3?.gap > EVEN ? ", and level 3" : ""}`,
      compare: `You got there ${Math.round(r.gap)}s later. Experts on ${mine} reach level ${n} first in <b>${Math.round(ex.first * 100)}%</b> of ${ex.vs ? `their games against ${oppName}` : "games"} (${ex.n} games). ` +
        `Who gets there first comes down to how the first three waves are played, so it's worth watching how a high-elo ${mine} plays them: <a target="_blank" href="${ytExperts(A)}">high-elo ${esc(mine)} games on YouTube</a>.` });
    break;
  }

  // 7. Plates lost before 14:00.
  if (A.platesLost.length >= 2) {
    out.push({ kind: "plates", start: Math.max(0, A.platesLost[0] - 45), end: A.platesLost[A.platesLost.length - 1] + 5,
      cost: A.platesLost.length * 160, title: `${A.platesLost.length} plates lost before 14:00`, compare: "" });
  }

  // 8. Armor pen: experts on this champion build it, the enemy had the armor for it, and your first 3 items had none.
  const penItem = (B?.items || []).filter(e => penOf(e.id) > 0 && e.rate >= 0.2).sort((a, b) => b.rate - a.rate)[0];
  if (penItem && A.items.length >= 2) {
    const pen = penOf(penItem.id), firstPen = A.items.findIndex(b => penOf(b.id) > 0);
    const check = (slot) => {          // armor when that item finished
      const b = A.items[slot - 1]; if (!b) return null;
      const list = enemyArmorList(A, Math.floor(b.t / 60)); if (list.length < 3) return null;
      const avg = list.reduce((a, x) => a + x.armor, 0) / list.length;
      const tanks = list.slice().sort((x, y) => y.armor - x.armor).slice(0, 2);
      return { b, avg, tanks, front: (tanks[0].armor + tanks[1].armor) / 2 };
    };
    const c2 = check(2), c3 = check(3);
    const late = firstPen < 0 || firstPen >= 3;
    // Tanky team: frontline at 120+ armor by your 2nd item. Otherwise: team average 60+ by your 3rd.
    const hit = late && c2 && c2.front >= 120 && (firstPen < 0 || firstPen >= 2) ? { c: c2, slot: 2, vs: c2.front, who: c2.tanks.map(x => `${champName(x.p.championId)} ${Math.round(x.armor)}`).join(", ") }
              : late && c3 && c3.avg >= 60 ? { c: c3, slot: 3, vs: c3.avg, who: null } : null;
    if (hit) {
      const g = penGain(hit.vs, pen), at = hit.c.b.t;
      out.push({ kind: "pen", start: Math.max(0, at - 30), end: at + 5, cost: Math.round(g * 4000), swing: false,
        title: `No armor pen by your ${ord(hit.slot)} item (${itemName(hit.c.b.id)}, ${clock(at)})`,
        compare: `${hit.who ? `Their frontline had <b>${hit.who}</b> armor` : `The enemy team averaged <b>${Math.round(hit.vs)}</b> armor`} then, so ${itemName(penItem.id)} would have added about <b>${Math.round(g * 100)}%</b> physical damage against ${hit.who ? "them" : "them on its own"}. ` +
          `${firstPen < 0 ? "You didn't build armor pen" : `Yours came ${ord(firstPen + 1)}, at ${clock(A.items[firstPen].t)}`}. Experts on ${champName(A.me.championId)} build it ${ord(Math.round(penItem.slot))} in ${Math.round(penItem.rate * 100)}% of games.` });
    }
  }

  // Overlapping findings become one moment to watch.
  const mergeAll = (list) => {
    const merged = [];
    for (const w of list.sort((a, b) => a.start - b.start)) {
      const cur = merged[merged.length - 1];
      if (cur && w.start <= cur.end) { cur.end = Math.max(cur.end, w.end); cur.cost += w.cost; cur.parts.push(w); }
      else merged.push({ start: w.start, end: w.end, cost: w.cost, parts: [w] });
    }
    for (const m of merged) m.parts.sort((a, b) => a.start - b.start);
    return merged;
  };
  // Keep the ones that cost the most.
  const bad = mergeAll(out.filter(w => w.cost > 0)).sort((a, b) => b.cost - a.cost).slice(0, 6);
  // Things that went well are moments too (up to 3), unless a moment above already covers that stretch.
  // Solo kills on your lane opponent are always listed.
  const goods = mergeAll([...goodMoments(A, B), ...worthy]), keep = (g) => g.parts.some(p => p.always);
  const good = [...goods.filter(keep), ...goods.filter(g => !keep(g) && !bad.some(b => g.start <= b.end && b.start <= g.end))
    .sort((a, b) => b.cost - a.cost).slice(0, 3)];
  for (const g of good) g.good = true;
  // Listed in the order they happened.
  const all = [...bad, ...good].sort((a, b) => a.start - b.start);
  for (const m of all) m.context = context(A, m);
  return all;
}

// What our team took in the 40s after a time (the mirror of lostWhileDead).
function tookAfter(A, t) {
  const items = [], ours = (pid) => A.g.participants.find(p => p.participantId === pid)?.teamId === A.me.teamId;
  for (const e of A.events) {
    const s = e.timestamp / 1000; if (s < t || s > t + 40) continue;
    if (e.type === "BUILDING_KILL" && e.teamId !== A.me.teamId) {
      const lane = String(e.laneType || "").replace("_LANE", "").toLowerCase();
      items.push(e.buildingType === "INHIBITOR_BUILDING" ? `${lane} inhibitor` : e.towerType === "NEXUS_TURRET" ? "a nexus turret" : `${lane} ${String(e.towerType || "").replace("_TURRET", "").toLowerCase()} tower`);
    }
    if (e.type === "ELITE_MONSTER_KILL" && e.killerId > 0 && ours(e.killerId) && e.monsterType !== "HORDE")
      items.push(OBJ_NAME[e.monsterSubType === "ELDER_DRAGON" ? "ELDER_DRAGON" : e.monsterType] || "an objective");
  }
  return [...new Set(items)];
}

// Stretches that went well: fights your team won with you in them, solo kills, and your lane lead jumping.
function goodMoments(A, B) {
  const out = [], me = A.me.participantId;
  const ours = (pid) => A.g.participants.find(p => p.participantId === pid)?.teamId === A.me.teamId;
  // Kills within 15s of each other are one fight.
  const fights = [];
  for (const k of A.kills) {
    const t = k.timestamp / 1000;
    const f2 = fights.slice().reverse().find(f => t - f.end <= 15 && f.kills.some(o => dist(o.position, k.position) < 4500));
    if (f2) { f2.end = t; f2.kills.push(k); } else fights.push({ start: t, end: t, kills: [k] });
  }
  for (const f of fights) {
    const got = f.kills.filter(k => !ours(k.victimId)), lostK = f.kills.filter(k => ours(k.victimId));
    const mine = got.filter(k => k.killerId === me), part = got.filter(k => k.killerId === me || (k.assistingParticipantIds || []).includes(me));
    if (lostK.some(k => k.victimId === me) || !part.length) continue;
    const bigPart = part.length >= Math.max(2, got.length / 2);   // properly in the fight, not one stray assist
    const took = tookAfter(A, f.end), tookText = took.length ? ` Your team took <b>${took.join(", ")}</b> right after.` : "";
    if (got.length >= 3 && got.length - lostK.length >= 2 && bigPart) {
      out.push({ kind: "good", start: Math.max(0, f.start - 30), end: f.end + 10, cost: 600 + got.length * 150 + took.length * 300,
        title: `Your team won a fight ${got.length} for ${lostK.length} at ${clock(f.start)}`,

// Two or three things that went well this game: against the comparison first, then against your own other games.
function wentWell(A, B, hist) {

  if (A.role !== "SUPPORT" && A.minutes >= 10 && B?.cs?.[10] && A.myCs[10] >= B.cs[10].p50)
    add(2.5 + (A.myCs[10] >= B.cs[10].p75 ? 1 : 0), `${A.myCs[10]} CS at 10:00`, `${A.myCs[10] >= B.cs[10].p75 ? "Above" : "Level with"} ${who} (median ${Math.round(B.cs[10].p50)}).`);

      else if (A.myCs[10] > med(cs)) add(1.2, `CS at 10:00 above your usual`, `${A.myCs[10]} against your usual ${Math.round(med(cs))} on ${champ}.`);
    }

      if (A.deaths.length < Math.min(...deaths)) add(2, `Your fewest deaths in ${last}`, `${A.deaths.length}, down from a previous best of ${Math.min(...deaths)}.`);

}


// What the enemy team took in the 40s after you died, and which allies died within 15s of you.

// Died around Baron/Dragon/Herald/Atakhan that the enemy took: who was there, who was far away without Teleport.

function context(A, w) {

    else if (A.opp && k.victimId === A.opp.participantId) add(t, `${clock(t)} ${A.champOf(k.victimId)} died to ${killer}`);
    else if (A.opp && k.killerId === A.opp.participantId) add(t, `${clock(t)} ${A.champOf(k.killerId)} killed ${A.champOf(k.victimId)}`);

// ---------------------------------------------------------------- Chart
function chart(A, B, moments) {
  const W = 1000, H = 260, L = 50, R = 12, T = 14, Bm = 26;
  const curve = A.diff || A.myGold, band = B ? (A.diff ? B.diff : B.gold) : null;
  const n = A.minutes;
  let lo = Math.min(0, ...curve), hi = Math.max(0, ...curve);
  if (band) for (const b of band.slice(0, n + 1)) if (b) { lo = Math.min(lo, b.p25); hi = Math.max(hi, b.p75); }
  const pad = (hi - lo) * .08 || 500; lo -= pad; hi += pad;
  const x = (m) => L + (m / n) * (W - L - R), y = (v) => T + (hi - v) / (hi - lo) * (H - T - Bm);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Lane gold difference by minute">`;
  for (const w of moments) s += `<rect x="${x(w.start / 60)}" y="${T}" width="${Math.max(3, x(w.end / 60) - x(w.start / 60))}" height="${H - T - Bm}" fill="var(--${w.good ? "green" : w.parts.some(p => p.turning) ? "red" : "gold"}-wash)"/>`;
  const step = (hi - lo) > 6000 ? 2000 : (hi - lo) > 2500 ? 1000 : 500;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step)
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "var(--line)" : "var(--line-soft)"}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${signed(v)}</text>`;
  for (let m = 0; m <= n; m += 5) s += `<text x="${x(m)}" y="${H - 8}" text-anchor="middle">${m}:00</text>`;
  if (band) {
    const pts = band.slice(0, n + 1).map((b, m) => b && [m, b]).filter(Boolean);
    if (pts.length > 1) {
      s += `<path d="M${pts.map(([m, b]) => x(m) + "," + y(b.p75)).join("L")}L${pts.slice().reverse().map(([m, b]) => x(m) + "," + y(b.p25)).join("L")}Z" fill="var(--blue-wash)" stroke="none"/>`;
      s += `<path d="M${pts.map(([m, b]) => x(m) + "," + y(b.p50)).join("L")}" fill="none" stroke="var(--blue)" stroke-opacity=".45" stroke-dasharray="4 4"/>`;
    }
  }
  s += `<path d="M${curve.map((v, m) => x(m) + "," + y(v)).join("L")}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`;
  curve.forEach((v, m) => s += `<circle cx="${x(m)}" cy="${y(v)}" r="6" fill="transparent"><title>${m}:00  ${signed(v)}</title></circle>`);
  for (const d of A.deaths) { const m = d.t / 60, i = Math.min(n, Math.round(m));
    s += `<text x="${x(m)}" y="${y(curve[i]) - 9}" text-anchor="middle" style="fill:var(--red-ink);font-size:13px">✕</text>`; }
  return s + "</svg>";
}

    const n = (r.wins || 0) + (r.losses || 0); if (!r.tier && !n) return "";
    const tracked = STATE.games.filter(g => g.queue === queue && g.lp && g.lp.delta != null && (!g.lp.over || g.lp.last));
    const net = tracked.reduce((a, g) => a + g.lp.delta, 0), count = tracked.reduce((a, g) => a + (g.lp.over || 1), 0);
    return `<div class="card rankcard">${rankEmblem(r)}<div><div class="eyebrow">${esc(queue)}</div>
      <div class="big" style="font-size:32px;color:${TIER_COLOR[r.tier] || "var(--ink)"}">${esc(rankName(r))}</div>
      <h3>${r.tier ? `${r.lp} LP` : "Not placed yet"}${n ? ` · ${r.wins}W ${r.losses}L · ${Math.round(100 * r.wins / n)}% this season` : ""}</h3>
      <div class="sub">${count ? `<b class="${net >= 0 ? "good" : "bad"}">${signed(net)} LP</b> over the last ${count} tracked game${count === 1 ? "" : "s"}` : "LP per game shows from your next ranked game on"}</div></div></div>`;
  }).join("");
  return cards ? `<div class="rankrow">${cards}</div>` : "";
}

// League can only play replays from the patch it's on. If the client can't say, go by your newest game.
const patchOf = (v) => String(v || "").split(".").slice(0, 2).join(".");
const currentPatch = () => STATE.patch || patchOf(STATE.games[0]?.version);
const replayExpired = (id) => { const g = STATE.games.find(g => g.id == id), now = currentPatch(); return !!(g?.version && now && patchOf(g.version) !== now); };
// A failed read isn't remembered, so opening the game again retries it.
const asQ = () => STATE.as ? "?as=" + encodeURIComponent(STATE.as) : "";
const getGame = (id) => cacheGame[(STATE.as || "") + ":" + id] ??= api("/api/game/" + id + asQ()).catch(e => { delete cacheGame[(STATE.as || "") + ":" + id]; throw e; });

async function loadList() {
  const btn = $("refresh"); btn.disabled = true; btn.textContent = "Refreshing...";
  let r;
  try { r = await api("/api/games" + asQ()); } finally { btn.disabled = false; btn.textContent = "↻ Refresh"; }
  const before = new Set(r.viewing ? [] : STATE.games.map(g => g.id));
  const fresh = STATE.games.length ? r.games.filter(g => !before.has(g.id)) : [];
  STATE = { ...STATE, games: r.games, me: r.me, replayApi: r.replayApi, patch: r.patch || STATE.patch, rank: r.rank || null };
  document.body.classList.toggle("viewing", !!STATE.as);
  if (r.viewing) { STATE.current = STATE.current && r.games.some(g => g.id == STATE.current) ? STATE.current : null; }
  try { STATE.queue = localStorage.getItem("custy-review-queue") || "all"; } catch (e) {}
  $("who").textContent = r.me?.gameName ? `${r.me.gameName}#${r.me.tagLine}` : "";
  const note = (STATE.as ? `<div class="note viewing">Viewing <b>${esc(r.me?.gameName || "another player")}#${esc(r.me?.tagLine || "")}</b>: their last ${r.games.length} ranked and normal games, compared with the same experts as yours. Replays aren't available for other players. <button id="backMine">Back to my games</button></div>` : "")
    + (r.note ? `<div class="note">${esc(r.note)}</div>` : "");
  if (!r.games.length && STATE.as) { $("list").innerHTML = note + `<div class="note">No recent ranked or normal Summoner's Rift games for this player.</div>`; bindBack(); return; }
  if (!r.games.length) {
    $("list").innerHTML = note + `<div class="note">No ranked or normal Summoner's Rift games found yet. Play one with the app running, then reopen this.</div>`;
    return;
  }
  STATE.note = note;
  renderList(true); bindBack();
  if (!fresh.length && STATE.games.length && lastRefreshClicked) toast("No new games yet. League can take a minute or two after a game to add it to your history.");
  lastRefreshClicked = false;
}
function bindBack() { const b = $("backMine"); if (b) b.onclick = () => { STATE.as = null; STATE.current = null; $("lookupId").value = ""; loadList().catch(e => toast(e.message)); }; }
async function lookupPlayer(id) {
  if (!/^.+#.+$/.test(id)) return toast("Type a Riot ID like Name#TAG");
  const b = $("lookup").querySelector("button"); b.disabled = true; b.textContent = "Loading…";
  toast(`Loading ${id.split("#")[0]}'s recent games from Riot. This takes about 20 seconds the first time.`);
  try {
    const r = await api("/api/lookup?riotId=" + encodeURIComponent(id));

}
$("lookup").onsubmit = (ev) => { ev.preventDefault(); lookupPlayer($("lookupId").value.trim()); };
let lastRefreshClicked = false, lastLoad = Date.now();
$("refresh").onclick = () => { lastRefreshClicked = true; lastLoad = Date.now(); loadList().catch(e => toast(e.message)); };
// Also look for new games when you come back to this window, and every 2 minutes while it's open.
const autoRefresh = () => { if (!STATE.as && Date.now() - lastLoad > 30000) { lastLoad = Date.now(); loadList().catch(() => {}); } };
window.addEventListener("focus", autoRefresh);
setInterval(() => { if (!document.hidden) autoRefresh(); }, 120000);

function renderList() {
  $("list").innerHTML = STATE.note || "";
  drawRank();

async function openGame(id) {
  $("view").classList.remove("wide");
  STATE.current = id; STATE.lastGame = id; navState(); window.scrollTo({ top: 0 });
  $("view").innerHTML = `<div class="empty">Reading the game...</div>`;
  const s = STATE.games.find(g => g.id == id);
  let A;
  try { A = analyse(await getGame(id)); } catch (e) { $("view").innerHTML = `<div class="empty">Couldn't read this game: ${esc(e.message)}</div>`; return; }
  if (!A) { $("view").innerHTML = `<div class="empty">League didn't give a timeline for this game, so there's nothing to review.</div>`; return; }

  // Compared with high-elo games on this champion and role. Only when there aren't any yet,
  // fall back to your own other games on this champion (or role).
  const champ = DD.champ[A.me.championId]?.id;
  const ex = champ && A.role ? await getBench(champ + "-" + A.role) : { missing: true };
  let B, label;
  if (!ex.missing) {
    B = fromExperts(ex);
    label = `${ex.games} high-elo ${champName(A.me.championId)} ${ROLE_NAME[A.role] || ""} games`;
  } else {
    const others = STATE.games.filter(g => g.id != id && g.hasTimeline && g.role === s.role);
    const sameChamp = others.filter(g => g.champion === s.champion).slice(0, 20);
    const pool = sameChamp.length >= 3 ? sameChamp : others.slice(0, 20);
    label = sameChamp.length >= 3 ? `your last ${pool.length} ${champName(s.champion)} games` : `your last ${pool.length} ${ROLE_NAME[s.role] || ""} games (any champion)`;
    B = baseline((await Promise.all(pool.map(g => getGame(g.id).then(analyse).catch(() => null)))).filter(Boolean));
  }
  if (STATE.current !== id) return;
  const moments = findMoments(A, B);
  // Your other recent games on this champion, for "best in your last N games".
  const mates = STATE.games.filter(g => g.id != id && g.hasTimeline && g.champion === s.champion && g.role === s.role).slice(0, 9);
  const hist = (await Promise.all(mates.map(g => getGame(g.id).then(analyse).catch(() => null)))).filter(Boolean);
  if (STATE.current !== id) return;
  render(A, B, moments, s, B ? label : null, wentWell(A, B, hist));
}

// Your fights with your lane opponent before 14:00, by your level, next to how experts on this champion do at those levels.
// ---- Trading in lane (minutes 1-14): damage each side dealt to champions per minute, damage you took, and
// health / resource at each minute mark. Ranked and normal games only (the site fills this in from Riot).
// Ability casts are whole-game totals (Riot has no per-minute casts), so they only back up the lane numbers.
function tradeCard(A, B) {
  if (!A.opp || A.role === "JUNGLE") return "";
  const me = A.me.participantId, op = A.opp.participantId, N = Math.min(14, A.minutes);
  const st = (k, p) => A.pf(A.frames[k], p)?.st;
  if (!st(1, me) || !st(1, op) || N < 4) return "";
  const per = (p, i) => Array.from({ length: N }, (_, k) => { const a = st(k, p), b = st(k + 1, p); return a && b ? Math.max(0, b[i] - a[i]) : null; });
  const ratio = (p, i, j) => Array.from({ length: N }, (_, k) => { const b = st(k + 1, p); return b && b[j] ? b[i] / b[j] : null; });
  const dealt = per(me, 4), odealt = per(op, 4), taken = per(me, 5), hp = ratio(me, 0, 1), ohp = ratio(op, 0, 1), mp = ratio(me, 2, 3);
  const T = B?.expert ? B.trade : null, sum = (a, i0, i1) => a.slice(i0, i1).reduce((x, v) => x + (v || 0), 0);
  const part = DD.champ[A.me.championId]?.partype, res = part === "Mana" ? "mana" : part === "Energy" ? "energy" : null;
  const opName = esc(champName(A.opp.championId)), P = (x) => Math.round(x * 100) + "%";
  const finds = [];
  // 1) minutes where you clearly lost the trade
  const lost = [];
  for (let k = 1; k < N; k++) if (odealt[k] != null && dealt[k] != null && odealt[k] - dealt[k] >= 200 && hp[k] != null && ohp[k] != null && hp[k] < ohp[k] - .15) lost.push(k);
  if (lost.length) finds.push(`<b>Lost trades:</b> ${lost.slice(0, 3).map(k => `${k}:00–${k + 1}:00 (${opName} dealt ${Math.round(odealt[k])}, you ${Math.round(dealt[k])}; you ended at ${P(hp[k])} HP vs ${P(ohp[k])})`).join("; ")}.`);
  // 2) vs experts in the early lane (minutes 2-6)
  const cpm = A.casts ? A.casts.slice(0, 4).reduce((a, x) => a + x, 0) / (A.g.gameDuration / 60) : null;
  const castNote = cpm == null || !T?.cpm_total_q ? "" : cpm > T.cpm_total_q[2] ? "high" : cpm < T.cpm_total_q[0] ? "low" : "";
  if (T?.dealt && T?.taken) {
    const i0 = 2, i1 = Math.min(7, N), myT = sum(taken, i0, i1), exT = sum(T.taken, i0, i1), myD = sum(dealt, i0, i1), exD = sum(T.dealt, i0, i1);
    if (exT && myT > exT * 1.35 && myD <= exD) {
      let line = `<b>Minutes ${i0}–${i1}:</b> you took ${P(myT / exT - 1)} more damage than experts on ${esc(champName(A.me.championId))} but dealt ${myD < exD * .8 ? "less" : "about the same"}.`;
      if (castNote === "high") line += ` You also cast more abilities than most experts (${cpm.toFixed(1)} a minute over the game, experts ${T.cpm_total_q[1]}): spells are going out without winning the trade back. Save one for when ${opName} walks up to last-hit.`;
      else if (castNote === "low") line += ` And you cast fewer abilities than most experts (${cpm.toFixed(1)} a minute, experts ${T.cpm_total_q[1]}): you're taking free damage. Use abilities to last-hit from safety and trade back when ${opName} uses theirs.`;
      else line += ` Look at what you're getting hit by: stand behind your minions and trade back when ${opName}'s cooldowns are down.`;
      finds.push(line);
    } else if (exD && myD < exD * .55 && myT <= exT * 1.1) {
      finds.push(`<b>Minutes ${i0}–${i1}:</b> you dealt about half the damage experts do here${castNote === "low" ? `, and cast fewer abilities than most of them` : ""}. Lane was quiet; look for trades at your strong levels instead of only farming.`);
    } else if (exD && myD >= exD && myT <= exT) {
      finds.push(`<span class="good"><b>Minutes ${i0}–${i1}:</b> you dealt as much as experts and took less. Good trading.</span>`);
    }
  }
  // 3) resource management
  if (res && T?.low_mp != null) {
    const marks = mp.slice(1).filter(x => x != null), low = marks.filter(x => x < .2).length;
    if (marks.length >= 5 && low / marks.length >= Math.max(.3, T.low_mp * 2))
      finds.push(`<b>${res === "mana" ? "Mana" : "Energy"}:</b> under 20% at ${low} of ${marks.length} minute marks (experts: ${P(T.low_mp)} of the time). Running dry means you can't trade back or clear a wave; save ${res} for trades and last hits you can't get otherwise.`);
  }
  // chart: bars = damage to champions each minute (you, them), lines = health at the minute mark
  const W = 560, H = 150, pad = 26, cw = (W - pad * 2) / N, top = Math.max(1, ...dealt, ...odealt, ...(T?.dealt || []).slice(0, N).map(x => x || 0));
  const y = (v) => H - 22 - (v / top) * (H - 40), yh = (r) => H - 22 - r * (H - 40);
  const bars = Array.from({ length: N }, (_, k) => {
    const x = pad + k * cw; const b = (v, dx, c) => v ? `<rect x="${x + dx}" y="${y(v)}" width="${cw * .32}" height="${H - 22 - y(v)}" fill="${c}" rx="1.5"><title>${k}:00–${k + 1}:00: ${Math.round(v)}</title></rect>` : "";
    const ex = T?.dealt?.[k] ? `<line x1="${x + cw * .1}" x2="${x + cw * .44}" y1="${y(T.dealt[k])}" y2="${y(T.dealt[k])}" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="2 2"><title>experts ${Math.round(T.dealt[k])}</title></line>` : "";
    return b(dealt[k], cw * .1, "var(--gold)") + b(odealt[k], cw * .46, "var(--red)") + ex + `<text x="${x + cw / 2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#7d8aa0">${k + 1}</text>`;
  }).join("");
  const line = (arr, c, dash) => `<polyline fill="none" stroke="${c}" stroke-width="1.6"${dash ? ` stroke-dasharray="4 3"` : ""} points="${arr.map((r, k) => r == null ? "" : `${pad + k * cw + cw / 2},${yh(r)}`).filter(Boolean).join(" ")}"/>`;
  return `<div class="card trade"><div class="ctitle">Trading in lane vs ${opName}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%">${bars}${line(hp, "var(--gold)")}${line(ohp, "var(--red)", true)}</svg>
    <div class="legend"><span><i style="background:var(--gold)"></i>your damage to champions</span><span><i style="background:var(--red)"></i>${opName}'s</span>${T?.dealt ? `<span><i style="background:#cbd5e1"></i>experts (dashed)</span>` : ""}<span>lines: health at each minute mark (yours solid)</span></div>
    ${finds.length ? `<ul class="finds">${finds.map(f => `<li>${f}</li>`).join("")}</ul>` : `<div class="sub">No trading problems stood out.</div>`}
    <div class="sub">Damage is counted per minute; health and ${res || "resource"} are one snapshot each minute, so a trade followed by a back can look like nothing happened.${T?.dealt ? "" : " Expert comparison arrives with the next expert data update."} Ability casts are for the whole game (Riot doesn't record when each cast happened).</div></div>`;
}

function laneFightCard(A, B) {
  if (!A.opp || A.role === "JUNGLE") return "";
  const ls = levelStrength(B, DD.champ[A.opp.championId]?.id); if (!ls?.rows.length) return "";
  const me = A.me.participantId, op = A.opp.participantId;
  const ups = A.events.filter(e => e.type === "LEVEL_UP" && e.participantId === me).map(e => [e.timestamp, e.level]);
  const lvAt = (t) => ups.filter(([tt]) => tt <= t).reduce((a, [, L]) => Math.max(a, L), 1);
  const mine = A.kills.filter(k => k.timestamp < 840000).map(k => {
    const h = k.assistingParticipantIds || [];
    if (k.victimId === op && (k.killerId === me || h.includes(me))) return { lv: lvAt(k.timestamp), won: true, t: k.timestamp / 1000 };
    if (k.victimId === me && (k.killerId === op || h.includes(op))) return { lv: lvAt(k.timestamp), won: false, t: k.timestamp / 1000 };
    return null;
  }).filter(Boolean);
  if (!mine.length) return "";
  const mark = {};
  for (const f of mine) mark[f.lv] = (mark[f.lv] ? mark[f.lv] + ", " : "you: ") + (f.won ? "won" : "lost") + " " + clock(f.t);
  const bad = mine.filter(f => !f.won && ls.rows.find(r => r.lv === f.lv)?.tag === "weak");
  const good = mine.filter(f => f.won && ls.rows.find(r => r.lv === f.lv)?.tag === "strong");
  return `<div class="card" style="grid-column:1 / -1"><div class="k">Lane fights with ${esc(champName(A.opp.championId))} by level</div>
    ${levelBars(ls, mark)}
    <div class="d">${bad.length ? `You lost a fight at level ${[...new Set(bad.map(f => f.lv))].join(", ")}, where experts on ${esc(champName(A.me.championId))} usually lose too: a level to avoid fighting at. ` : ""}${good.length ? `You won at level ${[...new Set(good.map(f => f.lv))].join(", ")}, one of their strong levels. ` : ""}Bars: green kills, red deaths for experts${ls.vs ? " in this matchup" : ""}.</div></div>`;
}
// Who reached levels 2, 3 and 6 first, and whether that's normal: how often experts on this champion get there first.
function levelCard(A, B) {
  const oppName = A.opp ? champName(A.opp.championId) : "opponent";
  let any = false;
  const rows = [2, 3, 6].map(n => {
    const r = A.races[n]; if (!r) return "";
    const w = raceWord(r.gap), ex = A.opp && expertRace(B, n, DD.champ[A.opp.championId]?.id);
    let note = "", cls = w === "first" ? "good" : "";
    if (ex) {
      any = true;
      const f = Math.round(ex.first * 100), second = Math.round((1 - ex.first - ex.even) * 100);
      const verdict = w === "second" ? (ex.first >= 0.55 ? "experts are usually first here, so this is worth a look" : ex.first <= 0.4 ? "being second is normal here" : "it goes either way for experts")
        : w === "first" ? (ex.first >= 0.55 ? "as experts usually are" : ex.first <= 0.4 ? "experts usually aren't, so that's a strong start" : "it goes either way for experts")
        : "level with your opponent";
      if (w === "second") cls = ex.first >= 0.55 ? "warn" : "";
      note = `Experts: first ${f}% · second ${second}% · same time ${Math.round(ex.even * 100)}% <span>(${ex.vs ? `vs ${esc(oppName)}, ` : "all matchups, "}${ex.n} games)</span>: <em>${verdict}</em>`;
    } else if (w === "second") cls = "";
    return `<div class="lv"><span>Level ${n}</span><b class="${cls}">${w}${w === "same time" ? "" : ` · ${Math.round(Math.abs(r.gap))}s`}</b><small>${note || `you ${clock(r.me)} · ${esc(oppName)} ${clock(r.opp)}`}</small></div>`;
  }).join("");
  if (!rows) return "";
  const missing = !any ? `<div class="d" style="margin-top:4px">${B?.expert ? "How often experts get there first isn't in yet for this champion; it's being collected and will show here." : "No expert data for this champion and role yet."}</div>` : "";
  return `<div class="card" style="grid-column:1 / -1"><div class="k">Levels vs ${esc(oppName)}: who got there first, and is that normal?</div>${rows}${missing}</div>`;
}
function timingCard(k, mine, usual, fmt, lowerIsBetter = true) {
  const has = mine != null;
  let cls = "", d = "";
  if (has && usual != null) {
    const delta = mine - usual;
    cls = Math.abs(delta) < 1e-9 ? "" : (lowerIsBetter ? delta > 0 : delta < 0) ? "warn" : "good";
    d = `${STATE.cmpWord || "usual"} ${fmt(usual)}`;
  }
  return `<div class="card"><div class="k">${k}</div><div class="v ${cls}">${has ? fmt(mine) : "—"}</div><div class="d">${d || "&nbsp;"}</div></div>`;
}

// Lane trades tab: asks the app to read this game's replay file (downloading it first if needed).
let GA_TRADES = null;
async function loadTrades(A, again) {
  const el = $("v-trades"), id = A.g.gameId;
  if (!again && el.dataset.game === String(id) && el.dataset.state === "ok") return;
  el.dataset.game = String(id); el.dataset.state = "loading"; GA_TRADES = null;
  if (!again) el.innerHTML = `<div class="card"><div class="empty">Reading your replay file...</div></div>`;
  let r;
  try { r = await api("/api/trades/" + id); } catch (e) { el.innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`; return; }
  if (el.dataset.game !== String(id)) return;
  if (r.missing) {
    const cur = r.patch && currentPatch() && r.patch !== currentPatch();
    el.innerHTML = `<div class="card"><h2 style="margin-top:0">Lane trades need this game's replay</h2>
      <div class="sub" style="margin-bottom:10px">Every trade with your lane opponent comes from the replay file: damage each way, who started it, HP going in, and a playback on the map. The replay isn't on this computer yet.</div>
      ${cur ? `<div class="sub">This game is from patch ${esc(r.patch)}; League can only download replays from the current patch (${esc(currentPatch())}).</div>`
        : `<button class="primary" id="ltDl" ${r.download === "working" ? "disabled" : ""}>${r.download === "working" ? esc(r.message || "Downloading...") : "Download the replay"}</button>
           ${r.download === "error" ? `<div class="sub" style="margin-top:8px;color:var(--red-ink)">${esc(r.message)}</div>` : ""}`}</div>`;
    const b = $("ltDl");
    if (b) b.onclick = async () => { b.disabled = true; b.textContent = "Downloading..."; try { await api(`/api/trades/${id}/download`, { method: "POST" }); } catch (e) {} setTimeout(() => loadTrades(A, true), 2000); };
    if (r.download === "working") setTimeout(() => loadTrades(A, true), 2000);
    return;
  }
  if (r.error) { el.innerHTML = `<div class="card"><div class="empty">${esc(r.error)}</div></div>`; return; }
  el.dataset.state = "ok";
  // Your recording on top (when the app recorded this game), the trade breakdown under it
  if ($("rpInline")?.closeRec) $("rpInline").closeRec();
  el.innerHTML = `<div id="rpInline"></div><div id="ltBody"></div>`;
  await LT.show($("ltBody"), r, A);
  const rec = await recInfo(A);
  if (rec.exists && el.dataset.game === String(id)) {
    const first = (r.trades || []).find(t => t.solo !== false);
    $("rpInline").innerHTML = `<div class="lt-review"><div><b>Watch your lane with the coach</b><br><span>Your recording, full window, with cooldowns and the coach's read on every trade.</span></div><button class="primary" id="ltWatch">▶ Watch</button></div>`;
    GA_TRADES = r;
    $("ltWatch").onclick = () => openReview(A, r, Math.max(0, (first ? first.t0 : 90) - 3));
    if (!again) openReview(A, r, Math.max(0, (first ? first.t0 : 90) - 3));
  }
}

// ---------------------------------------------------------------- Lane trades (decoded from the game's replay file)
const LT = (() => {
const MINIONS={blue:{src:"/assets/minion-blue.png",w:130,h:120,u:0.857},red:{src:"/assets/minion-red.png",w:140,h:124,u:0.857}};
const SPELLS={};          // champion id -> {Q,W,E,R: icon url}
const CHAMP_ICON=(id)=>`https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/champion/${id}.png`;
async function loadSpells(ids){
  for(const id of ids){ if(SPELLS[id]||!DD.v) continue;
    try{const j=await (await fetch(`https://ddragon.leagueoflegends.com/cdn/${DD.v}/data/en_US/champion/${id}.json`)).json();
      const c=Object.values(j.data)[0]; SPELLS[id]={};"QWER".split("").forEach((k,n)=>SPELLS[id][k]=`https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/spell/${c.spells[n].image.full}`)}catch(e){}}
}
// Replay names (SKIN) -> Data Dragon ids (same except letter case)
function ddId(name){const l=String(name).toLowerCase();for(const c of Object.values(DD.champ)) if(c.id.toLowerCase()===l) return c.id; return name;}

const NICE={MissFortune:"Miss Fortune",DrMundo:"Dr. Mundo",MonkeyKing:"Wukong",KSante:"K'Sante",Khazix:"Kha'Zix",Chogath:"Cho'Gath",Velkoz:"Vel'Koz",KogMaw:"Kog'Maw",LeeSin:"Lee Sin",JarvanIV:"Jarvan IV",TahmKench:"Tahm Kench",MasterYi:"Master Yi",XinZhao:"Xin Zhao",TwistedFate:"Twisted Fate",AurelionSol:"Aurelion Sol",RenataGlasc:"Renata Glasc"};
const nm=s=>{for(const c of Object.values(DD.champ)) if(c.id===s) return c.name; return NICE[s]||s}, clk=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,"0")}`;
function judge(tr){
  const meL=tr.took/tr.hpMe[1], opL=tr.dealt/tr.hpOpp[1];
  if(tr.solo===false){const en=(tr.others||[]).some(o=>o.side==="enemy"),al=(tr.others||[]).some(o=>o.side==="ally");
    return ["help", en&&al?"Skirmish":en?"Gank":"2v1"];}
  if(tr.died.includes("you")&&tr.died.includes("them")) return ["even","Traded kills"];
  if(tr.died.includes("you")) return ["lost","You died"];
  if(tr.died.includes("them")) return ["won","You got the kill"];
  if(opL-meL>0.04 && opL>1.25*meL) return ["won","Won"];
  if(meL-opL>0.04 && meL>1.25*opL) return ["lost","Lost"];
  return ["even","Even"];
}
function why(tr,v){
  if(v==="help"){const L=(tr.others||[]).map(o=>`${LT.nm(o.champ)} (${o.side==="ally"?"your team":"their team"})`);
    return `Not a 1v1: ${L.join(", ")} ${L.length>1?"were":"was"} there, so it doesn't count as a won or lost trade.`;}
  const out=[], dl=tr.lv[0]-tr.lv[1], meL=tr.took/tr.hpMe[1], opL=tr.dealt/tr.hpOpp[1];
  const mySeq=tr.seq.filter(s=>s.w==="you").map(s=>s.k), thSeq=tr.seq.filter(s=>s.w==="them").map(s=>s.k);
  if(v==="lost"||v==="even"){
    if(dl<0) out.push(`You fought a level down (${tr.lv[0]} vs ${tr.lv[1]}).`);
    if(tr.first==="them"&&tr.dealt===0) out.push("They poked you and you didn't hit back.");
    else if(tr.first==="them"&&!mySeq.length) out.push("They started it and you answered with autos only.");
    if(tr.solo===undefined&&tr.gank>100) out.push(`Someone else joined: ${tr.gank} extra damage on the two of you.`);
    if(tr.first==="you"&&v==="lost"&&mySeq.length) out.push(`You went in (${mySeq.join(" → ")}) and they out-traded you.`);
  } else {
    if(dl>0) out.push(`You used your level lead (${tr.lv[0]} vs ${tr.lv[1]}).`);
    if(tr.first==="you"&&mySeq.length) out.push(`You started it with ${mySeq.join(" → ")}.`);
    if(tr.first==="them"&&tr.dealt>tr.took) out.push("They started it and you punished.");
  }
  if(tr.died.length&&v!=="won"&&!out.length) out.push("The fight ended in a death.");
  return out.join(" ");
}

// "Going in": players, levels and gold on each side of the fight a kill or death was part of.

const fightFull = () => { try { return localStorage.getItem("custy.fullItems") === "1"; } catch { return false; } };
function fightPanel(A, f) {
  if (!f || !A.hasItems) return "";
  const side = (list, label) => {
    const lv = list.reduce((a, x) => a + x.lv, 0), built = list.reduce((a, x) => a + x.built + x.parts, 0), un = list.reduce((a, x) => a + x.unspent, 0);
    const k = (v) => (v / 1000).toFixed(1) + "k";
    return `<div class="fs"><b>${label}: ${list.length}</b> · levels ${lv} · ${k(built)} in items${un >= 300 ? ` · ${k(un)} not spent` : ""}
      <div class="fp">${list.map(x => { const done = x.items.filter(isCompleted).concat(x.items.filter(isBoots)), rest = x.items.filter(id => !done.includes(id));
        const its = `${done.map(id => `<img class="done" src="${itemIcon(id)}" title="${esc(itemName(id))}" alt="">`).join("")}${rest.map(id => `<img src="${itemIcon(id)}" title="${esc(itemName(id))}" alt="">`).join("")}`;
        const gold = `${k(x.built + x.parts)}${x.unspent >= 600 ? ` <em>+${k(x.unspent)} unspent</em>` : ""}`;
        return `<div class="fpl">${pidIcon(A, x.pid, "fc")}<span class="nm"><span class="name">${esc(A.champOf(x.pid))} </span><i>lv ${x.lv}</i></span>
          <span class="its">${its || `<span class="sub">no items</span>`}</span><span class="g">${gold}</span>
          <span class="pop">${its || "no items"}</span></div>`; }).join("")}</div></div>`;
  };
  const S = (l) => ({ n: l.length, lv: l.reduce((a, x) => a + x.lv, 0), items: l.reduce((a, x) => a + x.built + x.parts, 0), un: l.reduce((a, x) => a + x.unspent, 0) });
  const u = S(f.us), t = S(f.them), why = [];
  if (u.n !== t.n) why.push(u.n > t.n ? `you had the numbers (${u.n}v${t.n})` : `you were a player down (${u.n}v${t.n})`);
  else {
    const dl = u.lv - t.lv, di = u.items - t.items;
    if (Math.abs(dl) >= 2) why.push(dl > 0 ? `your side was ${dl} levels up` : `their side was ${-dl} levels up`);
    if (Math.abs(di) >= 800) why.push(`${di > 0 ? "your" : "their"} side had ${(Math.abs(di) / 1000).toFixed(1)}k more in items`);
    if (Math.abs(di) >= 800 && Math.sign(di) !== Math.sign((u.items + u.un) - (t.items + t.un))) why.push(`even though ${di > 0 ? "they" : "you"} had more total gold, some of it wasn't spent`);
    if (!why.length) why.push("about even");
  }
  return `<details class="fight${fightFull() ? " full" : ""}"><summary>Going in: ${why.join(", ")}</summary>${side(f.us, "Your side")}${side(f.them, "Their side")}
    <label class="fulltog"><input type="checkbox" data-fullitems${fightFull() ? " checked" : ""}> Show all items</label>
    <div class="sub">${fightFull() ? "" : "Hover a champion to see their items. "}Items from purchases; unspent gold is from the minute before, so it's approximate. Summoner spells and cooldowns aren't in the data.</div></details>`;
}

// A death that was worth it: your team came out ahead in that fight, took an objective for it,
// or (in lane) you were still further ahead a minute after dying than you were 3 minutes before.
function worthIt(A, d) {
  const f = A.fightOf(d.e), took = tookAfter(A, d.t);
  if (f && f.theirDeaths > f.ourDeaths) return { why: `your team came out ${f.theirDeaths} for ${f.ourDeaths} in that fight` };
  const big = took.filter(x => /Baron|Elder|dragon|Herald|Atakhan|inhibitor|tower/.test(x));
  if (big.length && (!f || f.theirDeaths + 1 >= f.ourDeaths)) return { why: `your team took ${big.join(", ")} at the same time` };
  // In lane: only when your lane opponents killed you (a roam or gank changes the trade), and you
  // still gained on them in both gold and XP from 3 minutes before to a minute after.
  if (d.t < 840 && A.diff && A.xpdiff && A.opp) {
    const lane = { BOT: ["BOT", "SUPPORT"], SUPPORT: ["BOT", "SUPPORT"] }[A.role] || [A.role];
    const killers = [d.e.killerId, ...(d.e.assistingParticipantIds || [])].filter(p => p > 0);
    const byLane = killers.every(p => lane.includes(A.roles[p]) && A.g.participants.find(x => x.participantId === p)?.teamId !== A.me.teamId);
    const m = Math.floor(d.t / 60), a = Math.max(0, m - 3), b = Math.min(A.minutes, m + 1);
    const g = A.diff[b] - A.diff[a], x = A.xpdiff[b] - A.xpdiff[a];
    if (byLane && g >= 0 && x >= 0 && (g >= 250 || x >= 300))
      return { why: `you still gained ${signed(g)} gold and ${signed(x)} XP on ${champName(A.opp.championId)} from ${a}:00 to ${b}:00` };
  }
  return null;
}

// Pings: this game against what players at each rank average for this role (from 750 ranked games, Nov 2026).
const PING_RANKS = ["Bronze", "Silver", "Gold", "Emerald", "Master+"];
const PING_PM = { TOP: [.43, .46, .52, .54, .72], JUNGLE: [.71, .87, .92, 1.41, 1.82], MID: [.56, .62, .70, .88, 1.09], BOT: [.37, .46, .49, .56, .86], SUPPORT: [.44, .51, .61, .83, 1.08] };
// Riot sends about 14 ping counts. Group them all so the groups always add up to the total.
const PING_GROUPS = [
  ["Plays", { onMyWayPings: "On my way", allInPings: "All in", pushPings: "Push", assistMePings: "Assist me", holdPings: "Hold" }],
  ["Warnings", { enemyMissingPings: "Enemy missing", getBackPings: "Get back", retreatPings: "Retreat", dangerPings: "Caution" }],
  ["Vision", { enemyVisionPings: "Enemy vision", needVisionPings: "Need vision", visionClearedPings: "Vision cleared" }],
  ["General", { basicPings: "Basic ping", commandPings: "Info / timer" }],
];
function pingGroups(pings) {
  const known = new Set(PING_GROUPS.flatMap(g => Object.keys(g[1])));
  const rows = PING_GROUPS.map(([name, kinds]) => {
    const parts = Object.entries(kinds).map(([k, n]) => [n, +pings[k] || 0]);
    return { name, n: parts.reduce((a, p) => a + p[1], 0), parts };
  });
  const other = Object.entries(pings).filter(([k]) => !known.has(k)).map(([k, v]) => [k.replace(/Pings$/, "").replace(/([A-Z])/g, " $1").toLowerCase(), +v || 0]);
  const on = other.reduce((a, p) => a + p[1], 0);
  if (on) rows.push({ name: "Other", n: on, parts: other });
  return rows;
}
function pingCard(A) {
  if (!A.pings) return "";
  const total = Object.values(A.pings).reduce((a, v) => a + (+v || 0), 0), pm = total / (A.g.gameDuration / 60);
  const ladder = PING_PM[A.role] || PING_PM.MID, at = ladder.filter(v => pm >= v).length;
  const like = at === 0 ? "below the Bronze average" : at === 5 ? "at Master+ level" : `about ${PING_RANKS[at - 1]} level`;
  return `<div class="card pings" style="grid-column:1 / -1"><div class="k">Pings: telling your team what you're doing</div>
    <div class="prow"><b class="${at >= 4 ? "good" : at <= 1 ? "warn" : ""}">${total}</b><span>this game (${pm.toFixed(2)} a minute), ${like} for ${esc(ROLE_NAME[A.role] || "your role")}</span></div>
    <div class="ladder">${PING_RANKS.map((r, i) => `<span class="${i < at ? "on" : ""}">${r}<i>${Math.round(ladder[i] * A.g.gameDuration / 60)}</i></span>`).join("")}</div>
    <div class="kinds">${pingGroups(A.pings).map(g => `<span class="${g.n ? "" : "zero"}" title="${esc(g.parts.filter(p => p[1]).map(p => `${p[0]} ${p[1]}`).join(", ") || "None this game")}">${g.name} <b>${g.n}</b></span>`).join("")}</div>
    <div class="d">Higher ranks ping a lot more, mostly plays ("on my way") and warnings ("enemy missing", "get back"): they say what they're about to do. Hover a group to see what's in it. Numbers under each rank are its average for a game this long.</div></div>`;
}

// This game's kills, deaths and assists on the map. Tap a dot to jump to it in the list below.
function gameMap(A, myKills) {
  const S = 300, px = v => v / 14870 * S, py = v => S - v / 14980 * S, me = A.me.participantId;
  const assists = A.events.filter(e => e.type === "CHAMPION_KILL" && e.killerId !== me && (e.assistingParticipantIds || []).includes(me) && e.position);

  const zones = {}; for (const d of deaths) { const a = area(d.e.position.x, d.e.position.y); zones[a] = (zones[a] || 0) + 1; }
  const top = Object.entries(zones).sort((a, b) => b[1] - a[1])[0];
  return `<div class="card gmap"><svg viewBox="0 0 ${S} ${S}" width="100%" style="border-radius:8px;background:#0a1020;max-width:440px;display:block;margin:0 auto">
      <image href="https://ddragon.leagueoflegends.com/cdn/${DD.v}/img/map/map11.png" width="${S}" height="${S}" opacity=".5"/>
      ${assists.map(e => dot(e.position.x, e.position.y, 3.5, "#9aa6b8", .55, `Assist on ${esc(A.champOf(e.victimId))} · ${clock(e.timestamp / 1000)}`)).join("")}
      ${kills.map((k, i) => dot(k.position.x, k.position.y, 6.5, "var(--green, #4ade80)", .9, `Kill ${i + 1}: ${esc(A.champOf(k.victimId))} · ${clock(k.timestamp / 1000)}`, `kd-k${myKills.indexOf(k)}`, myKills.indexOf(k) + 1)).join("")}
      ${deaths.map(d => { const n = A.deaths.indexOf(d); return dot(d.e.position.x, d.e.position.y, 6.5, "var(--red)", .9, `Death ${n + 1} · ${clock(d.t)}${d.t < 840 ? " (before 14:00)" : ""}`, `kd-d${n}`, n + 1); }).join("")}
    </svg>
    <div class="legend"><span><i style="background:var(--green, #4ade80);border-radius:50%;width:9px;height:9px"></i>kills</span><span><i style="background:var(--red);border-radius:50%;width:9px;height:9px"></i>deaths</span><span><i style="background:#9aa6b8;border-radius:50%;width:7px;height:7px;opacity:.7"></i>assists</span></div>
    <div class="sub" style="margin-top:6px">Numbers match the list below; tap a dot to jump to it.${top && deaths.length >= 3 && top[1] / deaths.length >= .4 ? ` ${top[1]} of your ${deaths.length} deaths were in ${esc(top[0])}.` : ""}</div></div>`;
}

// A champion's square icon for a participant in this game.
const pidIcon = (A, pid, cls = "") => { const c = A.g.participants.find(p => p.participantId === pid)?.championId;
  return c && DD.champ[c] ? `<img class="ci ${cls}" src="${champIcon(c)}" alt="" title="${esc(champName(c))}">` : ""; };
function killRow(A, k, n) {

function deathRow(A, d) {

      ${notes.length ? `<div class="cmp">${notes.join(" · ")}</div>` : ""}${fightPanel(A, A.fightOf(e))}</div></div>
    <div class="acts" data-pv="d${Math.round(d.t)}"><button class="primary" data-watch="${Math.max(0, d.t - 30)}">Watch in my replay</button><button data-clip="${d.t}" data-cpos="${e.position ? e.position.x + "," + e.position.y : ""}" data-clabel="${esc("Death at " + clock(d.t))}">● Clip</button></div>
    <div class="gkpb" hidden></div>
  </div>`;
}

const benchCache = {};
// Expert numbers for "Jhin-BOT". A champion with none yet is asked about again next time.
function getBench(name) {
  return benchCache[name] ??= api("/api/benchmark/" + name).catch(() => ({ missing: true }))
    .then(b => { if (b.missing) delete benchCache[name]; return b; });
}
async function loadExperts(A) {
  const champ = DD.champ[A.me.championId]?.id, role = A.role;
  const el = $("v-experts");
  if (!champ || !role) { el.innerHTML = `<div class="empty">Couldn't tell this game's champion or role.</div>`; return; }
  const name = champ + "-" + role;
  let B;
  B = await getBench(name);
  if (!document.body.contains(el)) return;
  if (B.missing) {
    el.innerHTML = `<div class="card" style="margin-top:16px">No expert data for <b>${esc(champName(A.me.championId))} ${esc(ROLE_NAME[role] || role)}</b> yet.
      <div class="sub" style="margin-top:4px">${B.offline ? "Couldn't reach custy.gg." : "There aren't enough high-elo games on this champion in this role yet (needs 40)."}</div></div>`;
    return;
  }
  el.innerHTML = expertsView(A, B);
  el.querySelectorAll("[data-watch]").forEach(b => b.onclick = () => watch(A.g.gameId, +b.dataset.watch, b)); recButtons(A);
  markExpired(el, A.g.gameId);
  el.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    el.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
    el.querySelector("#xchart").innerHTML = benchChart(A, B, b.dataset.k);
  });
}

const BP = [5, 10, 15, 20];
const METRICS = [
  ["gold", "Gold", v => Math.round(v).toLocaleString()],
  ["cs", "CS", v => Math.round(v)],
  ["level", "Level", v => (Math.round(v * 10) / 10)],
  ["xpdiff", "XP vs lane opponent", v => signed(v)],
  ["gdiff", "Gold vs lane opponent", v => signed(v), "diff"],
  ["csdiff", "CS vs lane opponent", v => signed(v)],
];
const mine = (A, k) => ({ gdiff: A.diff, gold: A.myGold, cs: A.myCs })[k] ?? A[k];

function findings(A, B) {
  const out = [];
  // Break points that fall below the experts' middle half
  for (const [k, label, fmt] of METRICS) {
    const s = mine(A, k); if (!s) continue;
    for (const m of [10, 15, 20]) {
      const b = B.minutes[k]?.[m]; if (!b || s.length <= m) continue;
      const [p25, p50, p75] = b, spread = Math.max(1, p75 - p25);
      if (s[m] < p25) out.push({ sev: (p25 - s[m]) / spread, t: m * 60,
        title: `${label} at ${m}:00: ${fmt(s[m])}`, text: `Experts: ${fmt(p50)} (middle half ${fmt(p25)} to ${fmt(p75)}).` });
    }
  }
  // Keep the worst minute per metric
  const seen = new Set(); const dedup = out.sort((a, b) => b.sev - a.sev).filter(f => { const k = f.title.split(" at ")[0]; if (seen.has(k)) return false; seen.add(k); return true; });
  // Items
  const items = B.items, byId = Object.fromEntries(items.map(i => [i.id, i]));
  A.items.slice(0, 5).forEach((b, n) => {
    const e = byId[b.id], slot = n + 1;
    if (!e) { dedup.push({ sev: 0.8, t: b.t, title: `${itemName(b.id)} (item ${slot})`, text: `Experts on ${champName(A.me.championId)} almost never build it.` }); return; }
    const key = isArmorPen(b.id) ? "armor" + Math.min(A.armorN, 2) : isMagicPen(b.id) ? "mr" + Math.min(A.mrN, 2) : null;
    const r = key && e.by[key] ? e.by[key][0] / Math.max(1, e.by[key][1]) : e.rate;
    if (e.rate < 0.2) dedup.push({ sev: 0.7, t: b.t, title: `${itemName(b.id)} as item ${slot}`, text: `Only ${Math.round(e.rate * 100)}% of expert games build it at all.` });
    // Armor pen: champions get ~50+ armor from levels alone by 20-25 min, so it's worth it 3rd even into a squishy team.
    else if (isPctPen(b.id) && slot >= Math.max(4, Math.round(e.slot) + 1)) {
      const arm = enemyArmorAt(A, Math.round(e.time / 60));
      dedup.push({ sev: 1 + (slot - e.slot) * 0.3, t: b.t, title: `${itemName(b.id)} came ${ord(slot)}, at ${clock(b.t)}`,
        text: `Experts who build it get it ${ord(Math.round(e.slot))} (~${clock(e.time)}).${arm ? ` At ${Math.round(e.time / 60)}:00 the enemy team already averaged <b>${arm}</b> armor` : " By 20–25 minutes most champions have 50+ armor from levels alone"}${A.armorN ? "" : ", even without armor items"}, so it pays off as a 3rd item. It matters most once real team fights start.` });
    }
    else if (slot >= e.slot + 2 && key && r < 0.4) dedup.push({ sev: 0.5, t: b.t, title: `${itemName(b.id)} came ${ord(slot)}, at ${clock(b.t)}`,
      text: `Experts who build it usually get it ${ord(Math.round(e.slot))} (~${clock(e.time)}), but only ${Math.round(r * 100)}% of their games ${defenseText(key)} include it. Against this team it wasn't urgent.` });
    else if (slot >= e.slot + 2) dedup.push({ sev: 1 + (slot - e.slot) * 0.3, t: b.t, title: `${itemName(b.id)} came ${ord(slot)}, at ${clock(b.t)}`,
      text: `Experts buy it ${ord(Math.round(e.slot))}, around ${clock(e.time)}${key ? `, and ${Math.round(r * 100)}% of their games ${defenseText(key)} include it` : ""}.` });
  });
  // Items experts usually get in games like this that you didn't
  const mineIds = new Set(A.items.slice(0, 4).map(b => b.id));
  for (const e of items) {
    if (mineIds.has(e.id)) continue;
    const key = isArmorPen(e.id) ? "armor" + Math.min(A.armorN, 2) : isMagicPen(e.id) ? "mr" + Math.min(A.mrN, 2) : null;
    if (!key || !e.by[key] || e.by[key][1] < 8) continue;
    const r = e.by[key][0] / e.by[key][1];
    if (r >= 0.6 && A.minutes >= 22) dedup.push({ sev: 1.2, t: e.time, title: `No ${e.name} in your first 4 items`, text: `Experts build it in ${Math.round(r * 100)}% of games ${defenseText(key)}, usually ${ord(Math.round(e.slot))}.` });
  }
  // Timings
  const T = B.timings, cmp = (mineV, b, title, fmt, worse) => {
    if (mineV == null || !b) return; const [p25, p50, p75] = b;
    if (worse(mineV, p25, p75)) dedup.push({ sev: 0.9, t: null, title: `${title}: ${fmt(mineV)}`, text: `Experts: ${fmt(p50)} (middle half ${fmt(p25)} to ${fmt(p75)}).` });
  };
  cmp(A.backs[0]?.t, T.first_back, "First back", clock, (v, lo, hi) => v > hi + 30);
  cmp(A.firstItem, T.legendary1, "First item", clock, (v, lo, hi) => v > hi);
  cmp(A.deaths.filter(d => d.t < 840).length, T.deaths_14, "Deaths before 14:00", v => Math.round(v), (v, lo, hi) => v > hi);
  cmp(A.deaths.length, T.deaths, "Deaths", v => Math.round(v), (v, lo, hi) => v > hi);
  return dedup.sort((a, b) => b.sev - a.sev).slice(0, 6);
}
const ord = (n) => n + (["th", "st", "nd", "rd"][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || "th");
const isArmorPen = (id) => /armor penetration|lethality/i.test(DD.items[id]?.description || "") || (DD.items[id]?.stats?.FlatArmorPenetrationMod || 0) > 0 || /Dominik|Mortal Reminder|Serylda|Black Cleaver/i.test(itemName(id));
const isPctPen = (id) => /Dominik|Mortal Reminder|Serylda|Black Cleaver|Terminus/i.test(itemName(id));
const isMagicPen = (id) => /magic penetration/i.test(DD.items[id]?.description || "") || /Void Staff|Cryptbloom|Shadowflame/i.test(itemName(id));
const defenseText = (key) => ({ armor0: "where no enemy built armor", armor1: "where one enemy built armor", armor2: "where two or more enemies built armor",
  mr0: "where no enemy built magic resist", mr1: "where one enemy built magic resist", mr2: "where two or more enemies built magic resist" })[key];

function expertsView(A, B) {
  const champ = champName(A.me.championId), F = findings(A, B);
  const cell = (k, m, fmt) => {
    const s = mine(A, k), b = B.minutes[k]?.[m];
    if (!s || s.length <= m) return `<td class="sub">—</td>`;
    const cls = b ? (s[m] < b[0] ? "bad" : s[m] > b[2] ? "good" : "") : "";
    return `<td><span class="y ${cls}">${fmt(s[m])}</span>${b ? `<span class="e">experts ${fmt(b[1])} (${fmt(b[0])} to ${fmt(b[2])})</span>` : ""}</td>`;
  };
  const byId = Object.fromEntries(B.items.map(i => [i.id, i]));
  const tRow = (label, mineV, b, fmt, lowerBetter = true) => {
    const cls = mineV == null || !b ? "" : lowerBetter ? (mineV > b[2] ? "bad" : mineV < b[0] ? "good" : "") : (mineV < b[0] ? "bad" : mineV > b[2] ? "good" : "");
    return `<tr><td>${label}</td><td><span class="y ${cls}">${mineV == null ? "—" : fmt(mineV)}</span></td><td>${b ? fmt(b[1]) : "—"}</td><td class="sub">${b ? fmt(b[0]) + " to " + fmt(b[2]) : ""}</td></tr>`;
  };
  const T = B.timings;
  return `
  <p class="sub" style="margin:14px 0 0">Compared with <b>${B.games}</b> ranked games from <b>${B.players}</b> ${/onetricks/.test(B.source || "") ? `top ${esc(champ)} one-tricks on onetricks.gg` : `Master+ players on ${esc(champ)}`} (${esc(B.regions.join(", "))}), built ${esc(B.built)}. Expert numbers are the middle game (median) and the middle half of their games.</p>

  <h2>What stands out</h2>
  <div class="card">${F.length ? F.map(f => `<div class="finding"><b>${esc(f.title)}</b><span>${f.text}</span>
      ${f.t != null ? ` <button style="margin-left:8px;padding:2px 8px" data-watch="${Math.max(0, f.t - 30)}">Watch ${clock(Math.max(0, f.t - 30))}</button>` : ""}</div>`).join("")
    : `<div class="empty" style="padding:10px 0">You were within the experts' usual range on everything checked.</div>`}</div>

  <h2>Break points</h2>
  <div class="card"><table class="grid"><tr><th></th>${BP.map(m => `<th>${m}:00</th>`).join("")}</tr>
    ${METRICS.map(([k, label, fmt]) => `<tr><td>${label}</td>${BP.map(m => cell(k, m, fmt)).join("")}</tr>`).join("")}</table></div>

  <h2>Over the game</h2>
  <div class="card"><div class="seg">${METRICS.filter(([k]) => mine(A, k)).map(([k, label], i) => `<button data-k="${k}" class="${i ? "" : "on"}">${label}</button>`).join("")}</div>
    <div id="xchart">${benchChart(A, B, "gold")}</div>
    <div class="legend"><span><i style="background:var(--gold)"></i>You</span><span><i style="background:var(--blue-wash);border:1px solid var(--blue)"></i>Middle half of expert games</span><span style="color:var(--red-ink)">✕ your deaths</span></div></div>

  ${setupCard(A, B)}
  <h2>Build</h2>
  ${buildStrip(A)}
  ${buildPaths(A, B)}
  <div class="card"><table class="grid"><tr><th>Your items</th><th>Bought</th><th>Experts</th><th>How often experts build it</th></tr>
    ${A.items.slice(0, 6).map((b, n) => { const e = byId[b.id]; return `<tr><td>${n + 1}. ${itemTag(b.id)}</td><td>${clock(b.t)}</td>
      <td>${e ? `usually ${ord(Math.round(e.slot))}, ~${clock(e.time)}` : "—"}</td><td>${e ? Math.round(e.rate * 100) + "%" : "rarely"}</td></tr>`; }).join("") || `<tr><td colspan="4" class="sub">No completed items.</td></tr>`}
  </table>
  <div class="sub" style="margin-top:10px">Enemies who built armor: <b>${A.armorN}</b> · magic resist: <b>${A.mrN}</b>.</div></div>

  <h2>Timings</h2>
  <div class="card"><table class="grid"><tr><th></th><th>You</th><th>Experts</th><th>Middle half</th></tr>
    ${tRow("First back", A.backs[0]?.t ?? null, T.first_back, clock)}
    ${tRow("Gold spent on first back", A.backs[0]?.spent ?? null, T.first_back_gold, v => Math.round(v).toLocaleString(), false)}
    ${tRow("Backs before 14:00", A.backs.filter(b => b.t < 840).length, T.backs_before_14, v => Math.round(v), false)}
    ${tRow("First item", A.firstItem, T.legendary1, clock)}
    ${tRow("Second item", A.items[1]?.t ?? null, T.legendary2, clock)}
    ${tRow("Level 6 vs opponent (s)", A.lvl6 != null && A.oppLvl6 != null ? A.lvl6 - A.oppLvl6 : null, T.lvl6_gap, v => (v <= 0 ? Math.round(-v) + "s ahead" : Math.round(v) + "s behind"))}
    ${tRow("Deaths before 14:00", A.deaths.filter(d => d.t < 840).length, T.deaths_14, v => Math.round(v))}
    ${tRow("Deaths", A.deaths.length, T.deaths, v => Math.round(v))}
  </table></div>`;
}

function benchChart(A, B, k) {
  const curve = mine(A, k), band = B.minutes[k] || [];
  if (!curve) return `<div class="sub">Not available for this game.</div>`;
  const W = 1000, H = 240, L = 56, R = 12, T = 12, Bm = 26, n = A.minutes;
  let lo = Math.min(...curve), hi = Math.max(...curve);
  band.slice(0, n + 1).forEach(b => { if (b) { lo = Math.min(lo, b[0]); hi = Math.max(hi, b[2]); } });
  if (k.endsWith("diff")) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * .08 || 1; lo -= pad; hi += pad;
  const x = m => L + (m / n) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (H - T - Bm);
  const fmt = METRICS.find(mm => mm[0] === k)[2];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;

// Radar: one spoke per skill, from how far each stat sits from the expert median (in expert spreads).
const AXES = [
  ["Farming", ["cs10"]], ["Gold", ["gold15", "gd15"]], ["XP lead", ["xpd10"]],
  ["Staying alive", ["deaths14", "deaths"]], ["Tempo", ["back", "lvl6"]], ["Build speed", ["item1"]],

function radarSvg(stats) {
  const by = Object.fromEntries(stats.map(s => [s.m.k, s]));

    const ss = ks.map(k => by[k]).filter(Boolean);

  }).filter(Boolean);

  const W = 400, H = 300, cx = 200, cy = 152, R = 112, N = axes.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N, r = R * v / 100; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
  const val = z => Math.max(8, Math.min(100, 50 + z * 25));
  const poly = (vs) => vs.map((v, i) => pt(i, v).map(n => n.toFixed(1)).join(",")).join(" ");
  let o = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Your skills against experts" style="max-width:440px;display:block;margin:6px auto 0">`;
  for (const ring of [25, 50, 75, 100]) o += `<polygon points="${poly(axes.map(() => ring))}" fill="none" stroke="${ring === 50 ? "transparent" : "var(--line-soft)"}"/>`;
  axes.forEach((_, i) => { const [x, y] = pt(i, 100); o += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line-soft)"/>`; });
  o += `<polygon points="${poly(axes.map(() => 50))}" fill="var(--blue-wash)" stroke="var(--blue)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
  o += `<polygon points="${poly(axes.map(a => val(a.z)))}" fill="rgba(227,184,102,.22)" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>`;
  axes.forEach((a, i) => {
    const [x, y] = pt(i, val(a.z)), col = a.z < -0.5 ? "var(--red)" : a.z > 0.5 ? "var(--blue)" : "var(--gold)";
    o += `<circle cx="${x}" cy="${y}" r="5" fill="${col}" stroke="var(--deck)" stroke-width="2"><title>${a.parts.map(p => `${p.m.label}: you ${p.m.fmt(p.you)}, experts ${p.m.fmt(p.exp)}`).join("\n")}</title></circle>`;
    const [lx, ly] = pt(i, 116), anchor = Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end";
    o += `<text x="${lx}" y="${ly + 4}" text-anchor="${anchor}" style="font-size:12px;fill:${a.z < -0.5 ? "var(--red-ink)" : a.z > 0.5 ? "var(--blue-ink)" : "var(--mute)"}">${a.label}</text>`;
  });
  return o + "</svg>";
}

// Minute curve: your value minus the expert median on that game's champion, averaged over games.
const CURVES = { gold: ["Gold", A => A.myGold], cs: ["CS", A => A.myCs], xp: ["XP", A => A.xp] };
function curveSvg(rows, k) {
  const pick = CURVES[k][1], pts = [];

    const ds = [], lo = [], hi = [];

      const b = r.B?.minutes?.[k]?.[m], sr = pick(r.A);
      if (!b || !sr || sr.length <= m) continue;
      ds.push(sr[m] - b[1]); lo.push(b[0] - b[1]); hi.push(b[2] - b[1]);
    }

    pts.push({ m, d: avg(ds), lo: avg(lo), hi: avg(hi), n: ds.length });
  }
  if (pts.length < 5) return `<div class="sub" style="padding:40px 0">Needs at least 3 games with expert data.</div>`;

  const label = CURVES[k][0], unit = k === "cs" ? " CS" : k === "xp" ? " XP" : "";

  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(v => v >= raw);
